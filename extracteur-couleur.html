<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracteur couleur</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
<style>
.scroll-btn {
  width:36px;
  height:36px;
  font-size:24px;
  touch-action:none;
}
#canvasScroll {
  background:#000;
  padding:2px;
  overflow:auto;
  height:70vh;
  box-sizing:border-box;
}
#canvas {
  display:block;
  touch-action:none;
  cursor:crosshair;
  image-rendering:pixelated;
}
#loupe {
  position:absolute;
  width:80px;
  height:80px;
  border:2px solid #000;
  background:#222;
  display:none;
  pointer-events:none;
  image-rendering:pixelated;
  box-shadow:2px 2px 0 #000;
}
#loupeCanvas {
  width:100%;
  height:100%;
}
/* Croix au centre */
#loupe:after {
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:1px;
  background:red;
}
#loupe:before {
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:1px;
  background:red;
}
/* Croix sur l'image */
.cross {
  position:absolute;
  width:36px;
  height:36px;
  pointer-events:none;
}
.cross:before, .cross:after {
  content:"";
  position:absolute;
  background:#c0c0c0;
}
.cross:before {
  left:50%; top:0; bottom:0;
  width:1px;
  margin-left:-1px;
}
.cross:after {
  top:50%; left:0; right:0;
  height:1px;
  margin-top:-1px;
}
#preview {
  width:32px;
  height:32px;
  display:inline-block;
  margin-right:6px;
  vertical-align:top;
}
.line{margin:3px 0;}
.value {
  display:inline-block;
  min-width:140px;
}
</style>
</head>
<body>
<h2>Extracteur couleur</h2>
<div class="section">
  <input type="file" id="fileinput" style="width:100%;box-sizing:border-box;">
  <input id="pastefileinput" style="width:100%;box-sizing:border-box;margin-top:10px;margin-bottom:10px" placeholder="Ou cliquer ici puis faire Ctrl+V" maxlength="0">
  <div id="canvasScroll" class="border-interne">
    <canvas id="canvas"></canvas>
  </div>
</div>
<div id="loupe">
  <canvas id="loupeCanvas" width="120" height="120"></canvas>
</div>
<div id="cross" class="cross" style="display:none;"></div>
<div class="section">
  <div id="preview" class="border-interne"></div>
<button class="scroll-btn" data-dir="left" data-target="canvasScroll">←</button>
<button class="scroll-btn" data-dir="right" data-target="canvasScroll">→</button>
<button class="scroll-btn" data-dir="up" data-target="canvasScroll">↑</button>
<button class="scroll-btn" data-dir="down" data-target="canvasScroll">↓</button>
  <div class="line">HEX :
    <span id="hexValue" class="value">-</span>
    <button onclick="copyText('hexValue', this)">Copier</button>
  </div>
  <div class="line">RGB :
    <span id="rgbValue" class="value">-</span>
    <button onclick="copyText('rgbValue', this)">Copier</button>
  </div>
  <div class="line">HSL :
    <span id="hslValue" class="value">-</span>
    <button onclick="copyText('hslValue', this)">Copier</button>
  </div>
  <div class="line">HSV :
    <span id="hsvValue" class="value">-</span>
    <button onclick="copyText('hsvValue', this)">Copier</button>
  </div>
</div>
<script src="outils.js"></script>
<script>
/* Variables */
var fileInput = document.getElementById("fileinput");
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var loupe = document.getElementById("loupe");
var loupeCanvas = document.getElementById("loupeCanvas");
var cross = document.getElementById("cross");
var lctx = loupeCanvas.getContext("2d");
var preview = document.getElementById("preview");
var hexSpan = document.getElementById("hexValue");
var rgbSpan = document.getElementById("rgbValue");
var hslSpan = document.getElementById("hslValue");
var hsvSpan = document.getElementById("hsvValue");
var currentImage = null;
/* Utils */
function prevent(e) {
    if (e.preventDefault) e.preventDefault();
    e.returnValue = false;
    return false;
}
/* Chargement image */
fileInput.onchange = function(){
    if (fileInput.files && fileInput.files.length > 0) {
        loadFile(fileInput.files[0]);
    }
};
function loadFile(file){
    var reader = new FileReader();
    reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
            currentImage = img;
            drawImageToCanvas(img);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}
function drawImageToCanvas(img) {
    var scroll = document.getElementById("canvasScroll");
    // Résolution réelle = résolution originale de l'image
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    // Dessin sans perte de résolution interne
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    // Hauteur d'affichage souhaitée
    var displayHeight = scroll.clientHeight - 4;
    // Même ratio que l'image originale
    var displayWidth = Math.round(
        img.naturalWidth * displayHeight / img.naturalHeight
    );
    // Taille visuelle uniquement
    canvas.style.width = displayWidth + "px";
    canvas.style.height = displayHeight + "px";
}
/* Copier */
function copyText(id, btn){
	var btn = event.target;
    var text = document.getElementById(id).innerHTML;
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    document.body.removeChild(t);
    btn.focus();
}
/* Conversions couleurs */
function toHex(c){ var h = c.toString(16); return h.length == 1 ? "0" + h : h; }
function rgbToHex(r,g,b){ return "#" + toHex(r) + toHex(g) + toHex(b); }
function rgbToHsl(r,g,b){
    var rf = r/255, gf = g/255, bf = b/255;
    var max = Math.max(rf,gf,bf), min = Math.min(rf,gf,bf);
    var h, s, l = (max + min) / 2;
    var d = max - min;
    if (d == 0) {
        h = 0; s = 0;
    } else {
        s = l < 0.5 ? d / (max + min) : d / (2 - max - min);
        if (max == rf) {
            h = (gf - bf) / d + (gf < bf ? 6 : 0);
        } else if (max == gf) {
            h = (bf - rf) / d + 2;
        } else {
            h = (rf - gf) / d + 4;
        }
        h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function rgbToHsv(r,g,b){
    var rf = r/255, gf = g/255, bf = b/255;
    var max = Math.max(rf,gf,bf), min = Math.min(rf,gf,bf);
    var d = max - min, h, s, v = max;
    if (max == 0) {
        s = 0; h = 0;
    } else {
        s = d / max;
        if (d == 0) {
            h = 0;
        } else {
            if (max == rf) {
                h = (gf - bf) / d + (gf < bf ? 6 : 0);
            } else if (max == gf) {
                h = (bf - rf) / d + 2;
            } else {
                h = (rf - gf) / d + 4;
            }
            h *= 60;
        }
    }
    return { h: Math.round(h), s: Math.round(s * 100), v: Math.round(v * 100) };
}
/* Lecture pixel + loupe */
function readPixel(x,y){
    if (!ctx) return;
    if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
    var d = ctx.getImageData(x,y,1,1).data;
    var r = d[0], g = d[1], b = d[2];
    preview.style.backgroundColor = "rgb(" + r + "," + g + "," + b + ")";
    var hex = rgbToHex(r,g,b);
    var hsl = rgbToHsl(r,g,b);
    var hsv = rgbToHsv(r,g,b);
    hexSpan.innerHTML = hex;
    rgbSpan.innerHTML = "rgb(" + r + "," + g + "," + b + ")";
    hslSpan.innerHTML = "hsl(" + hsl.h + "," + hsl.s + "%," + hsl.l + "%)";
    hsvSpan.innerHTML = "hsv(" + hsv.h + "," + hsv.s + "%," + hsv.v + "%)";
}
function showLoupe(x, y, e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = rect.width / canvas.width;
    var scaleY = rect.height / canvas.height;
    /* Position exacte de la souris */
    var displayX = e.clientX - rect.left;
    var displayY = e.clientY - rect.top;
    var realX = displayX / scaleX;
    var realY = displayY / scaleY;
    /* Taille de la zone observée */
    var loupeSize = 80;
    var sourceSize = Math.max(1, Math.round(loupeSize / Math.min(scaleX, scaleY)));
    /* Position de la zone */
    var sx = realX - sourceSize / 2;
    var sy = realY - sourceSize / 2;
    /* Dessin */
    lctx.clearRect(0, 0, 120, 120);
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(canvas, sx, sy, sourceSize, sourceSize, 0, 0, 120, 120);
    /* LA LOUPE SUIT TOUJOURS LA SOURIS */
    var lx = rect.left + window.scrollX + displayX - 40;
    var ly = rect.top + window.scrollY + displayY - 120;
    loupe.style.left = lx + "px";
    loupe.style.top = ly + "px";
    loupe.style.display = "block";
}
function hideLoupe(){
    loupe.style.display = "none";
}
function showCrossAt(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    cross.style.left = (rect.left + window.scrollX + x - 18) + "px";
    cross.style.top = (rect.top + window.scrollY + y - 18) + "px";
    cross.style.display = "block";
}
function hideCross(){
    cross.style.display = "none";
}
/* Coordonnées souris / touch */
function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    // Coordonnées dans le canvas affiché à l'écran
    var displayX = e.clientX - rect.left;
    var displayY = e.clientY - rect.top;
    // Conversion vers les coordonnées réelles de l'image
    var x = displayX * canvas.width / rect.width;
    var y = displayY * canvas.height / rect.height;
    return {
        x: Math.floor(x),
        y: Math.floor(y)
    };
}
/* Events canvas */
var draggingCross = false;
/* Pointer Events si disponibles */
if ("onpointerdown" in canvas) {
    canvas.onpointerdown = function(e){
        var p = getPos(e);
        draggingCross = true;
        if (e.pointerType === "touch") {
            if (canvas.setPointerCapture) {
                canvas.setPointerCapture(e.pointerId);
            }
            showLoupe(p.x, p.y, e);
        }
        readPixel(p.x, p.y);
        showCrossAt(e);
        if (e.preventDefault) e.preventDefault();
    };
    canvas.onpointermove = function(e){
        if (e.pointerType === "mouse" && !draggingCross) {
            var p = getPos(e);
            showLoupe(p.x, p.y, e);
            return;
        }
        var p = getPos(e);
        readPixel(p.x, p.y);
        showCrossAt(e);
        showLoupe(p.x, p.y, e);
        if (e.preventDefault) e.preventDefault();
    };
    canvas.onpointerup = function(e){
        draggingCross = false;
        if (e.pointerType === "touch") {
            if (canvas.hasPointerCapture &&
                canvas.hasPointerCapture(e.pointerId)) {
                canvas.releasePointerCapture(e.pointerId);
            }
            hideLoupe();
        }
        if (e.preventDefault) e.preventDefault();
    };
    canvas.onpointercancel = function(e){
        draggingCross = false;
        if (e.pointerType === "touch") {
            if (canvas.hasPointerCapture &&
                canvas.hasPointerCapture(e.pointerId)) {
                canvas.releasePointerCapture(e.pointerId);
            }
            hideLoupe();
        }
        if (e.preventDefault) e.preventDefault();
    };
} else {
    /* Ancien navigateur / Nintendo 3DS */
    canvas.ontouchstart = function(e){
        if (!e.touches || !e.touches.length) return;
        var t = e.touches[0];
        var p = getPos(t);
        draggingCross = true;
        readPixel(p.x, p.y);
        showCrossAt(t);
        showLoupe(p.x, p.y, t);
        if (e.preventDefault) e.preventDefault();
    };
    canvas.ontouchmove = function(e){
        if (!e.touches || !e.touches.length) return;
        var t = e.touches[0];
        var p = getPos(t);
        if (!draggingCross) return;
        readPixel(p.x, p.y);
        showCrossAt(t);
        showLoupe(p.x, p.y, t);
        if (e.preventDefault) e.preventDefault();
    };
    canvas.ontouchend = function(e){
        draggingCross = false;
        hideLoupe();
        if (e.preventDefault) e.preventDefault();
    };
    canvas.ontouchcancel = function(e){
        draggingCross = false;
        hideLoupe();
        if (e.preventDefault) e.preventDefault();
    };
}
</script>
</body>
</html>
