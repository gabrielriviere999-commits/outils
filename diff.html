<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff (comparer texte)</title>
<link rel="stylesheet" href="outils.css">
<style>
.card3 {
  padding:10px;
  box-sizing:border-box;
  width:100%;
}
#result {
  margin-top:5px;
  font-family:monospace;
  white-space:pre;
  overflow-x:auto;
  max-height:500px;
  max-height:70vh;
}
.line{display:table-row;}
.ln{display:table-cell;text-align:right;padding-right:5px;color:#fff;}
.prefix{width:20px;color:black;}
.same{background:#000;}
.added{background:green;}
.removed{background:red;}
</style>
</head>
<body>
<h2>Diff (comparer texte)</h2>
<div class="container">
<div class="card">
  <h3>Texte A (original)</h3>
  <textarea wrap="off" id="textA"></textarea>
  <button onclick="deleteA()" class="btn-color" style="background:#ff4444;">Effacer tout</button>
  <input type="file" id="textareaFiletextA">
</div>
<div class="card">
  <h3>Texte B (modifié)</h3>
  <textarea wrap="off" id="textB"></textarea>
  <button onclick="deleteB()" class="btn-color" style="background:#ff4444;">Effacer tout</button>
  <input type="file" id="textareaFiletextB">
</div>
</div>
<div class="card3 border-externe">
<button onclick="compare()" class="btn-color" style="background:#ff8800;">Comparer</button>
<div id="summary" style="margin-top:10px; font-weight:bold;"></div>
<div id="result" class="border-interne"></div>
</div>
<script src="outils.js"></script>
<script>
/* --- Effacer --- */
function deleteA() {
  document.getElementById("textA").value = "";
}
function deleteB() {
  document.getElementById("textB").value = "";
}
/* --- Diff ES3 ligne par ligne --- */
function simpleLineDiff(aLines, bLines) {
  var result = [];
  var maxLen = Math.max(aLines.length, bLines.length);
  var i, a, b;
  for (i = 0; i < maxLen; i++) {
    a = aLines[i];
    b = bLines[i];
    if (typeof a === "undefined" && typeof b !== "undefined") {
      result.push({ type: "added", aLine: "", bLine: b, aIndex: null, bIndex: i+1 });
    } else if (typeof a !== "undefined" && typeof b === "undefined") {
      result.push({ type: "removed", aLine: a, bLine: "", aIndex: i+1, bIndex: null });
    } else if (a === b) {
      result.push({ type: "same", aLine: a, bLine: b, aIndex: i+1, bIndex: i+1 });
    } else {
      result.push({ type: "removed", aLine: a, bLine: "", aIndex: i+1, bIndex: null });
      result.push({ type: "added", aLine: "", bLine: b, aIndex: null, bIndex: i+1 });
    }
  }
  return result;
}
function renderDiff(diff) {
  var container = document.getElementById("result");
  var summary = document.getElementById("summary");
  container.innerHTML = "";
  var changedLines = {}; // ← on stocke les lignes modifiées
  for (var i = 0; i < diff.length; i++) {
    var entry = diff[i];
    // Comptage correct : on marque la ligne comme modifiée
    if (entry.type === "added" && entry.bIndex != null) {
        changedLines[entry.bIndex] = true;
    }
    if (entry.type === "removed" && entry.aIndex != null) {
        changedLines[entry.aIndex] = true;
    }
    // Rendu visuel
    var div = document.createElement("div");
    div.className = "line " + entry.type;
    var prefix = document.createElement("div");
    prefix.className = "prefix";
    prefix.appendChild(document.createTextNode(
      entry.type === "same" ? " " : entry.type === "added" ? "+" : "-"
    ));
    var ln = document.createElement("div");
    ln.className = "ln";
    ln.appendChild(document.createTextNode(
      entry.type === "added" ? (entry.bIndex || "") : (entry.aIndex || "")
    ));
    var content = document.createElement("div");
    content.className = "content";
    content.appendChild(document.createTextNode(
      entry.type === "added" ? entry.bLine : entry.aLine
    ));
    div.appendChild(prefix);
    div.appendChild(ln);
    div.appendChild(content);
    container.appendChild(div);
  }
  // Maintenant on compte les lignes modifiées
  var diffCount = 0;
  for (var k in changedLines) diffCount++;
  // Résumé
  if (diffCount === 0) {
    summary.innerHTML = "Identique";
    summary.style.color = "green";
  } else {
    summary.innerHTML = diffCount + " ligne" + (diffCount > 1 ? "s" : "") + " différente" + (diffCount > 1 ? "s" : "");
    summary.style.color = "red";
  }
}
function compare() {
  var a = document.getElementById("textA").value.split("\n");
  var b = document.getElementById("textB").value.split("\n");
  renderDiff(simpleLineDiff(a, b));
}
</script>
</body>
</html>
