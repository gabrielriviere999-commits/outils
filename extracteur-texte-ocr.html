<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
<title>Extracteur texte OCR</title>
<style>
.canvas-wrapper {
  position:relative;
  width:100%;
  height:500px;
  height:70vh;
  overflow:auto;
  background:#222;
  box-sizing:border-box;
}
#canvas{cursor:crosshair;}
.progress-container {
  width:100%;
  height:22px;
  background:#ddd;
  overflow:hidden;
  margin-top:10px;
}
#progressBar {
  width:0%;
  height:100%;
  background:#4285f4;
  transition:width 0.1s linear;
}
.success{color:#188038;}
.error{color:#c5221f;}
</style>
</head>
<body>
<h2>Extracteur texte OCR</h2>
<!-- CHARGEMENT -->
<div class="toolbar">
	<label>Image :</label><input type="file" id="fileinput"><input id="pastefileinput" placeholder="Ou cliquer et Ctrl+V">
  <label>Langue :</label>
  <select id="language">
	<option value="fra">Français</option>
    <option value="eng">Anglais</option>
    <option value="spa">Espagnol</option>
    <option value="deu">Allemand</option><option value="ita">Italien</option>
    <option value="por">Portugais</option>
  </select>
<!-- OUTILS CANVAS -->
  <label for="zoomRange">Zoom :<input type="range" id="zoomRange" min="10" max="500" value="100" step="5"><span id="zoomValue">100 %</span></label>
  <label>Luminosité :<input type="range" id="brightness" min="-100" max="100" value="0"></label>
  <label">Contraste :<input type="range" id="contrast" min="-100" max="100" value="0"></label>
  <button id="grayScale">Niveaux de gris</button>
  <button id="threshold">Seuillage</button>
  <button id="resetImage">Réinitialiser</button>
</div>
<!-- CANVAS -->
<div class="section">
  <div class="canvas-wrapper" id="canvasWrapper"> <canvas id="canvas"></canvas></div>
  <div id="selectionInfo">Glisser sur l'image pour sélectionner une zone OCR </div>
</div>
<!-- OCR -->
<div class="toolbar">
  <button class="scroll-btn" data-dir="left" data-target="canvasWrapper">←</button>
  <button class="scroll-btn" data-dir="right" data-target="canvasWrapper">→</button>
  <button class="scroll-btn" data-dir="up" data-target="canvasWrapper">↑</button>
  <button class="scroll-btn" data-dir="down" data-target="canvasWrapper">↓</button>
  <button id="ocrButton" disabled>Lancer l'OCR</button>
  <button id="ocrFullButton" disabled>OCR de toute l'image</button>
  <button id="copyoutput">Copier</button>
  <button id="downloadButton">Télécharger TXT</button>
  <button id="clearButton">Effacer</button>
</div>
<div class="progress-container"><div id="progressBar"></div></div>
<div id="status">En attente d'une image.</div>
<!-- RESULTAT -->
<h3>Texte OCR</h3>
<textarea id="output" placeholder="Le texte reconnu apparaîtra ici..."></textarea>
<details>
<summary>Bibliothèque Tesseract OCR</summary>
<a href="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js</a>
</details>
<script src="outils.js"></script>
<script src="libs/tesseract.min.js"></script>
<script>
(function () {
    "use strict";
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext("2d");
    var fileinput = document.getElementById("fileinput");
    var language = document.getElementById("language");
    var zoomRange = document.getElementById("zoomRange");
    var zoomValue = document.getElementById("zoomValue");
    var brightnessInput = document.getElementById("brightness");
    var contrastInput = document.getElementById("contrast");
    var grayScaleButton = document.getElementById("grayScale");
    var thresholdButton = document.getElementById("threshold");
    var resetImageButton = document.getElementById("resetImage");
    var ocrButton = document.getElementById("ocrButton");
    var ocrFullButton = document.getElementById("ocrFullButton");
    var copyButton = document.getElementById("copyButton");
    var downloadButton = document.getElementById("downloadButton");
    var clearButton = document.getElementById("clearButton");
    var result = document.getElementById("output");
    var status = document.getElementById("status");
    var progressBar = document.getElementById("progressBar");
    var selectionInfo = document.getElementById("selectionInfo");
    var originalImage = new Image();
    var imageLoaded = false;
    var zoom = 1;
    var originalWidth = 0;
    var originalHeight = 0;
    var selection = null;
    var selecting = false;
    var startX = 0;
    var startY = 0;
    var worker = null;
    var workerLanguage = null;
    /* UTILITAIRES */
    function setStatus(text, className) {
        status.innerHTML = text;
        status.className = "";
        if (className) { status.className = className;
        }
    }
    function setProgress(value) {
        if (value < 0) { value = 0;
        }
        if (value > 1) { value = 1;
        }
        progressBar.style.width = Math.round(value * 100) + "%";
    }
    function clamp(value, min, max) {
        if (value < min) { return min;
        }
        if (value > max) { return max;
        }
        return value;
    }
    /* CHARGEMENT IMAGE */
    fileinput.onchange = function () {
        if (!fileinput.files || !fileinput.files.length) { return;
        }
        var file = fileinput.files[0];
        var reader = new FileReader();
        reader.onload = function (event) {
			originalImage = new Image();
			originalImage.onload = function () {
			originalWidth = originalImage.naturalWidth || originalImage.width;
			originalHeight = originalImage.naturalHeight || originalImage.height;
			imageLoaded = true;
			// Ajuste automatiquement l'image à la hauteur disponible dans le canvas-wrapper.
			zoom = calculateInitialZoom();
			selection = null;
	        brightnessInput.value = 0;
		    contrastInput.value = 0;
		    zoomRange.value = Math.round(zoom * 100);
		    zoomValue.innerHTML = Math.round(zoom * 100) + " %";
		    drawImage();
		    ocrButton.disabled = false;
		    ocrFullButton.disabled = false; setStatus("Image chargée : " + originalWidth + " × " + originalHeight + " px.", "success" ); setProgress(0); }; originalImage.onerror = function () { setStatus("Impossible de charger cette image.", "error" ); };
		    originalImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };
    /* AFFICHAGE CANVAS */
    function drawImage() {
        if (!imageLoaded) { return;
        }
        var width = Math.round(originalWidth * zoom);
        var height = Math.round(originalHeight * zoom);
        canvas.width = width;
        canvas.height = height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0, width, height);
        applyAdjustments();
        drawSelection();
    }
    /* LUMINOSITE / CONTRASTE */
    function applyAdjustments() {
        var brightness = parseInt(brightnessInput.value, 10);
        var contrast = parseInt(contrastInput.value, 10);
        if (brightness === 0 && contrast === 0) { return;
        }
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;
        var factor = (259 * (contrast + 255)) /      (255 * (259 - contrast));
        var i;
        var r;
        var g;
        var b;
        for (i = 0; i < data.length; i += 4) { r = data[i]; g = data[i + 1]; b = data[i + 2]; r = factor * (r - 128) + 128 + brightness; g = factor * (g - 128) + 128 + brightness; b = factor * (b - 128) + 128 + brightness; data[i] = clamp(r, 0, 255); data[i + 1] = clamp(g, 0, 255); data[i + 2] = clamp(b, 0, 255);
        }
        ctx.putImageData(imageData, 0, 0);
    }
    brightnessInput.oninput = function () {
        drawImage();
    };
    contrastInput.oninput = function () {
        drawImage();
    };
    /* NIVEAUX DE GRIS */
    grayScaleButton.onclick = function () {
        if (!imageLoaded) { return;
        }
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;
        var i;
        var gray;
        for (i = 0; i < data.length; i += 4) { gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; data[i] = gray; data[i + 1] = gray; data[i + 2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);
        drawSelection();
    };
    /* SEUILLAGE */
    thresholdButton.onclick = function () {
        if (!imageLoaded) { return;
        }
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;
        var i;
        var gray;
        var value;
        for (i = 0; i < data.length; i += 4) { gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; if (gray > 160) { value = 255; } else { value = 0; } data[i] = value; data[i + 1] = value; data[i + 2] = value;
        }
        ctx.putImageData(imageData, 0, 0);
        drawSelection();
    };
    /* RESET IMAGE */
    resetImageButton.onclick = function () {
        if (!imageLoaded) {
            return;
        }
        brightnessInput.value = 0;
        contrastInput.value = 0;
        zoom = calculateInitialZoom();
        zoomRange.value = Math.round(zoom * 100);
        zoomValue.innerHTML = Math.round(zoom * 100) + " %";
        selection = null;
        drawImage();
        updateSelectionInfo();
    };
    /* ZOOM */
    zoomRange.oninput = function () {
        zoom = parseInt(zoomRange.value, 10) / 100;
        zoomValue.innerHTML = Math.round(zoom * 100) + " %";
        drawImage();
    };
    function calculateInitialZoom() {
        var wrapper = document.getElementById("canvasWrapper");
        var availableWidth = wrapper.clientWidth - 40;
        var availableHeight = wrapper.clientHeight - 20;
        if (availableWidth <= 0 || availableHeight <= 0) {
            return 1;
        }
        var zoomX = availableWidth / originalWidth;
        var zoomY = availableHeight / originalHeight;
        var calculatedZoom = Math.min(zoomY, zoomX);
        return calculatedZoom;
    }
    /* SELECTION SOURIS + TACTILE */
    function getPointerPosition(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var x = clientX - rect.left;
        var y = clientY - rect.top;
        // Le canvas peut être affiché avec une taille CSS différente de sa taille interne.
        x *= canvas.width / rect.width;
        y *= canvas.height / rect.height;
        // Sécurité : on reste toujours dans le canvas.
        x = clamp(x, 0, canvas.width);
        y = clamp(y, 0, canvas.height);
        return {
            x: x,
            y: y
        };
    }
    // SOURIS
    canvas.onmousedown = function (event) {
        if (!imageLoaded) {
            return;
        }
        var pos = getPointerPosition(
            event.clientX,
            event.clientY
        );
        startX = pos.x;
        startY = pos.y;
        selecting = true;
        selection = {
            x: startX,
            y: startY,
            width: 0,
            height: 0
        };
        drawImage();
        // Évite certains comportements indésirables du navigateur pendant la sélection.
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    canvas.onmousemove = function (event) {
        if (!selecting) {
            return;
        }
        var pos = getPointerPosition(
            event.clientX,
            event.clientY
        );
        var x = pos.x;
        var y = pos.y;
        selection = {
            x: Math.min(startX, x),
            y: Math.min(startY, y),
            width: Math.abs(x - startX),
            height: Math.abs(y - startY)
        };
        drawImage();
        updateSelectionInfo();
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    canvas.onmouseup = function () {
        if (!selecting) {
            return;
        }
        selecting = false;
        updateSelectionInfo();
    };
    canvas.onmouseleave = function () {
        // On ne termine pas automatiquement la sélection.
    };
    // TACTILE
    canvas.ontouchstart = function (event) {
        if (!imageLoaded) {
            return;
        }
        // On ne gère qu'un doigt.
        if (!event.touches || event.touches.length !== 1) {
            return;
        }
        var touch = event.touches[0];
        var pos = getPointerPosition(
            touch.clientX,
            touch.clientY
        );
        startX = pos.x;
        startY = pos.y;
        selecting = true;
        selection = {
            x: startX,
            y: startY,
            width: 0,
            height: 0
        };
        drawImage();
        updateSelectionInfo();
        // Empêche le scroll/zoom du navigateur pendant la sélection.
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    canvas.ontouchmove = function (event) {
        if (!selecting) {
            return;
        }
        if (!event.touches || event.touches.length !== 1) {
            return;
        }
        var touch = event.touches[0];
        var pos = getPointerPosition(
            touch.clientX,
            touch.clientY
        );
        var x = pos.x;
        var y = pos.y;
        selection = {
            x: Math.min(startX, x),
            y: Math.min(startY, y),
            width: Math.abs(x - startX),
            height: Math.abs(y - startY)
        };
        drawImage();
        updateSelectionInfo();
        // Très important sur smartphone/tablette :  empêche la page de défiler pendant la sélection.
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    canvas.ontouchend = function (event) {
        if (!selecting) {
            return;
        }
        selecting = false;
        updateSelectionInfo();
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    canvas.ontouchcancel = function (event) {
        if (!selecting) {
            return;
        }
        selecting = false;
        updateSelectionInfo();
        if (event.preventDefault) {
            event.preventDefault();
        }
    };
    /* AFFICHAGE SELECTION */
    function drawSelection() {
        if (!selection) { return;
        }
        if (selection.width < 1 || selection.height < 1) { return;
        }
        ctx.save();
        ctx.strokeStyle = "#ff0000";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(selection.x, selection.y, selection.width, selection.height);
        ctx.fillStyle = "rgba(255, 0, 0, 0.12)";
        ctx.fillRect(selection.x, selection.y, selection.width, selection.height);
        ctx.restore();
    }
    function updateSelectionInfo() {
        if (!selection || selection.width < 2 || selection.height < 2) { selectionInfo.innerHTML = "Aucune zone sélectionnée."; return;
        }
        var realX = Math.round(selection.x / zoom);
        var realY = Math.round(selection.y / zoom);
        var realWidth = Math.round(selection.width / zoom);
        var realHeight = Math.round(selection.height / zoom);
        selectionInfo.innerHTML = "Zone sélectionnée : " + realWidth + " × " + realHeight + " px — position " + realX + ", " + realY;
    }
    /* CREATION IMAGE POUR OCR */
    function createOCRCanvas(useSelection) {
        var sourceCanvas = canvas;
        var sx = 0;
        var sy = 0;
        var sw = canvas.width;
        var sh = canvas.height;
        if (useSelection && selection && selection.width > 2 && selection.height > 2) { sx = selection.x; sy = selection.y; sw = selection.width; sh = selection.height;
        }
        var ocrCanvas = document.createElement("canvas");
        // On augmente légèrement la résolution de la zone  envoyée à Tesseract.
        var scale = 1;
        if (sw < 1500) { scale = 2;
        }
        if (sw < 700) { scale = 3;
        }
        ocrCanvas.width = Math.round(sw * scale);
        ocrCanvas.height = Math.round(sh * scale);
        var ocrCtx = ocrCanvas.getContext("2d");
        ocrCtx.fillStyle = "#ffffff";
        ocrCtx.fillRect(0, 0, ocrCanvas.width, ocrCanvas.height);
        ocrCtx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, ocrCanvas.width, ocrCanvas.height);
        // Prétraitement automatique léger pour OCR : niveaux de gris + contraste.
        var imageData = ocrCtx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
        var data = imageData.data;
        var i;
        var gray;
        for (i = 0; i < data.length; i += 4) { gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; data[i] = gray; data[i + 1] = gray; data[i + 2] = gray;
        }
        ocrCtx.putImageData(imageData, 0, 0);
        return ocrCanvas;
    }
    /* TESSERACT */
    function getWorker(callback) {
        var lang = language.value;
        // Si un worker existe déjà avec la même langue, on le réutilise.
        if (worker && workerLanguage === lang) { callback(worker); return;
        }
        // On détruit l'ancien worker si nécessaire.
        if (worker) { try { worker.terminate(); } catch (e) { } worker = null;
        }
        workerLanguage = lang;
        setStatus("Chargement du moteur OCR " + lang + "...");
        /*
         * IMPORTANT :
         * Avec Tesseract.js 5 :
         * Tesseract.createWorker(
         *     langue,
         *     oem,
         *     options
         * )
         * et createWorker() retourne une Promise.
         * Il ne faut PAS faire :
         * worker.load()
         * worker.loadLanguage()
         * worker.initialize()
         */
        Tesseract.createWorker(lang, 1, { logger: function (message) {     if (!message) { return;     }     if (typeof message.progress === "number"     ) { setProgress(    message.progress );     }     if (message.status) { var percent = ""; if (    typeof message.progress === "number" ) {     percent =         " (" +         Math.round(            message.progress * 100         ) +         "%)"; } setStatus(    message.status +     percent );     } } })
        .then(function (newWorker) { worker = newWorker; setStatus( "Moteur OCR prêt.", "success" ); callback(worker);
        })
        .catch(function (error) { worker = null; setStatus( "Erreur lors du chargement de Tesseract : " + error, "error" ); console.error( "Tesseract createWorker error:", error );
        });
    }
    /* OCR ZONE */
    ocrButton.onclick = function () {
        if (!imageLoaded) { return;
        }
        if (!selection || selection.width < 5 || selection.height < 5) { alert( "Sélectionne d'abord une zone sur l'image." ); return;
        }
        performOCR(true);
    };
    /* OCR IMAGE COMPLETE */
    ocrFullButton.onclick = function () {
        if (!imageLoaded) { return;
        }
        performOCR(false);
    };
    /* EXECUTION OCR */
    function performOCR(useSelection) {
        ocrButton.disabled = true;
        ocrFullButton.disabled = true;
        setProgress(0);
        setStatus("Préparation de l'image...");
        var ocrCanvas;
        try { ocrCanvas = createOCRCanvas( useSelection );
        } catch (error) { setStatus( "Erreur lors de la préparation : " + error, "error" ); ocrButton.disabled = false; ocrFullButton.disabled = false; return;
        }
        getWorker(function (ocrWorker) { setStatus( "Reconnaissance du texte..." ); ocrWorker.recognize( ocrCanvas ) .then(function (resultData) { var text = ""; if (resultData &&     resultData.data &&     typeof resultData.data.text === "string") {     text = resultData.data.text; } result.value = text; setProgress(1); setStatus(     "OCR terminé.",     "success" ); ocrButton.disabled = false; ocrFullButton.disabled = false; }) .catch(function (error) { setStatus(     "Erreur OCR : " +     error,     "error" ); ocrButton.disabled = false; ocrFullButton.disabled = false; });
        });
    }
    /* TELECHARGEMENT TXT */
    downloadButton.onclick = function () {
        var text = result.value;
        if (!text) { alert("Aucun texte à télécharger."); return;
        }
        var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        var url = window.URL || window.webkitURL;
        var objectUrl = url.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = objectUrl;
        link.download = "ocr-resultat.txt";
        document.body.appendChild(link);
        // Certains navigateurs anciens nécessitent un clic simulé.
        if (document.createEvent) { var event = document.createEvent("MouseEvents"); event.initMouseEvent("click", true, true, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null); link.dispatchEvent(event);
        } else { link.click();
        }
        document.body.removeChild(link);
        window.setTimeout(function () { url.revokeObjectURL(objectUrl);
        }, 1000);
    };
    /* EFFACER */
    clearButton.onclick = function () {
        result.value = "";
        setProgress(0);
        setStatus(imageLoaded ? "Résultat OCR effacé." : "En attente d'une image.");
    };
    /* EMPECHER LE MENU CONTEXTUEL SUR LE CANVAS */
    canvas.oncontextmenu = function () {
        return false;
    };
})();
</script>
</body>
</html>
