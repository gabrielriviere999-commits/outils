<script>
/* Multitouch, popup et color-palette */
addMultiTouch("button,input");
function setToolFree(){ setTool("free"); }
function setToolLine(){ setTool("line"); }
function setToolArrow(){ setTool("arrow"); }
function setToolSquare(){ setTool("square"); }
function setToolRect(){ setTool("rect"); }
function setToolCircle(){ setTool("circle"); }
function setToolEllipse(){ setTool("ellipse"); }
function setToolText(){ setTool("text"); }
function setToolMove(){ setTool("move"); }
function setToolCopy(){ setTool("copy"); }
function setToolFill(){ setTool("fill"); }
function setToolEraser(){ setTool("eraser"); }
function openOptionsPopup() {
  var container = document.getElementById("popupOptionsContent");
  openPopupMenu(container);
}
// Changer la couleur du tracé
attachColorPickerTo(document.getElementById("colorInput"));
var colorInput = document.getElementById("colorInput");
var rainbowMode = false;
var rainbowHue = 0;
function applyColor(){
    var col = colorInput.value;
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
}
colorInput.oninput = applyColor;
function toggleRainbow(){
    rainbowMode = !rainbowMode;
    var btn = document.getElementById("btnRainbow");
    if(rainbowMode){
        btn.className = "active";
    } else {
        btn.className = "";
        applyColor();
    }
}
function rainbowColor(h){
    var i = Math.floor(h / 60);
    var f = h - i * 60;
    var q = 255 - Math.round(255 * f / 60);
    var t = 255 - q;
    var r,g,b;
    if(i === 0){
        r = 255; g = t; b = 0;
    } else if(i === 1){
        r = q; g = 255; b = 0;
    } else if(i === 2){
        r = 0; g = 255; b = t;
    } else if(i === 3){
        r = 0; g = q; b = 255;
    } else if(i === 4){
        r = t; g = 0; b = 255;
    } else {
        r = 255; g = 0; b = q;
    }
    return "#" +
        ("0" + r.toString(16)).slice(-2) +
        ("0" + g.toString(16)).slice(-2) +
        ("0" + b.toString(16)).slice(-2);
}
function createRainbowGradient(x1,y1,x2,y2){
    var gradient = ctx.createLinearGradient(x1,y1,x2,y2);
    gradient.addColorStop(0, "#ff0000");
    gradient.addColorStop(0.16, "#ff9900");
    gradient.addColorStop(0.33, "#ffff00");
    gradient.addColorStop(0.50, "#00ff00");
    gradient.addColorStop(0.66, "#00ffff");
    gradient.addColorStop(0.83, "#0000ff");
    gradient.addColorStop(1, "#ff00ff");
    return gradient;
}
function applyRainbowGradient(x1,y1,x2,y2){
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            x1,y1,x2,y2
        );
        ctx.fillStyle = ctx.strokeStyle;
    } else {
        applyColor();
    }
}
document.onmouseup = function () {
    draggingHue = false;
    draggingSV  = false;
    draggingAlpha = false;
    if (colorInput) {
        colorInput.dispatchEvent(new Event("input"));
    }
};
document.ontouchend = function () {
    draggingHue = false;
    draggingSV  = false;
    draggingAlpha = false;
    if (colorInput) {
        colorInput.dispatchEvent(new Event("input"));
    }
};
// Changer la Taille du tracé
var sizeInput = document.getElementById("sizeInput");
var sizeLabel = document.getElementById("sizeLabel");
sizeInput.oninput = function(){
    var v = parseInt(sizeInput.value, 10);
    sizeLabel.textContent = v;
    ctx.lineWidth = v;
};
/* VARIABLES */
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
/* ZOOM DU CANVAS */
var zoomInput = document.getElementById("zoomInput");
var zoomLabel = document.getElementById("zoomLabel");
function applyZoom(){
    var zoom = parseInt(zoomInput.value,10) / 100;
    canvas.style.width = Math.round(canvas.width * zoom) + "px";
    canvas.style.height = Math.round(canvas.height * zoom) + "px";
    zoomLabel.textContent = zoomInput.value + "%";
}
zoomInput.oninput = function(){ applyZoom(); };
applyZoom();
var canvasWidthInput = document.getElementById("canvasWidth");
var canvasHeightInput = document.getElementById("canvasHeight");
function changeCanvasResolution(){
    var newWidth = parseInt(canvasWidthInput.value, 10);
    var newHeight = parseInt(canvasHeightInput.value, 10);
    if(newWidth < 1 || newHeight < 1){
        alert("Résolution invalide.");
        return;
    }
    // Sauvegarder le dessin actuel
    var oldCanvas = document.createElement("canvas");
    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;
    var oldCtx = oldCanvas.getContext("2d");
    oldCtx.drawImage(
        canvas,
        0,
        0
    );
    // Changer la résolution réelle
    canvas.width = newWidth;
    canvas.height = newHeight;
    // Restaurer l'ancien dessin
    ctx.drawImage(
        oldCanvas,
        0,
        0
    );
    // Restaurer les paramètres du contexte
    ctx.lineWidth = parseInt(sizeInput.value, 10);
    ctx.lineCap = "round";
    applyColor();
    // Reset Undo / Redo
    undoStack = [];
    redoStack = [];
    saveState();
    // Mettre à jour les champs 
    canvasWidthInput.value = newWidth;
    canvasHeightInput.value = newHeight;
    applyZoom();
    closePopup();
}
/* IMAGE : DEPLACER / REDIMENSIONNER / ROTATION */
var imageFile = document.getElementById("imageFile");
var tempImage = null;
var tempImageX = 0;
var tempImageY = 0;
var tempImageW = 0;
var tempImageH = 0;
var tempImageAngle = 0;
var imageBaseImage = null;
/*
 * 0 = rien
 * 1 = déplacement
 * 2 = redimensionnement
 * 3 = rotation
 */
var imageAction = 0;
var imageHandle = "";
var imageStartX = 0;
var imageStartY = 0;
var imageStartW = 0;
var imageStartH = 0;
var imageStartAngle = 0;
var imageStartDistance = 0;
var imageStartPointerAngle = 0;
/* CHARGEMENT */
imageFile.onchange = function(){
    if(!imageFile.files || !imageFile.files.length){
        return;
    }
    var file = imageFile.files[0];
    if(!file.type || file.type.indexOf("image/") !== 0){
        alert("Veuillez sélectionner une image.");
        imageFile.value = "";
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
            // Si une autre image temporaire existe, on la valide avant d'en charger une nouvelle.
            if(tempImage){
                commitTempImage();
            }
            tempImage = img;
            tempImageW = img.width;
            tempImageH = img.height;
            // Taille maximale initiale.
            var maxW = 300;
            var maxH = 300;
            if(tempImageW > maxW){
                tempImageH =
                    tempImageH * maxW / tempImageW;
                tempImageW = maxW;
            }
            if(tempImageH > maxH){
                tempImageW =
                    tempImageW * maxH / tempImageH;
                tempImageH = maxH;
            }
            // Centrer l'image.
            tempImageX = (canvas.width - tempImageW) / 2;
            tempImageY = (canvas.height - tempImageH) / 2;
            tempImageAngle = 0;
            // Sauvegarder le dessin avant l'image.
            imageBaseImage = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );
            currentTool = "image";
            drawTempImage();
            updateDimensions(
                tempImageW,
                tempImageH
            );
            imageFile.value = "";
        };
        img.onerror = function(){
            alert("Impossible de charger cette image.");
            imageFile.value = "";
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
/* CALCUL DES COORDONNEES */
function getImageCenter(){
    return {
        x: tempImageX + tempImageW / 2,
        y: tempImageY + tempImageH / 2
    };
}
/* Distance entre deux points. */
function imageDistance(x1,y1,x2,y2){
    var dx = x2-x1;
    var dy = y2-y1;
    return Math.sqrt(dx*dx + dy*dy);
}
/* Angle entre deux points. */
function imagePointerAngle(x1,y1,x2,y2){
    return Math.atan2(
        y2-y1,
        x2-x1
    );
}
/* POINT DANS L'IMAGE */
function pointInTempImage(x,y){
    if(!tempImage){
        return false;
    }
    var c = getImageCenter();
    var dx = x-c.x;
    var dy = y-c.y;
    // Annuler la rotation.
    var cos = Math.cos(-tempImageAngle);
    var sin = Math.sin(-tempImageAngle);
    var rx =
        dx*cos - dy*sin;
    var ry =
        dx*sin + dy*cos;
    return (
        rx >= -tempImageW/2 &&
        rx <=  tempImageW/2 &&
        ry >= -tempImageH/2 &&
        ry <=  tempImageH/2
    );
}
/* POIGNEES */
function getImageHandle(x,y){
    if(!tempImage){
        return "";
    }
    var c = getImageCenter();
    var cos = Math.cos(-tempImageAngle);
    var sin = Math.sin(-tempImageAngle);
    var dx = x-c.x;
    var dy = y-c.y;
    // Coordonnées locales.
    var lx =
        dx*cos - dy*sin;
    var ly =
        dx*sin + dy*cos;
    var hs = 10;
    // Poignée rotation. Elle est située au-dessus de l'image.
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly + tempImageH/2 + 35) < hs
    ){
        return "rotate";
    }
    // Poignées de redimensionnement.
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "nw";
    }
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "n";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "ne";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly) < hs
    ){
        return "e";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "se";
    }
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "s";
    }
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "sw";
    }
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly) < hs
    ){
        return "w";
    }
    return "";
}
/* DESSIN DE L'IMAGE + CADRE + POIGNEES */
function drawTempImage(){
    if(!tempImage){
        return;
    }
    // Restaurer le dessin original.
    if(imageBaseImage){
        ctx.putImageData(
            imageBaseImage,
            0,
            0
        );
    }
    var c = getImageCenter();
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(tempImageAngle);
    // Image : toujours en mode dessin normal
    var oldComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(
        tempImage,
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    ctx.globalCompositeOperation = oldComposite;
    // Cadre.
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.strokeRect(
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    // Retour pour dessiner les poignées dans le même système de coordonnées.
    var handles = [
        [-tempImageW/2,-tempImageH/2],
        [0,-tempImageH/2],
        [tempImageW/2,-tempImageH/2],
        [tempImageW/2,0],
        [tempImageW/2,tempImageH/2],
        [0,tempImageH/2],
        [-tempImageW/2,tempImageH/2],
        [-tempImageW/2,0]
    ];
    var i;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#000000";
    for(i=0;i<handles.length;i++){
        ctx.beginPath();
        ctx.rect(
            handles[i][0]-5,
            handles[i][1]-5,
            10,
            10
        );
        ctx.fill();
        ctx.stroke();
    }
    // Ligne vers poignée rotation.
    ctx.beginPath();
    ctx.moveTo(
        0,
        -tempImageH/2
    );
    ctx.lineTo(
        0,
        -tempImageH/2-35
    );
    ctx.stroke();
    // Poignée rotation.
    ctx.beginPath();
    ctx.arc(
        0,
        -tempImageH/2-35,
        7,
        0,
        Math.PI*2,
        false
    );
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}
/* VALIDER L'IMAGE */
function commitTempImage(){
    if(!tempImage){
        return;
    }
    // Restaurer le fond.
    if(imageBaseImage){
        ctx.putImageData(
            imageBaseImage,
            0,
            0
        );
    }
    /*
     * L'image devient définitivement
     * une partie du dessin.
     */
    var c = getImageCenter();
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(tempImageAngle);
    var oldComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(
        tempImage,
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    ctx.globalCompositeOperation = oldComposite;
    ctx.restore();
    // Sauvegarder le résultat dans Undo.
    undoStack.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );
    redoStack = [];
    tempImage = null;
    imageBaseImage = null;
    imageAction = 0;
    imageHandle = "";
    hideDimensions();
}
/* IMPORTER UN DESSIN ENTIER */
var drawingFile = document.getElementById("drawingFile");
drawingFile.onchange = function(){
    if(!drawingFile.files || !drawingFile.files.length){
        return;
    }
    var file = drawingFile.files[0];
    if(!file.type || file.type.indexOf("image/") !== 0){
        alert("Veuillez sélectionner une image.");
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
            /*
             * Sauvegarder l'ancien dessin
             * pour permettre Annuler.
             */
            saveState();
            // Effacer le dessin actuel.
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            /*
             * Adapter l'image au canvas
             * sans déformer ses proportions.
             */
            var scaleX = canvas.width / img.width;
            var scaleY = canvas.height / img.height;
            var scale = Math.min(scaleX, scaleY);
            var w = img.width * scale;
            var h = img.height * scale;
            var x = (canvas.width - w) / 2;
            var y = (canvas.height - h) / 2;
            ctx.drawImage(
                img,
                x,
                y,
                w,
                h
            );
            drawingFile.value = "";
        };
        img.onerror = function(){
            alert("Impossible de charger cette image.");
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
var textBox = document.getElementById("textBox");
var textInput = document.getElementById("textInput");
var fontInput = document.getElementById("fontInput");
var textFont = "sans-serif";
fontInput.onchange = function(){ textFont = fontInput.value; };
var confirmTextBtn = document.getElementById("confirmTextBtn");
var cancelTextBtn = document.getElementById("cancelTextBtn");
ctx.clearRect(0,0,canvas.width,canvas.height);
var drawing = false;
var moved = false;
var moveBaseImage = null;
var startX = 0, startY = 0;
var lastX = 0, lastY = 0;
var currentTool = "free";
ctx.lineWidth = 3;
ctx.lineCap = "round";
ctx.strokeStyle = "#000000";
ctx.fillStyle = "rgba(0,0,0,0)";
// Undo / Redo
var undoStack = [];
var redoStack = [];
// Selection
var moveMode = 0;     // 0 = sélection, 1 = déplacement
var copyMode = 0;     // 0 = sélection, 1 = déplacement
var moveSelection = null;
var textX = 0;
var textY = 0;
/* TOOL FUNCTIONS */
function setTool(t){
    /* Si une image est en cours de manipulation, on la valide avant de changer d'outil. */
    if(
        tempImage &&
        currentTool === "image" &&
        t !== "image"
    ){
        commitTempImage();
    }
    currentTool = t;
    // reset move/copy si on change d’outil
    moveMode = 0;
    copyMode = 0;
    selection = null;
    moveSelection = null;
    // enlever active partout
    btnFree.className = "";
    btnLine.className = "";
    btnArrow.className = "";
    btnSquare.className = "";
    btnRect.className = "";
    btnCircle.className = "";
    btnEllipse.className = "";
    btnText.className = "";
    btnFill.className = "";
    btnEraser.className = "";
    btnMove.className = "";
    btnCopy.className = "";
    // activer le bon bouton
    if(t==="free")   btnFree.className = "active";
    if(t==="line")   btnLine.className = "active";
    if(t==="arrow")  btnArrow.className = "active";
    if(t==="square")   btnSquare.className = "active";
    if(t==="rect")   btnRect.className = "active";
    if(t==="circle") btnCircle.className = "active";
    if(t==="ellipse")btnEllipse.className = "active";
    if(t==="text")    btnText.className = "active";
    if(t==="fill")   btnFill.className = "active";
    if(t==="eraser") btnEraser.className = "active";
    if(t === "eraser"){
        ctx.globalCompositeOperation = "destination-out";
    } else {
        ctx.globalCompositeOperation = "source-over";
    }
    if(t==="move")   btnMove.className = "active";
    if(t==="copy")   btnCopy.className = "active";
}
/* UNDO / REDO */
var MAX_UNDO = 10;
function saveState(){
    undoStack.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );
    if(undoStack.length > MAX_UNDO){
        undoStack.shift();
    }
    redoStack = [];
}
function undo(){
    if(undoStack.length){
        var img = undoStack.pop();
        redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
        ctx.putImageData(img,0,0);
    }
}
function redo(){
    if(redoStack.length){
        var img = redoStack.pop();
        undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
        ctx.putImageData(img,0,0);
    }
}
/* POSITION */
function getPos(e){
    var rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}
/* DRAWING FUNCTIONS */
function drawFree(x,y){
    var dx = x-lastX;
    var dy = y-lastY;
    var distance = Math.sqrt(dx*dx + dy*dy);
    if(distance < 0.1){
        return;
    }
    if(currentTool === "eraser"){
        ctx.globalCompositeOperation = "destination-out";
    } else {
        ctx.globalCompositeOperation = "source-over";
        if(rainbowMode){
            rainbowHue += distance * 1.5;
            if(rainbowHue >= 360){
                rainbowHue %= 360;
            }
            ctx.strokeStyle = rainbowColor(rainbowHue);
        }
    }
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX = x;
    lastY = y;
}
function redrawFromUndoTop(){
    if(undoStack.length){
        ctx.putImageData(undoStack[undoStack.length-1],0,0);
    }
}
function drawLinePreview(x,y){
    redrawFromUndoTop();
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            startX,startY,x,y
        );
    } else {
        applyColor();
    }
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(x,y);
    ctx.stroke();
}
function drawArrowPreview(x,y){
    redrawFromUndoTop();
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            startX,
            startY,
            x,
            y
        );
        ctx.fillStyle = ctx.strokeStyle;
    } else {
        applyColor();
    }
    var dx = x - startX;
    var dy = y - startY;
    var len = Math.sqrt(dx*dx + dy*dy);
    if(len < 1) return;
    /* Direction normalisée */
    var ux = dx / len;
    var uy = dy / len;
    /* Taille de la pointe */
    var headLen = ctx.lineWidth * 4;
    /* Largeur de la pointe */
    var headWidth = headLen * 0.5;
    /* Base de la pointe */
    var baseX = x - ux * headLen;
    var baseY = y - uy * headLen;
    /* Vecteur perpendiculaire */
    var px = -uy;
    var py = ux;
    var x1 = baseX + px * headWidth;
    var y1 = baseY + py * headWidth;
    var x2 = baseX - px * headWidth;
    var y2 = baseY - py * headWidth;
    /* Ligne */
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(baseX,baseY);
    ctx.stroke();
    /* Pointe */
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.closePath();
    ctx.fill();
}
function drawSquarePreview(x,y){
    redrawFromUndoTop();
    var dx = x - startX;
    var dy = y - startY;
    var size = Math.min(
        Math.abs(dx),
        Math.abs(dy)
    );
    var endX = startX;
    var endY = startY;
    if(dx < 0){
        endX = startX - size;
    } else {
        endX = startX + size;
    }
    if(dy < 0){
        endY = startY - size;
    } else {
        endY = startY + size;
    }
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            Math.min(startX,endX),
            Math.min(startY,endY),
            Math.max(startX,endX),
            Math.max(startY,endY)
        );
    } else {
        applyColor();
    }
    ctx.beginPath();
    ctx.rect(
        Math.min(startX,endX),
        Math.min(startY,endY),
        size,
        size
    );
    ctx.stroke();
}
function drawRectPreview(x,y){
    redrawFromUndoTop();
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            startX,
            startY,
            x,
            y
        );
    } else {
        applyColor();
    }
    ctx.beginPath();
    ctx.rect(
        startX,
        startY,
        x-startX,
        y-startY
    );
    ctx.stroke();
}
function drawCirclePreview(x,y){
    redrawFromUndoTop();
    var dx = x - startX;
    var dy = y - startY;
    var size = Math.min(
        Math.abs(dx),
        Math.abs(dy)
    );
    var left = startX;
    var top = startY;
    if(dx < 0){
        left = startX - size;
    }
    if(dy < 0){
        top = startY - size;
    }
    var cx = left + size/2;
    var cy = top + size/2;
    var r = size/2;
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            left,
            top,
            left + size,
            top + size
        );
    } else {
        applyColor();
    }
    ctx.beginPath();
    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2,
        false
    );
    ctx.stroke();
}
function drawEllipsePreview(x,y){
    redrawFromUndoTop();
    var left = Math.min(startX,x);
    var top = Math.min(startY,y);
    var right = Math.max(startX,x);
    var bottom = Math.max(startY,y);
    var w = right-left;
    var h = bottom-top;
    var cx = left+w/2;
    var cy = top+h/2;
    var rx = w/2;
    var ry = h/2;
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            left,
            top,
            right,
            bottom
        );
    } else {
        applyColor();
    }
    ctx.beginPath();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(
        1,
        ry ? ry/rx : 1
    );
    ctx.arc(
        0,
        0,
        rx,
        0,
        Math.PI*2,
        false
    );
    ctx.restore();
    ctx.stroke();
}
function updateDimensions(x,y){
    var width = Math.abs(x - startX);
    var height = Math.abs(y - startY);
    var dx = x - startX;
    var dy = y - startY;
    var length = Math.sqrt(dx * dx + dy * dy);
    var angle = Math.atan2(-dy, dx) * 180 / Math.PI;
    if(angle < 0){
        angle += 360;
    }
    var text =
        "largeur : " + Math.round(width) +
        ", hauteur : " + Math.round(height);
    if(currentTool === "line" || currentTool === "arrow"){
        text +=
            ", angle : " + angle.toFixed(1) + "°";
    }
    document.getElementById("dimensions").textContent = text;
}
function hideDimensions(){
    document.getElementById("dimensions").textContent =

function drawSelectionPreview(x,y){
    /* Restaurer le dessin avant le rectangle temporaire. */
    if(moveBaseImage){
        ctx.putImageData(moveBaseImage,0,0);
    }
    var sx = Math.min(startX,x);
    var sy = Math.min(startY,y);
    var w = Math.abs(x-startX);
    var h = Math.abs(y-startY);
    if(w < 1 || h < 1) return;
    /* Rectangle temporaire compatible avec les anciens navigateurs. On dessine les pointillés manuellement. */
    ctx.save();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    var dash = 6;
    var gap = 4;
    var i;
    /* Haut */
    for(i = sx; i < sx + w; i += dash + gap){
        ctx.beginPath();
        ctx.moveTo(i + 0.5, sy + 0.5);
        ctx.lineTo(Math.min(i + dash, sx + w) + 0.5, sy + 0.5);
        ctx.stroke();
    }
    /* Bas */
    for(i = sx; i < sx + w; i += dash + gap){
        ctx.beginPath();
        ctx.moveTo(i + 0.5, sy + h + 0.5);
        ctx.lineTo(Math.min(i + dash, sx + w) + 0.5, sy + h + 0.5);
        ctx.stroke();
    }
    /* Gauche */
    for(i = sy; i < sy + h; i += dash + gap){
        ctx.beginPath();
        ctx.moveTo(sx + 0.5, i + 0.5);
        ctx.lineTo(sx + 0.5, Math.min(i + dash, sy + h) + 0.5);
        ctx.stroke();
    }
    /* Droite */
    for(i = sy; i < sy + h; i += dash + gap){
        ctx.beginPath();
        ctx.moveTo(sx + w + 0.5, i + 0.5);
        ctx.lineTo(sx + w + 0.5, Math.min(i + dash, sy + h) + 0.5);
        ctx.stroke();
    }
    ctx.restore();
}
function confirmText(){
    var text = textInput.value;
    textBox.style.display = "none";
    if(!text){
        textInput.value = "";
        return;
    }
    saveState();
    var lines = text.split(/\r?\n/);
    var fontSize = parseInt(sizeInput.value,10) * 5;
    if(!fontSize || fontSize < 1){
        fontSize = 15;
    }
    ctx.save();
    ctx.font = fontSize + "px " + textFont;
    ctx.textBaseline = "top";
    var lineHeight = Math.round(fontSize * 1.2);
    var i;
    if(rainbowMode){
        // Mesurer la largeur totale du texte pour que le dégradé couvre réellement toute la longueur.
        var maxWidth = 0;
        for(i = 0; i < lines.length; i++){
            var width = ctx.measureText(lines[i]).width;
            if(width > maxWidth){
                maxWidth = width;
            }
        }
        var gradient = ctx.createLinearGradient(
            textX,
            textY,
            textX + maxWidth,
            textY
        );
        gradient.addColorStop(0, "#ff0000");
        gradient.addColorStop(0.16, "#ff9900");
        gradient.addColorStop(0.33, "#ffff00");
        gradient.addColorStop(0.50, "#00ff00");
        gradient.addColorStop(0.66, "#00ffff");
        gradient.addColorStop(0.83, "#0000ff");
        gradient.addColorStop(1, "#ff00ff");
        ctx.fillStyle = gradient;
    } else {
        ctx.fillStyle = colorInput.value;
    }
    for(i = 0; i < lines.length; i++){
        ctx.fillText(
            lines[i],
            textX,
            textY + i * lineHeight
        );
    }
    ctx.restore();
    textInput.value = "";
}

    textInput.value = "";

function extractSelection(x1,y1,x2,y2,keepOriginal){
    var sx = Math.floor(Math.min(x1,x2));
    var sy = Math.floor(Math.min(y1,y2));
    var ex = Math.floor(Math.max(x1,x2));
    var ey = Math.floor(Math.max(y1,y2));
    var w = ex - sx;
    var h = ey - sy;
    if(w < 1 || h < 1){
        return false;
    }
    moveSelection = {
        x: sx,
        y: sy,
        w: w,
        h: h,
        data: ctx.getImageData(sx,sy,w,h)
    };
    /*
     * MOVE :
     * on retire immédiatement l'original.
     *
     * COPY :
     * on laisse l'original en place.
     */
    if(!keepOriginal){
        ctx.clearRect(sx,sy,w,h);
    }
    /*
     * Image qui servira de fond pendant
     * le déplacement.
     */
    moveBaseImage = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );
    return true;
}
/* MOUSE EVENTS (ASCII LOGIC) */
canvas.onpointerdown = function(e){
    var p = getPos(e);
    startX = p.x;
    startY = p.y;
    lastX = p.x;
    lastY = p.y;
    /* IMAGE */
    if(currentTool === "image" && tempImage){
        var handle = getImageHandle(
            p.x,
            p.y
        );
        imageAction = 0;
        imageHandle = "";
        /*
         * Rotation
         */
        if(handle === "rotate"){
            imageAction = 3;
            var c = getImageCenter();
            imageStartAngle = tempImageAngle;
            imageStartPointerAngle =
                imagePointerAngle(
                    c.x,
                    c.y,
                    p.x,
                    p.y
                );
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        // Redimensionnement
        if(handle){
            imageAction = 2;
            imageHandle = handle;
            imageStartX = p.x;
            imageStartY = p.y;
            imageStartW = tempImageW;
            imageStartH = tempImageH;
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        // Déplacement
        if(pointInTempImage(p.x,p.y)){
            imageAction = 1;
            imageStartX =
                p.x - tempImageX;
            imageStartY =
                p.y - tempImageY;
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        /*
         * Clic ailleurs :
         * on valide l'image.
         */
        commitTempImage();
        drawing = false;
        return;
    }
    /* TEXTE */
    if(currentTool === "text"){
        drawing = false;
        moved = false;
        textX = p.x;
        textY = p.y;
        textInput.value = "";
        textBox.style.display = "block";
        setTimeout(function(){
            textInput.focus();
        }, 50);
        return;
    }
    drawing = true;
    moved = false;
    if(canvas.setPointerCapture && e.pointerId !== undefined){
        canvas.setPointerCapture(e.pointerId);
    }
    /* MOVE / COPY */
    if(currentTool==="move" || currentTool==="copy"){
        /*
         * PHASE 1 :
         * aucune sélection n'existe encore.
         * On prépare le fond pour afficher
         * le rectangle de sélection.
         */
        if(
            (currentTool==="move" && moveMode===0) ||
            (currentTool==="copy" && copyMode===0)
        ){
            moveSelection = null;
            moveBaseImage = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );
            return;
        }
        /*
         * PHASE 2 :
         * une sélection existe déjà.
         *
         * SURTOUT :
         * ne pas remettre moveSelection à null.
         */
        if(
            (currentTool==="move" && moveMode===1) ||
            (currentTool==="copy" && copyMode===1)
        ){
            return;
        }
    }
    /*
     * Pour les autres outils,
     * sauvegarde normale.
     */
    saveState();
    if(currentTool==="fill"){
        floodFill(
            Math.floor(p.x),
            Math.floor(p.y)
        );
        drawing = false;
        return;
    }
    if(currentTool==="eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = parseInt(sizeInput.value,10);
    }
};
/* AUTO-SCROLL DU CANVAS PENDANT LE DESSIN */
var canvasScroll = document.getElementById("canvasScroll");
var autoScrollTimer = null;
var autoScrollX = 0;
var autoScrollY = 0;
var autoScrollPointerX = 0;
var autoScrollPointerY = 0;
function updateAutoScroll(e){
    if(!drawing){
        stopAutoScroll();
        return;
    }
    var rect = canvasScroll.getBoundingClientRect();
    var edge = 25;      // distance du bord pour commencer le scroll
    var speed = 8;      // vitesse du scroll
    autoScrollPointerX = e.clientX;
    autoScrollPointerY = e.clientY;
    autoScrollX = 0;
    autoScrollY = 0;
    /* Gauche */
    if(e.clientX < rect.left + edge){
        autoScrollX = -speed;
    }
    /* Droite */
    else if(e.clientX > rect.right - edge){
        autoScrollX = speed;
    }

    /* Haut */
    if(e.clientY < rect.top + edge){
        autoScrollY = -speed;
    }
    /* Bas */
    else if(e.clientY > rect.bottom - edge){
        autoScrollY = speed;
    }
    if(autoScrollX !== 0 || autoScrollY !== 0){
        if(!autoScrollTimer){
            autoScrollTimer = setInterval(function(){
                canvasScroll.scrollLeft += autoScrollX;
                canvasScroll.scrollTop += autoScrollY;
            }, 20);
        }
    } else {
        stopAutoScroll();
    }
}
function stopAutoScroll(){
    if(autoScrollTimer){
        clearInterval(autoScrollTimer);
        autoScrollTimer = null;
    }
    autoScrollX = 0;
    autoScrollY = 0;
}

if(currentTool === "image" && tempImage && imageAction === 1){

         */
        if(moveBaseImage){
            ctx.putImageData(moveBaseImage,0,0);
        }
        if(!extractSelection(startX,startY,x,y,false)){
            return;
        }
        // Rendre le blanc transparent dans le fantôme
        var d = moveSelection.data.data;
        var i = 0;
        while(i < d.length){
            var r = d[i];
            var g = d[i+1];
            var b = d[i+2];
            if(r > 200 && g > 200 && b > 200){
                d[i+3] = 0;
            }
            i += 4;
        }
        /*
         * Le canvas est maintenant propre :
         * l'original a été retiré et le rectangle
         * temporaire a disparu.
         */
        moveBaseImage = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );
        moveMode = 1;
        return;
    }
    /* COPY : première étape = sélection */
    if(currentTool==="copy" && copyMode===0){
        /*
         * Supprimer le rectangle de sélection temporaire
         * avant de récupérer les pixels.
         */
        if(moveBaseImage){
            ctx.putImageData(moveBaseImage,0,0);
        }
        if(!extractSelection(startX,startY,x,y,true)){
            return;
        }
        /*
         * L'original reste en place.
         * Le rectangle temporaire est déjà supprimé.
         */
        moveBaseImage = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );
        copyMode = 1;
        return;
    }
    /* MOVE : deuxième étape = dépôt */
    if(currentTool==="move" && moveMode===1){
        if(!moveSelection){
            moveMode = 0;
            return;
        }
        var tempCanvas = document.createElement("canvas");
        tempCanvas.width = moveSelection.w;
        tempCanvas.height = moveSelection.h;
        var tempCtx = tempCanvas.getContext("2d");
        tempCtx.putImageData(
            moveSelection.data,
            0,
            0
        );
        ctx.drawImage(
            tempCanvas,
            x - moveSelection.w / 2,
            y - moveSelection.h / 2
        );
        moveSelection = null;
        moveBaseImage = null;
        moveMode = 0;
        copyMode = 0;
        return;
    }
    /* COPY : deuxième étape = dépôt */
    if(currentTool==="copy" && copyMode===1){
        if(!moveSelection){
            copyMode = 0;
            return;
        }
        var tempCanvas2 = document.createElement("canvas");
        tempCanvas2.width = moveSelection.w;
        tempCanvas2.height = moveSelection.h;
        var tempCtx2 = tempCanvas2.getContext("2d");
        tempCtx2.putImageData(
            moveSelection.data,
            0,
            0
        );
        ctx.drawImage(
            tempCanvas2,
            x - moveSelection.w / 2,
            y - moveSelection.h / 2
        );
        saveState();
        moveSelection = null;
        moveBaseImage = null;
        copyMode = 0;
        moveMode = 0;
        return;
    }
    /* DESSIN NORMAL */
    if(currentTool==="free"){
        return;
    }
    if(currentTool==="eraser"){
        return;
    }
    if(currentTool==="line"){
        redrawFromUndoTop();
        ctx.beginPath();
        ctx.moveTo(startX,startY);
        ctx.lineTo(x,y);
        ctx.stroke();
        return;
    }
    if(currentTool==="arrow"){
        redrawFromUndoTop();
        drawArrowPreview(x,y);
        return;
    }
    if(currentTool==="square"){
        drawSquarePreview(x,y);
        return;
    }
    if(currentTool==="rect"){
        redrawFromUndoTop();
        ctx.beginPath();
        ctx.rect(
            startX,
            startY,
            x-startX,
            y-startY
        );
        ctx.stroke();
        return;
    }
    if(currentTool==="circle"){
        drawCirclePreview(x,y);
        return;
    }
    if(currentTool==="ellipse"){
        drawEllipsePreview(x,y);
        return;
    }
    if(currentTool==="fill"){
        return;
    }
};
/* COMPATIBILITE ANCIENS NAVIGATEURS / NINTENDO 3DS */
if (!window.PointerEvent) {
    canvas.ontouchstart = function(e){
        if(!e.touches || !e.touches.length) return;
        e.preventDefault();
        var t = e.touches[0];
        canvas.onpointerdown({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchmove = function(e){
        if(!e.touches || !e.touches.length) return;
        e.preventDefault();
        var t = e.touches[0];
        canvas.onpointermove({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchend = function(e){
        e.preventDefault();
        if(!e.changedTouches || !e.changedTouches.length){
            return;
        }
        var t = e.changedTouches[0];
        canvas.onpointerup({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchcancel = function(){
        drawing = false;
        isDown = false;
    };
}
/* FLOOD FILL (simple) */
function floodFill(x,y){
    var img = ctx.getImageData(0,0,canvas.width,canvas.height);
    var data = img.data;
    var target = getPixel(data,x,y);
    var fill = hexToRgba(ctx.fillStyle);
    if(colorsEqual(target,fill)) return;
    var stack = [{x:x,y:y}];
    while(stack.length){
        var p = stack.pop();
        var px = p.x, py = p.y;
        var idx = (py*canvas.width+px)*4;
        var cur = [data[idx],data[idx+1],data[idx+2],data[idx+3]];
        if(!colorsEqual(cur,target)) continue;
        setPixel(data,px,py,fill);
        if(px>0) stack.push({x:px-1,y:py});
        if(px<canvas.width-1) stack.push({x:px+1,y:py});
        if(py>0) stack.push({x:px,y:py-1});
        if(py<canvas.height-1) stack.push({x:px,y:py+1});
    }
    ctx.putImageData(img,0,0);
}
function getPixel(data,x,y){
    var i = (y*canvas.width+x)*4;
    return [data[i],data[i+1],data[i+2],data[i+3]];
}
function setPixel(data,x,y,col){
    var i = (y*canvas.width+x)*4;
    data[i]=col[0];data[i+1]=col[1];data[i+2]=col[2];data[i+3]=col[3];
}
function hexToRgba(hex){
    var h = hex.replace("#","");
    var r=parseInt(h.substr(0,2),16);
    var g=parseInt(h.substr(2,2),16);
    var b=parseInt(h.substr(4,2),16);
    return [r,g,b,255];
}
function colorsEqual(a,b){
    return a[0]===b[0] && a[1]===b[1] && a[2]===b[2] && a[3]===b[3];
}
saveState();
function exportPNG(){
    var png = canvas.toDataURL("image/png");
    document.getElementById("ioArea").value = png;
}
function importPNG(){
    var base64 = document.getElementById("ioArea").value;
    if(!base64) return;
    var img = new Image();
    img.onload = function(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
        saveState();
        redrawFromUndoTop();
    };
    img.src = base64;
}
function downloadPNG(){
    var link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = "dessin.png";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
function downloadJPG(){
    var jpgCanvas = document.createElement("canvas");
    jpgCanvas.width = canvas.width;
    jpgCanvas.height = canvas.height;
    var jpgCtx = jpgCanvas.getContext("2d");
    /* Fond blanc */
    jpgCtx.fillStyle = "#ffffff";
    jpgCtx.fillRect(
        0,
        0,
        jpgCanvas.width,
        jpgCanvas.height
    );
    /* Copier le dessin */
    jpgCtx.drawImage(
        canvas,
        0,
        0
    );
    var link = document.createElement("a");
    link.href = jpgCanvas.toDataURL(
        "image/jpeg",
        0.92
    );
    link.download = "dessin.jpg";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
