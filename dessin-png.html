<script>
/* Multitouch, popup et color-palette */
addMultiTouch("button,input");
function setToolFree(){ setTool("free"); }
function setToolLine(){ setTool("line"); }
function setToolArrow(){ setTool("arrow"); }
function setToolSquare(){ setTool("square"); }
function setToolRect(){ setTool("rect"); }
function setToolCircle(){ setTool("circle"); }
function setToolEllipse(){ setTool("ellipse"); }
function setToolText(){ setTool("text"); }
function setToolMove(){ setTool("move"); }
function setToolCopy(){ setTool("copy"); }
function setToolFill(){ setTool("fill"); }
function setToolEraser(){ setTool("eraser"); }
function openOptionsPopup() {
  var container = document.getElementById("popupOptionsContent");
  openPopupMenu(container);
}
// Changer la couleur du tracé
attachColorPickerTo(document.getElementById("colorInput"));
var colorInput = document.getElementById("colorInput");
var rainbowMode = false;
var rainbowHue = 0;
function applyColor(){
    var col = colorInput.value;
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
}
colorInput.oninput = applyColor;
function toggleRainbow(){
    rainbowMode = !rainbowMode;
    var btn = document.getElementById("btnRainbow");
    if(rainbowMode){
        btn.className = "active";
    } else {
        btn.className = "";
        applyColor();
    }
}
function rainbowColor(h){
    var i = Math.floor(h / 60);
    var f = h - i * 60;
    var q = 255 - Math.round(255 * f / 60);
    var t = 255 - q;
    var r,g,b;
    if(i === 0){
        r = 255; g = t; b = 0;
    } else if(i === 1){
        r = q; g = 255; b = 0;
    } else if(i === 2){
        r = 0; g = 255; b = t;
    } else if(i === 3){
        r = 0; g = q; b = 255;
    } else if(i === 4){
        r = t; g = 0; b = 255;
    } else {
        r = 255; g = 0; b = q;
    }
    return "#" +
        ("0" + r.toString(16)).slice(-2) +
        ("0" + g.toString(16)).slice(-2) +
        ("0" + b.toString(16)).slice(-2);
}
function createRainbowGradient(x1,y1,x2,y2){
    var gradient = ctx.createLinearGradient(x1,y1,x2,y2);
    gradient.addColorStop(0, "#ff0000");
    gradient.addColorStop(0.16, "#ff9900");
    gradient.addColorStop(0.33, "#ffff00");
    gradient.addColorStop(0.50, "#00ff00");
    gradient.addColorStop(0.66, "#00ffff");
    gradient.addColorStop(0.83, "#0000ff");
    gradient.addColorStop(1, "#ff00ff");
    return gradient;
}
function applyRainbowGradient(x1,y1,x2,y2){
    if(rainbowMode){
        ctx.strokeStyle = createRainbowGradient(
            x1,y1,x2,y2
        );
        ctx.fillStyle = ctx.strokeStyle;
    } else {
        applyColor();
    }
}
document.onmouseup = function () {
    draggingHue = false;
    draggingSV  = false;
    draggingAlpha = false;
    if (colorInput) {
        colorInput.dispatchEvent(new Event("input"));
    }
};
document.ontouchend = function () {
    draggingHue = false;
    draggingSV  = false;
    draggingAlpha = false;
    if (colorInput) {
        colorInput.dispatchEvent(new Event("input"));
    }
};
// Changer la Taille du tracé
var sizeInput = document.getElementById("sizeInput");
var sizeLabel = document.getElementById("sizeLabel");
sizeInput.oninput = function(){
    var v = parseInt(sizeInput.value, 10);
    sizeLabel.textContent = v;
    ctx.lineWidth = v;
};
/* VARIABLES */
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
/* ZOOM DU CANVAS */
var zoomInput = document.getElementById("zoomInput");
var zoomLabel = document.getElementById("zoomLabel");
function applyZoom(){
    var zoom = parseInt(zoomInput.value,10) / 100;
    canvas.style.width = Math.round(canvas.width * zoom) + "px";
    canvas.style.height = Math.round(canvas.height * zoom) + "px";
    zoomLabel.textContent = zoomInput.value + "%";
}
zoomInput.oninput = function(){ applyZoom(); };
applyZoom();
var canvasWidthInput = document.getElementById("canvasWidth");
var canvasHeightInput = document.getElementById("canvasHeight");
function changeCanvasResolution(){
    var newWidth = parseInt(canvasWidthInput.value, 10);
    var newHeight = parseInt(canvasHeightInput.value, 10);
    if(newWidth < 1 || newHeight < 1){
        alert("Résolution invalide.");
        return;
    }
    // Sauvegarder le dessin actuel
    var oldCanvas = document.createElement("canvas");
    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;
    var oldCtx = oldCanvas.getContext("2d");
    oldCtx.drawImage(
        canvas,
        0,
        0
    );
    // Changer la résolution réelle
    canvas.width = newWidth;
    canvas.height = newHeight;
    // Restaurer l'ancien dessin
    ctx.drawImage(
        oldCanvas,
        0,
        0
    );
    // Restaurer les paramètres du contexte
    ctx.lineWidth = parseInt(sizeInput.value, 10);
    ctx.lineCap = "round";
    applyColor();
    // Reset Undo / Redo
    undoStack = [];
    redoStack = [];
    saveState();
    // Mettre à jour les champs 
    canvasWidthInput.value = newWidth;
    canvasHeightInput.value = newHeight;
    applyZoom();
    closePopup();
}
/* IMAGE : DEPLACER / REDIMENSIONNER / ROTATION */
var imageFile = document.getElementById("imageFile");
var tempImage = null;
var tempImageX = 0;
var tempImageY = 0;
var tempImageW = 0;
var tempImageH = 0;
var tempImageAngle = 0;
var imageBaseImage = null;
/*
 * 0 = rien
 * 1 = déplacement
 * 2 = redimensionnement
 * 3 = rotation
 */
var imageAction = 0;
var imageHandle = "";
var imageStartX = 0;
var imageStartY = 0;
var imageStartW = 0;
var imageStartH = 0;
var imageStartAngle = 0;
var imageStartDistance = 0;
var imageStartPointerAngle = 0;
/* CHARGEMENT */
imageFile.onchange = function(){
    if(!imageFile.files || !imageFile.files.length){
        return;
    }
    var file = imageFile.files[0];
    if(!file.type || file.type.indexOf("image/") !== 0){
        alert("Veuillez sélectionner une image.");
        imageFile.value = "";
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
            // Si une autre image temporaire existe, on la valide avant d'en charger une nouvelle.
            if(tempImage){
                commitTempImage();
            }
            tempImage = img;
            tempImageW = img.width;
            tempImageH = img.height;
            // Taille maximale initiale.
            var maxW = 300;
            var maxH = 300;
            if(tempImageW > maxW){
                tempImageH =
                    tempImageH * maxW / tempImageW;
                tempImageW = maxW;
            }
            if(tempImageH > maxH){
                tempImageW =
                    tempImageW * maxH / tempImageH;
                tempImageH = maxH;
            }
            // Centrer l'image.
            tempImageX = (canvas.width - tempImageW) / 2;
            tempImageY = (canvas.height - tempImageH) / 2;
            tempImageAngle = 0;
            // Sauvegarder le dessin avant l'image.
            imageBaseImage = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );
            currentTool = "image";
            drawTempImage();
            updateDimensions(
                tempImageW,
                tempImageH
            );
            imageFile.value = "";
        };
        img.onerror = function(){
            alert("Impossible de charger cette image.");
            imageFile.value = "";
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
/* CALCUL DES COORDONNEES */
function getImageCenter(){
    return {
        x: tempImageX + tempImageW / 2,
        y: tempImageY + tempImageH / 2
    };
}
/* Distance entre deux points. */
function imageDistance(x1,y1,x2,y2){
    var dx = x2-x1;
    var dy = y2-y1;
    return Math.sqrt(dx*dx + dy*dy);
}
/* Angle entre deux points. */
function imagePointerAngle(x1,y1,x2,y2){
    return Math.atan2(
        y2-y1,
        x2-x1
    );
}
/* POINT DANS L'IMAGE */
function pointInTempImage(x,y){
    if(!tempImage){
        return false;
    }
    var c = getImageCenter();
    var dx = x-c.x;
    var dy = y-c.y;
    // Annuler la rotation.
    var cos = Math.cos(-tempImageAngle);
    var sin = Math.sin(-tempImageAngle);
    var rx =
        dx*cos - dy*sin;
    var ry =
        dx*sin + dy*cos;
    return (
        rx >= -tempImageW/2 &&
        rx <=  tempImageW/2 &&
        ry >= -tempImageH/2 &&
        ry <=  tempImageH/2
    );
}
/* POIGNEES */
function getImageHandle(x,y){
    if(!tempImage){
        return "";
    }
    var c = getImageCenter();
    var cos = Math.cos(-tempImageAngle);
    var sin = Math.sin(-tempImageAngle);
    var dx = x-c.x;
    var dy = y-c.y;
    // Coordonnées locales.
    var lx =
        dx*cos - dy*sin;
    var ly =
        dx*sin + dy*cos;
    var hs = 10;
    // Poignée rotation. Elle est située au-dessus de l'image.
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly + tempImageH/2 + 35) < hs
    ){
        return "rotate";
    }
    // Poignées de redimensionnement.
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "nw";
    }
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "n";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly + tempImageH/2) < hs
    ){
        return "ne";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly) < hs
    ){
        return "e";
    }
    if(
        Math.abs(lx - tempImageW/2) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "se";
    }
    if(
        Math.abs(lx) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "s";
    }
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly - tempImageH/2) < hs
    ){
        return "sw";
    }
    if(
        Math.abs(lx + tempImageW/2) < hs &&
        Math.abs(ly) < hs
    ){
        return "w";
    }
    return "";
}
/* DESSIN DE L'IMAGE + CADRE + POIGNEES */
function drawTempImage(){
    if(!tempImage){
        return;
    }
    if(imageBaseImage){
        ctx.putImageData(
            imageBaseImage,
            0,
            0
        );
    }
    var c = getImageCenter();
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(tempImageAngle);
    /* Image */
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(
        tempImage,
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    /* Cadre */
    ctx.globalCompositeOperation = "source-over";
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#000000";
    ctx.fillStyle = "#ffffff";
    ctx.strokeRect(
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    /* Poignées */
    var handles = [
        [-tempImageW/2,-tempImageH/2],
        [0,-tempImageH/2],
        [tempImageW/2,-tempImageH/2],
        [tempImageW/2,0],
        [tempImageW/2,tempImageH/2],
        [0,tempImageH/2],
        [-tempImageW/2,tempImageH/2],
        [-tempImageW/2,0]
    ];
    var i;
    for(i=0;i<handles.length;i++){
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(
            handles[i][0]-5,
            handles[i][1]-5,
            10,
            10
        );
        ctx.fill();
        ctx.stroke();
    }
    /* Ligne de rotation */
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(
        0,
        -tempImageH/2
    );
    ctx.lineTo(
        0,
        -tempImageH/2-35
    );
    ctx.stroke();
    /* Poignée de rotation */
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(
        0,
        -tempImageH/2-35,
        7,
        0,
        Math.PI*2,
        false
    );
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}
/* VALIDER L'IMAGE */
function commitTempImage(){
    if(!tempImage){
        return;
    }
    // Restaurer le fond.
    if(imageBaseImage){
        ctx.putImageData(
            imageBaseImage,
            0,
            0
        );
    }
    /*
     * L'image devient définitivement
     * une partie du dessin.
     */
    var c = getImageCenter();
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(tempImageAngle);
    var oldComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(
        tempImage,
        -tempImageW/2,
        -tempImageH/2,
        tempImageW,
        tempImageH
    );
    ctx.globalCompositeOperation = oldComposite;
    ctx.restore();
    // Sauvegarder le résultat dans Undo.
    undoStack.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );
    redoStack = [];
    tempImage = null;
    imageBaseImage = null;
    imageAction = 0;
    imageHandle = "";
    hideDimensions();
}
/* IMPORTER UN DESSIN ENTIER */
var drawingFile = document.getElementById("drawingFile");
drawingFile.onchange = function(){
    if(!drawingFile.files || !drawingFile.files.length){
        return;
    }
    var file = drawingFile.files[0];
    if(!file.type || file.type.indexOf("image/") !== 0){
        alert("Veuillez sélectionner une image.");
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
            /*
             * Sauvegarder l'ancien dessin
             * pour permettre Annuler.
             */
            saveState();
            /*
             * IMPORTANT :
             * l'import doit toujours utiliser
             * le mode de dessin normal.
             *
             * Sinon, si la gomme était active,
             * destination-out effacerait l'image.
             */
            ctx.globalCompositeOperation = "source-over";
            // Effacer le dessin actuel.
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            /*
             * Adapter l'image au canvas
             * sans déformer ses proportions.
             */
            var scaleX = canvas.width / img.width;
            var scaleY = canvas.height / img.height;
            var scale = Math.min(scaleX, scaleY);
            var w = img.width * scale;
            var h = img.height * scale;
            var x = (canvas.width - w) / 2;
            var y = (canvas.height - h) / 2;
            ctx.drawImage(
                img,
                x,
                y,
                w,
                h
            );
            /*
             * Si la gomme était l'outil actif,
             * on remet destination-out après
             * l'import pour qu'elle continue
             * à fonctionner normalement.
             */
            if(currentTool === "eraser"){
                ctx.globalCompositeOperation = "destination-out";
            } else {
                ctx.globalCompositeOperation = "source-over";
            }
            drawingFile.value = "";
        };
        img.onerror = function(){
            alert("Impossible de charger cette image.");
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};
var textBox = document.getElementById("textBox");
var textInput = document.getElementById("textInput");
var fontInput = document.getElementById("fontInput");
var textFont = "sans-serif";
fontInput.onchange = function(){ textFont = fontInput.value; };
var confirmTextBtn = document.getElementById("confirmTextBtn");
var cancelTextBtn = document.getElementById("cancelTextBtn");
ctx.clearRect(0,0,canvas.width,canvas.height);
var drawing = false;
var moved = false;
var moveBaseImage = null;
var startX = 0, startY = 0;
var lastX = 0, lastY = 0;
var currentTool = "free";
ctx.lineWidth = 3;
ctx.lineCap = "round";
ctx.strokeStyle = "#000000";
ctx.fillStyle = "rgba(0,0,0,0)";
// Undo / Redo
var undoStack = [];
var redoStack = [];
// Selection
var moveMode = 0;     // 0 = sélection, 1 = déplacement
var copyMode = 0;     // 0 = sélection, 1 = déplacement
var moveSelection = null;
var textX = 0;
var textY = 0;
/* TOOL FUNCTIONS */
function setTool(t){
    /* Si une image est en cours de manipulation, on la valide avant de changer d'outil. */
    if(
        tempImage &&
        currentTool === "image" &&
        t !== "image"
    ){
        commitTempImage();
    }
    currentTool = t;
    // reset move/copy si on change d’outil
    moveMode = 0;
    copyMode = 0;
    selection = null;
    moveSelection = null;
    // enlever active partout
    btnFree.className = "";
    btnLine.className = "";
    btnArrow.className = "";
    btnSquare.className = "";
    btnRect.className = "";
    btnCircle.className = "";
    btnEllipse.className = "";
    btnText.className = "";
    btnFill.className = "";
    btnEraser.className = "";
    btnMove.className = "";
    btnCopy.className = "";
    // activer le bon bouton
    if(t==="free")   btnFree.className = "active";
    if(t==="line")   btnLine.className = "active";
    if(t==="arrow")  btnArrow.className = "active";
    if(t==="square")   btnSquare.className = "active";
    if(t==="rect")   btnRect.className = "active";
    if(t==="circle") btnCircle.className = "active";

/* UNDO / REDO */
var MAX_UNDO = 10;
function saveState(){
    undoStack.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );
    if(undoStack.length > MAX_UNDO){
        undoStack.shift();
    }
    redoStack = [];
}
function undo(){
    if(undoStack.length){
        var img = undoStack.pop();
        redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
        ctx.putImageData(img,0,0);
    }
}
function redo(){
    if(redoStack.length){
        var img = redoStack.pop();
        undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
        ctx.putImageData(img,0,0);
    }
}
/* POSITION */
function getPos(e){
    var rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}
/* DRAWING FUNCTIONS */
/* DESSIN PIXEL */
function drawPixel(x,y){
    x = Math.round(x);
    y = Math.round(y);
    var size = Math.max(
        1,
        Math.round(parseInt(sizeInput.value,10))
    );
    ctx.fillRect(
        x - Math.floor(size / 2),
        y - Math.floor(size / 2),
        size,
        size
    );
}
function drawPixelLine(x1,y1,x2,y2){
    x1 = Math.round(x1);
    y1 = Math.round(y1);
    x2 = Math.round(x2);
    y2 = Math.round(y2);
    var dx = Math.abs(x2-x1);
    var dy = Math.abs(y2-y1);
    var sx = x1 < x2 ? 1 : -1;
    var sy = y1 < y2 ? 1 : -1;
    var err = dx-dy;
    while(true){
        drawPixel(x1,y1);
        if(x1 === x2 && y1 === y2){
            break;
        }
        var e2 = 2*err;
        if(e2 > -dy){
            err -= dy;
            x1 += sx;
        }
        if(e2 < dx){
            err += dx;
            y1 += sy;
        }
    }
}
function drawPixelEllipse(cx,cy,rx,ry){
    rx = Math.abs(rx);
    ry = Math.abs(ry);
    if(rx < 0.5){
        if(rainbowMode){
            drawPixelRainbowLine(cx,cy-ry,cx,cy+ry);
        } else {
            drawPixelLine(cx,cy-ry,cx,cy+ry);
        }
        return;
    }
    if(ry < 0.5){
        if(rainbowMode){
            drawPixelRainbowLine(cx-rx,cy,cx+rx,cy);
        } else {
            drawPixelLine(cx-rx,cy,cx+rx,cy);
        }
        return;
    }
    var steps = Math.max(
        8,
        Math.round(2*Math.PI*Math.max(rx,ry))
    );
    var oldX = Math.round(
        cx + Math.cos(0)*rx
    );
    var oldY = Math.round(
        cy + Math.sin(0)*ry
    );
    var i;
    for(i=1;i<=steps;i++){
        var a =
            i / steps * Math.PI * 2;
        var x = Math.round(
            cx + Math.cos(a)*rx
        );
        var y = Math.round(
            cy + Math.sin(a)*ry
        );
        if(rainbowMode){
            drawPixelRainbowLine(
                oldX,
                oldY,
                x,
                y
            );
        } else {
            drawPixelLine(
                oldX,
                oldY,
                x,
                y
            );
        }
        oldX = x;
        oldY = y;
    }
}
function drawFree(x,y){
    var dx = x-lastX;
    var dy = y-lastY;
    var distance = Math.sqrt(dx*dx+dy*dy);
    if(distance < 0.1){
        return;
    }
    if(currentTool === "eraser"){
        ctx.globalCompositeOperation = "destination-out";
    } else {
        ctx.globalCompositeOperation = "source-over";
    }
    if(rainbowMode){
        drawPixelRainbowLine(
            lastX,lastY,
            x,y
        );
    } else {
        ctx.fillStyle = ctx.strokeStyle;
        drawPixelLine(
            lastX,lastY,
            x,y
        );
    }
    lastX = x;
    lastY = y;
}

function drawPixelRainbowLine(x1,y1,x2,y2){
    var dx = x2-x1;
    var dy = y2-y1;
    var distance = Math.sqrt(dx*dx+dy*dy);
    var steps = Math.max(
        1,
        Math.floor(distance)
    );
    var i;
    for(i=0;i<=steps;i++){
        var t = i/steps;
        var px = x1+dx*t;
        var py = y1+dy*t;
        ctx.fillStyle =
            rainbowColor(rainbowHue);
        drawPixelLine(
            px,py,
            px,py
        );
        rainbowHue += 1.5;
        if(rainbowHue >= 360){
            rainbowHue %= 360;
        }
    }
}
function drawArrowPreview(x,y){
    redrawFromUndoTop();
    if(currentTool === "eraser"){
        ctx.globalCompositeOperation = "destination-out";
    } else {
        ctx.globalCompositeOperation = "source-over";
    }
    var dx = x-startX;
    var dy = y-startY;
    var len = Math.sqrt(
        dx*dx + dy*dy
    );
    if(len < 1){
        return;
    }
    var ux = dx/len;
    var uy = dy/len;
    var headLen =
        Math.max(
            4,
            Math.round(
                parseInt(sizeInput.value,10) * 4
            )
        );
    var headWidth =
        headLen * 0.5;
    var baseX =
        x - ux*headLen;
    var baseY =
        y - uy*headLen;
    var px = -uy;
    var py = ux;
    var x1 =
        baseX + px*headWidth;
    var y1 =
        baseY + py*headWidth;
    var x2 =
        baseX - px*headWidth;
    var y2 =
        baseY - py*headWidth;
    if(rainbowMode){
        drawPixelRainbowLine(
            startX,
            startY,
            baseX,
            baseY
        );
        drawPixelRainbowLine(
            x,
            y,
            x1,
            y1
        );
        drawPixelRainbowLine(
            x1,
            y1,
            x2,
            y2
        );
        drawPixelRainbowLine(
            x2,
            y2,
            x,
            y
        );
    } else {
        ctx.fillStyle = ctx.strokeStyle;
        drawPixelLine(
            startX,
            startY,
            baseX,
            baseY
        );
        drawPixelLine(
            x,
            y,
            x1,
            y1
        );
        drawPixelLine(
            x1,
            y1,
            x2,
            y2
        );
        drawPixelLine(
            x2,
            y2,
            x,
            y
        );
    }
}
function drawPixelTriangle(x1,y1,x2,y2,x3,y3){
    var minX = Math.floor(
        Math.min(x1,x2,x3)
    );
    var maxX = Math.ceil(
        Math.max(x1,x2,x3)
    );
    var minY = Math.floor(
        Math.min(y1,y2,y3)
    );
    var maxY = Math.ceil(
        Math.max(y1,y2,y3)
    );
    var x,y;
    for(y=minY;y<=maxY;y++){
        for(x=minX;x<=maxX;x++){
            var d1 =
                (x2-x1)*(y-y1) -
                (y2-y1)*(x-x1);
            var d2 =
                (x3-x2)*(y-y2) -
                (y3-y2)*(x-x2);
            var d3 =
                (x1-x3)*(y-y3) -
                (y1-y3)*(x-x3);
            if(
                (d1 >= 0 && d2 >= 0 && d3 >= 0) ||
                (d1 <= 0 && d2 <= 0 && d3 <= 0)
            ){
                drawPixel(
                    x,
                    y
                );
            }
        }
    }
    /*
     * Contour de la pointe
     */
    drawPixelLine(
        x1,y1,
        x2,y2
    );
    drawPixelLine(
        x2,y2,
        x3,y3
    );
    drawPixelLine(
        x3,y3,
        x1,y1
    );
}

function drawSelectionPreview(x,y){
    /* Restaurer le dessin avant le rectangle temporaire. */
    if(moveBaseImage){
        ctx.putImageData(moveBaseImage,0,0);
    }
    var sx = Math.floor(Math.min(startX,x));
    var sy = Math.floor(Math.min(startY,y));
    var ex = Math.floor(Math.max(startX,x));
    var ey = Math.floor(Math.max(startY,y));
    var w = ex - sx;
    var h = ey - sy;
    if(w < 1 || h < 1){
        return;
    }
    ctx.save();
    /*
     * Sélection fantôme :
     * toujours 1 pixel, quelle que soit
     * la taille du pinceau sélectionnée.
     */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000000";
    var dash = 6;
    var gap = 4;
    var i;
    /* Haut */
    for(i = sx; i < ex; i += dash + gap){
        drawPixelLine1px(
            i,
            sy,
            Math.min(i + dash - 1, ex),
            sy
        );
    }
    /* Bas */
    for(i = sx; i < ex; i += dash + gap){
        drawPixelLine1px(
            i,
            ey,
            Math.min(i + dash - 1, ex),
            ey
        );
    }
    /* Gauche */
    for(i = sy; i < ey; i += dash + gap){
        drawPixelLine1px(
            sx,
            i,
            sx,
            Math.min(i + dash - 1, ey)
        );
    }
    /* Droite */
    for(i = sy; i < ey; i += dash + gap){
        drawPixelLine1px(
            ex,
            i,
            ex,
            Math.min(i + dash - 1, ey)
        );
    }
    ctx.restore();
}
function confirmText(){
    var text = textInput.value;
    textBox.style.display = "none";
    if(!text){
        textInput.value = "";
        return;
    }
    saveState();
    var lines = text.split(/\r?\n/);
    var fontSize = parseInt(sizeInput.value,10) * 5;
    if(!fontSize || fontSize < 1){
        fontSize = 15;
    }
    ctx.save();
    ctx.font = fontSize + "px " + textFont;
    ctx.textBaseline = "top";
    var lineHeight = Math.round(fontSize * 1.2);
    var i;
    if(rainbowMode){
        // Mesurer la largeur totale du texte pour que le dégradé couvre réellement toute la longueur.
        var maxWidth = 0;
        for(i = 0; i < lines.length; i++){
            var width = ctx.measureText(lines[i]).width;
            if(width > maxWidth){
                maxWidth = width;
            }
        }
        var gradient = ctx.createLinearGradient(
            textX,
            textY,
            textX + maxWidth,
            textY
        );
        gradient.addColorStop(0, "#ff0000");
        gradient.addColorStop(0.16, "#ff9900");
        gradient.addColorStop(0.33, "#ffff00");
        gradient.addColorStop(0.50, "#00ff00");
        gradient.addColorStop(0.66, "#00ffff");
        gradient.addColorStop(0.83, "#0000ff");
        gradient.addColorStop(1, "#ff00ff");
        ctx.fillStyle = gradient;
    } else {
        ctx.fillStyle = colorInput.value;
    }
    for(i = 0; i < lines.length; i++){
        ctx.fillText(
            lines[i],
            textX,
            textY + i * lineHeight
        );
    }
    ctx.restore();
    textInput.value = "";
}

/* =========================================================
   DEPLACER / DUPLIQUER EN PIXELS
   ========================================================= */
var selection = null;
/*
 * selection :
 * {
 *   x: 0,
 *   y: 0,
 *   w: 0,
 *   h: 0,
 *   data: ImageData
 * }
 */
var selectionBaseImage = null;
var selectionMoving = false;
/*
 * Crée une sélection pixel parfaite.
 */
function createPixelSelection(x1,y1,x2,y2,removeOriginal){
    var sx = Math.floor(Math.min(x1,x2));
    var sy = Math.floor(Math.min(y1,y2));
    var ex = Math.floor(Math.max(x1,x2));
    var ey = Math.floor(Math.max(y1,y2));
    var w = ex - sx;
    var h = ey - sy;
    if(w < 1 || h < 1){
        return false;
    }
    /*
     * ImageData conserve EXACTEMENT :
     *
     * R
     * G
     * B
     * A
     *
     * Aucun changement de transparence.
     */
    var data = ctx.getImageData(
        sx,
        sy,
        w,
        h
    );
    selection = {
        x: sx,
        y: sy,
        w: w,
        h: h,
        data: data
    };
    /*
     * Pour MOVE :
     * on retire les pixels de l'endroit original.
     *
     * Pour COPY :
     * on ne retire rien.
     */
    if(removeOriginal){
        ctx.clearRect(
            sx,
            sy,
            w,
            h
        );
    }
    /*
     * Fond permettant d'afficher le déplacement
     * sans accumuler les anciennes positions.
     */
    selectionBaseImage = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );
    return true;
}
/*
 * Affiche la sélection à une position donnée.
 *
 * IMPORTANT :
 * putImageData() ne fait aucun redimensionnement,
 * aucune interpolation et aucune modification alpha.
 */
function drawPixelSelectionAt(x,y){
    if(!selection){
        return;
    }
    /*
     * Restaurer le fond.
     */
    if(selectionBaseImage){
        ctx.putImageData(
            selectionBaseImage,
            0,
            0
        );
    }
    var px = Math.round(
        x - selection.w / 2
    );
    var py = Math.round(
        y - selection.h / 2
    );
    /*
     * Copier uniquement les pixels visibles.
     * Les pixels alpha = 0 ne doivent pas
     * effacer ce qu'il y a derrière.
     */
    var temp = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );
    var src = selection.data.data;
    var dst = temp.data;
    var sx, sy;
    var dx, dy;
    var si, di;
    for(sy = 0; sy < selection.h; sy++){
        dy = py + sy;
        if(dy < 0 || dy >= canvas.height){
            continue;
        }
        for(sx = 0; sx < selection.w; sx++){
            dx = px + sx;
            if(dx < 0 || dx >= canvas.width){
                continue;
            }
            si = (sy * selection.w + sx) * 4;
            di = (dy * canvas.width + dx) * 4;
            /*
             * Copier uniquement si le pixel
             * possède réellement quelque chose.
             */
            if(src[si + 3] !== 0){
                dst[di]     = src[si];
                dst[di + 1] = src[si + 1];
                dst[di + 2] = src[si + 2];
                dst[di + 3] = src[si + 3];
            }
        }
    }
    ctx.putImageData(
        temp,
        0,
        0
    );
}
/*
 * Dépose définitivement la sélection.
 */
function commitPixelSelection(x,y){
    if(!selection){
        return;
    }
    /*
     * Restaurer le fond original.
     */
    if(selectionBaseImage){
        ctx.putImageData(
            selectionBaseImage,
            0,
            0
        );
    }
    var px = Math.round(
        x - selection.w / 2
    );
    var py = Math.round(
        y - selection.h / 2
    );
    /*
     * On utilise exactement la même logique que
     * pendant l'aperçu :
     *
     * - alpha = 0 : on ne touche PAS au fond
     * - alpha > 0 : on copie le pixel
     *
     * Cela conserve la transparence autour de l'élément.
     */
    var temp = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );
    var src = selection.data.data;
    var dst = temp.data;
    var sx, sy;
    var dx, dy;
    var si, di;
    for(sy = 0; sy < selection.h; sy++){
        dy = py + sy;
        if(dy < 0 || dy >= canvas.height){
            continue;
        }
        for(sx = 0; sx < selection.w; sx++){
            dx = px + sx;
            if(dx < 0 || dx >= canvas.width){
                continue;
            }
            si = (sy * selection.w + sx) * 4;
            di = (dy * canvas.width + dx) * 4;
            /*
             * Pixel totalement transparent :
             * surtout ne pas modifier le pixel
             * qui se trouve derrière.
             */
            if(src[si + 3] === 0){
                continue;
            }
            /*
             * Copier le pixel avec son alpha exact.
             */
            dst[di]     = src[si];
            dst[di + 1] = src[si + 1];
            dst[di + 2] = src[si + 2];
            dst[di + 3] = src[si + 3];
        }
    }
    ctx.putImageData(
        temp,
        0,
        0
    );
    selection = null;
    selectionBaseImage = null;
    selectionMoving = false;
}
/* MOUSE EVENTS (ASCII LOGIC) */
canvas.onpointerdown = function(e){
    var p = getPos(e);
    startX = p.x;
    startY = p.y;
    lastX = p.x;
    lastY = p.y;
    /* IMAGE */
    if(currentTool === "image" && tempImage){
        var handle = getImageHandle(
            p.x,
            p.y
        );
        imageAction = 0;
        imageHandle = "";
        /*
         * Rotation
         */
        if(handle === "rotate"){
            imageAction = 3;
            var c = getImageCenter();
            imageStartAngle = tempImageAngle;
            imageStartPointerAngle =
                imagePointerAngle(
                    c.x,
                    c.y,
                    p.x,
                    p.y
                );
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        // Redimensionnement
        if(handle){
            imageAction = 2;
            imageHandle = handle;
            imageStartX = p.x;
            imageStartY = p.y;
            imageStartW = tempImageW;
            imageStartH = tempImageH;
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        // Déplacement
        if(pointInTempImage(p.x,p.y)){
            imageAction = 1;
            imageStartX =
                p.x - tempImageX;
            imageStartY =
                p.y - tempImageY;
            moved = false;
            drawing = true;
            if(
                canvas.setPointerCapture &&
                e.pointerId !== undefined
            ){
                canvas.setPointerCapture(
                    e.pointerId
                );
            }
            return;
        }
        /*
         * Clic ailleurs :
         * on valide l'image.
         */
        commitTempImage();
        drawing = false;
        return;
    }
    /* TEXTE */
    if(currentTool === "text"){
        drawing = false;
        moved = false;
        textX = p.x;
        textY = p.y;
        textInput.value = "";
        textBox.style.display = "block";
        setTimeout(function(){
            textInput.focus();
        }, 50);
        return;
    }
    drawing = true;
    moved = false;
    if(canvas.setPointerCapture && e.pointerId !== undefined){
        canvas.setPointerCapture(e.pointerId);
    }
    /* MOVE / COPY */
	if(currentTool === "move" || currentTool === "copy"){
		/*
		 * PREMIERE ETAPE :
		 * créer la sélection.
		 */
		if(
			(currentTool === "move" && moveMode === 0) ||
			(currentTool === "copy" && copyMode === 0)
		){
			moveBaseImage = ctx.getImageData(
				0,
				0,
				canvas.width,
				canvas.height
			);
			selection = null;
			selectionMoving = false;
			return;
		}
		/*
		 * DEUXIEME ETAPE :
		 * la sélection existe déjà.
		 */
		if(
			(currentTool === "move" && moveMode === 1) ||
			(currentTool === "copy" && copyMode === 1)
		){
			selectionMoving = true;
			return;
		}
	}
    /*
     * Pour les autres outils,
     * sauvegarde normale.
     */
    saveState();
	if(currentTool === "free"){
		if(rainbowMode){
			ctx.fillStyle = rainbowColor(rainbowHue);
			rainbowHue += 1.5;
		} else {
			ctx.fillStyle = ctx.strokeStyle;
		}
		drawPixelLine(startX, startY, startX, startY);
	}
    if(currentTool==="fill"){
        floodFill(
            Math.floor(p.x),
            Math.floor(p.y)
        );
        drawing = false;
        return;
    }
    if(currentTool==="eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = parseInt(sizeInput.value,10);
    }
};
/* AUTO-SCROLL DU CANVAS PENDANT LE DESSIN */
var canvasScroll = document.getElementById("canvasScroll");
var autoScrollTimer = null;
var autoScrollX = 0;
var autoScrollY = 0;
var autoScrollPointerX = 0;
var autoScrollPointerY = 0;
function updateAutoScroll(e){
    if(!drawing){
        stopAutoScroll();
        return;
    }
    var rect = canvasScroll.getBoundingClientRect();
    var edge = 25;      // distance du bord pour commencer le scroll
    var speed = 8;      // vitesse du scroll
    autoScrollPointerX = e.clientX;
    autoScrollPointerY = e.clientY;
    autoScrollX = 0;
    autoScrollY = 0;
    /* Gauche */
    if(e.clientX < rect.left + edge){
        autoScrollX = -speed;
    }
    /* Droite */
    else if(e.clientX > rect.right - edge){
        autoScrollX = speed;
    }
    /* Haut */
    if(e.clientY < rect.top + edge){
        autoScrollY = -speed;
    }
    /* Bas */
    else if(e.clientY > rect.bottom - edge){
        autoScrollY = speed;
    }
    if(autoScrollX !== 0 || autoScrollY !== 0){
        if(!autoScrollTimer){
            autoScrollTimer = setInterval(function(){
                canvasScroll.scrollLeft += autoScrollX;
                canvasScroll.scrollTop += autoScrollY;
            }, 20);
        }
    } else {
        stopAutoScroll();
    }
}
function stopAutoScroll(){
    if(autoScrollTimer){
        clearInterval(autoScrollTimer);
        autoScrollTimer = null;
    }
    autoScrollX = 0;
    autoScrollY = 0;
}
canvas.onpointermove = function(e){
    if(!drawing) return;
    updateAutoScroll(e);
    var p = getPos(e);
    var x = p.x, y = p.y;
    /* IMAGE */
        //REDIMENSIONNEMENT
        if(imageAction === 2){
            var c = getImageCenter();
            /*
             * Position du pointeur
             * dans les coordonnées de l'image.
             */
            var dx = x-c.x;
            var dy = y-c.y;
            var cos =
                Math.cos(-tempImageAngle);
            var sin =
                Math.sin(-tempImageAngle);
            var lx =
                dx*cos - dy*sin;
            var ly =
                dx*sin + dy*cos;
            var newW = tempImageW;
            var newH = tempImageH;
            // On conserve les proportions.
            var ratio =
                imageStartW / imageStartH;
            if(
                imageHandle === "e" ||
                imageHandle === "ne" ||
                imageHandle === "se"
            ){
                newW =
                    Math.max(
                        20,
                        lx + tempImageW/2
                    );
                newH =
                    newW / ratio;
            }
            else if(
                imageHandle === "w" ||
                imageHandle === "nw" ||
                imageHandle === "sw"
            ){
                newW =
                    Math.max(
                        20,
                        tempImageW/2 - lx
                    );
                newH =
                    newW / ratio;
            }
            else if(
                imageHandle === "n"
            ){
                newH =
                    Math.max(
                        20,
                        tempImageH/2 - ly
                    );
                newW =
                    newH * ratio;
            }
            else if(
                imageHandle === "s"
            ){
                newH =
                    Math.max(
                        20,
                        ly + tempImageH/2
                    );
                newW =
                    newH * ratio;
            }
            tempImageW = newW;
            tempImageH = newH;
            moved = true;
            drawTempImage();
            updateDimensions(
                tempImageW,
                tempImageH
            );
            return;
        }
        // ROTATION
        if(imageAction === 3){
            var c2 = getImageCenter();
            var currentPointerAngle =
                imagePointerAngle(
                    c2.x,
                    c2.y,
                    x,
                    y
                );
            tempImageAngle =
                imageStartAngle +
                (
                    currentPointerAngle -
                    imageStartPointerAngle
                );
            moved = true;
            drawTempImage();
            updateDimensions(
                tempImageW,
                tempImageH
            );
            return;
        }
if(currentTool === "image" && tempImage && imageAction === 1){
    tempImageX =
        p.x - tempImageW / 2;
    tempImageY =
        p.y - tempImageH / 2;
    drawTempImage();
    updateDimensions(
        tempImageW,
        tempImageH
    );
    return;
}
    if(
        currentTool==="line" ||
        currentTool==="arrow" ||
        currentTool==="square" ||
        currentTool==="rect" ||
        currentTool==="circle" ||
        currentTool==="ellipse" ||
        currentTool==="move" ||
        currentTool==="copy"
    ){
        updateDimensions(x,y);
    }
    moved = true;
    // OUTILS NORMAUX
    if(currentTool==="free") drawFree(x,y);
    else if(currentTool==="line") drawLinePreview(x,y);
    else if(currentTool==="arrow") drawArrowPreview(x,y);
    else if(currentTool==="square") drawSquarePreview(x,y);
    else if(currentTool==="rect") drawRectPreview(x,y);
    else if(currentTool==="circle") drawCirclePreview(x,y);
    else if(currentTool==="ellipse") drawEllipsePreview(x,y);
    else if(currentTool==="eraser") drawFree(x,y);
    /* MOVE / COPY */
	if(
		currentTool === "move" ||
		currentTool === "copy"
	){
		/*
		 * ETAPE 1 :
		 * rectangle de sélection.
		 */
		if(
			(currentTool === "move" && moveMode === 0) ||
			(currentTool === "copy" && copyMode === 0)
		){
			drawSelectionPreview(x,y);
			return;
		}
		/*
		 * ETAPE 2 :
		 * déplacement pixel par pixel.
		 */
		if(
			(currentTool === "move" && moveMode === 1) ||
			(currentTool === "copy" && copyMode === 1)
		){
			drawPixelSelectionAt(
				x,
				y
			);
			return;
		}
	}
    lastX = x;
    lastY = y;
};
window.addEventListener("click", function(e){
    if(window._blockNextClick && window.PointerEvent){
        e.stopPropagation();
        e.preventDefault();
        window._blockNextClick = false;
    }
});
canvas.onpointerup = function(e){
    if(!drawing){
        return;
    }
    drawing = false;
    stopAutoScroll();
    isDown = false;
if(
    canvas.hasPointerCapture &&
    canvas.hasPointerCapture(e.pointerId)
){
    canvas.releasePointerCapture(e.pointerId);
}
if(moved && window.PointerEvent){
    window._blockNextClick = true;
}
    var p = getPos(e);
    var x = p.x;
    var y = p.y;
    /* IMAGE */
    if(currentTool === "image" && tempImage){
        if(imageAction !== 0){
            imageAction = 0;
            imageHandle = "";
            drawTempImage();
            if(
                canvas.hasPointerCapture &&
                canvas.hasPointerCapture(e.pointerId)
            ){
                canvas.releasePointerCapture(
                    e.pointerId
                );
            }
            return;
        }
    }
    hideDimensions();
    /* MOVE : première étape = sélection */
	if(
		currentTool === "move" &&
		moveMode === 0
	){
		/*
		 * Restaurer le canvas avant de capturer
		 * les pixels.
		 */
		if(moveBaseImage){
			ctx.putImageData(
				moveBaseImage,
				0,
				0
			);
		}
		if(!createPixelSelection(
			startX,
			startY,
			x,
			y,
			true
		)){
			return;
		}
		moveMode = 1;
		hideDimensions();
		return;
	}
    /* COPY : première étape = sélection */
	if(
		currentTool === "copy" &&
		copyMode === 0
	){
		/*
		 * Restaurer le canvas avant la capture.
		 */
		if(moveBaseImage){
			ctx.putImageData(
				moveBaseImage,
				0,
				0
			);
		}
		if(!createPixelSelection(
			startX,
			startY,
			x,
			y,
			false
		)){
			return;
		}
		copyMode = 1;
		hideDimensions();
		return;
	}
    /* MOVE : deuxième étape = dépôt */
	if(
		currentTool === "move" &&
		moveMode === 1
	){
		commitPixelSelection(
			x,
			y
		);
		moveMode = 0;
		copyMode = 0;
		moveSelection = null;
		moveBaseImage = null;
		saveState();
		return;
	}
    /* COPY : deuxième étape = dépôt */
	if(
		currentTool === "copy" &&
		copyMode === 1
	){
		commitPixelSelection(
			x,
			y
		);
		copyMode = 0;
		moveMode = 0;
		moveSelection = null;
		moveBaseImage = null;
		saveState();
		return;
	}
    /* DESSIN NORMAL */
    if(currentTool==="free"){
        return;
    }
    if(currentTool==="eraser"){
        return;
    }
	if(currentTool==="line"){
		redrawFromUndoTop();
		if(currentTool === "eraser"){
			ctx.globalCompositeOperation = "destination-out";
		} else {
			ctx.globalCompositeOperation = "source-over";
		}
		if(rainbowMode){
			drawPixelRainbowLine(
				startX,
				startY,
				x,
				y
			);
		} else {
			ctx.fillStyle = ctx.strokeStyle;
			drawPixelLine(
				startX,
				startY,
				x,
				y
			);
		}
		return;
	}
    if(currentTool==="arrow"){
        redrawFromUndoTop();
        drawArrowPreview(x,y);
        return;
    }
    if(currentTool==="square"){
        drawSquarePreview(x,y);
        return;
    }
	if(currentTool==="rect"){
		drawRectPreview(x,y);
		return;
	}
    if(currentTool==="circle"){
        drawCirclePreview(x,y);
        return;
    }
    if(currentTool==="ellipse"){
        drawEllipsePreview(x,y);
        return;
    }
    if(currentTool==="fill"){
        return;
    }
};
/* COMPATIBILITE ANCIENS NAVIGATEURS / NINTENDO 3DS */
if (!window.PointerEvent) {
    canvas.ontouchstart = function(e){
        if(!e.touches || !e.touches.length) return;
        e.preventDefault();
        var t = e.touches[0];
        canvas.onpointerdown({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchmove = function(e){
        if(!e.touches || !e.touches.length) return;
        e.preventDefault();
        var t = e.touches[0];
        canvas.onpointermove({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchend = function(e){
        e.preventDefault();
        if(!e.changedTouches || !e.changedTouches.length){
            return;
        }
        var t = e.changedTouches[0];
        canvas.onpointerup({
            clientX: t.clientX,
            clientY: t.clientY,
            pointerId: 1
        });
    };
    canvas.ontouchcancel = function(){
        drawing = false;
        isDown = false;
    };
}
/* FLOOD FILL (simple) */
function floodFill(x,y){
    var img = ctx.getImageData(0,0,canvas.width,canvas.height);
    var data = img.data;
    var target = getPixel(data,x,y);
    var fill = hexToRgba(ctx.fillStyle);
    if(colorsEqual(target,fill)) return;
    var stack = [{x:x,y:y}];
    while(stack.length){
        var p = stack.pop();
        var px = p.x, py = p.y;
        var idx = (py*canvas.width+px)*4;
        var cur = [data[idx],data[idx+1],data[idx+2],data[idx+3]];
        if(!colorsEqual(cur,target)) continue;
        setPixel(data,px,py,fill);
        if(px>0) stack.push({x:px-1,y:py});
        if(px<canvas.width-1) stack.push({x:px+1,y:py});
        if(py>0) stack.push({x:px,y:py-1});
        if(py<canvas.height-1) stack.push({x:px,y:py+1});
    }
    ctx.putImageData(img,0,0);
}
function getPixel(data,x,y){
    var i = (y*canvas.width+x)*4;
    return [data[i],data[i+1],data[i+2],data[i+3]];
}
function setPixel(data,x,y,col){
    var i = (y*canvas.width+x)*4;
    data[i]=col[0];data[i+1]=col[1];data[i+2]=col[2];data[i+3]=col[3];
}
function hexToRgba(hex){
    var h = hex.replace("#","");
    var r=parseInt(h.substr(0,2),16);
    var g=parseInt(h.substr(2,2),16);
    var b=parseInt(h.substr(4,2),16);
    return [r,g,b,255];
}
function colorsEqual(a,b){
    return a[0]===b[0] && a[1]===b[1] && a[2]===b[2] && a[3]===b[3];
}

function importPNG(){
    var base64 = document.getElementById("ioArea").value;
    if(!base64) return;
    var img = new Image();
    img.onload = function(){
        /* Toujours importer en mode normal, même si la gomme était active. */
        ctx.globalCompositeOperation = "source-over";
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
        ctx.drawImage(
            img,
            0,
            0
        );
        /* Restaurer les paramètres du dessin après l'import. */
        ctx.lineWidth = parseInt(sizeInput.value,10);
        ctx.lineCap = "round";

            ctx.globalCompositeOperation = "destination-out";
        } else {
            ctx.globalCompositeOperation = "source-over";
        }
        applyColor();
        saveState();
        redrawFromUndoTop();
    };
    img.src = base64;
}
