<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigramme HTML</title>
<link rel="stylesheet" href="outils.css">
<link rel="stylesheet" href="color-palette.css">
<style>
.org-scroll {
  white-space:nowrap;
  overflow:auto;
  max-height:500px;
  max-height:70vh;
}
.org-root{display:inline-block;}
.org-node {
  display:inline-block;
  text-align:center;
  margin:10px 5px;
  vertical-align:top;
}
.org-label {
  border:1px solid #808080;
  padding:4px 8px;
}
.org-children {
  margin-top:10px;
  text-align:center;
}
.org-node.selected .org-label{border:5px solid #0078d7;}
#colorInput{width:60px;}
</style>
</head>
<body>
<h2>Organigramme HTML</h2>
<div class="toolbar">
  <button onclick="addChild()">Ajouter enfant</button>
  <button onclick="addSibling()">Ajouter frère</button>
  <button onclick="moveLeft()">←</button>
  <button onclick="moveRight()">→</button>
  <button onclick="moveUp()">↑</button>
  <button onclick="moveDown()">↓</button>
  <label><input type="checkbox" id="editMode">Édition texte</label>
  <button onclick="deleteNode()" class="btn-color" style="background:#ff4444;">Supprimer</button>
  |
  <input type="file" style="width:115px;" onchange="loadNodeImage(this)">
  <button onclick="removeImageFromNode()" class="btn-color" style="background:#ff4444;">Supprimer image</button>
  |
  <button class="style-btn" onclick="changeGlobalTextColor(this)">Texte global</button>
  <button class="style-btn" onclick="changeSelectedTextColor(this)">Texte sélectionné</button>
  <button class="style-btn" onclick="changeGlobalColor(this)">Fond global</button>
  <button class="style-btn" onclick="changeSelectedBgColor(this)">Fond sélectionné</button>
  <input type="text" id="colorInput" class="ColorPickerZindex" placeholder="#rrggbb"><div class="previewColorPicker"></div>
  <div class="overlayColorPicker">
    <div class="overlayColorPicker-cell">
      <div class="mini-picker" id="miniPicker">
        <div class="sv-box" id="svBox">
          <div class="sv-cursor" id="svCursor"></div>
        </div>
        <div class="hue-slider" id="hueSlider" tabindex="0">
          <div class="hue-cursor" id="hueCursor"></div>
        </div>
        <div class="quick-colors">
          <div class="qc" data-col="#000000" style="background:#000000"></div>
          <div class="qc" data-col="#ffffff" style="background:#ffffff"></div>
          <div class="qc" data-col="#ff0000" style="background:#ff0000"></div>
          <div class="qc" data-col="#ff9900" style="background:#ff9900"></div>
          <div class="qc" data-col="#ffff00" style="background:#ffff00"></div>
          <div class="qc" data-col="#00ff00" style="background:#00ff00"></div>
          <div class="qc" data-col="#00ffff" style="background:#00ffff"></div>
          <div class="qc" data-col="#0000ff" style="background:#0000ff"></div>
          <div class="qc" data-col="#ff00ff" style="background:#ff00ff"></div>
        </div>
        <button id="closePickerBtn" onclick="closePicker()">Fermer</button>
      </div>
    </div>
  </div>
  <button onclick="applyColor()" class="ColorPickerZindex">OK</button>
  <button onclick="clearGlobalStyle()" class="btn-color" style="background:#ff4444;">Effacer style global</button>
  <button onclick="clearSelectedStyle()" class="btn-color" style="background:#ff4444;">Effacer style sélectionné</button>
</div>
<div class="org-scroll">
  <div id="org-container">
      <div class="org-root"></div>
  </div>
</div>
<br><h3>Code de l'organigramme</h3>
<button onclick="generateCode(buildHtml())" class="btn-color" style="background:#ff8800;">Générer le code</button>
<button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier le code</button>
<br><textarea wrap="off" id="output" style="width:100%;height:200px;"></textarea><br>
<button onclick="doImport()" class="btn-color" style="background:#ff8800;">Mettre à jour</button>
<button id="importTextareaFileoutput">Importer fichier...</button>
<input type="file" id="textareaFileoutput" style="display:none;">

<script src="outils.js"></script>
<script src="color-palette.js"></script>
<script>
/* --- VARIABLES GLOBALES --- */
var globalBoxBg = "transparent";
var selectedId = null;
var clickOnToolbar = false;
var nextId = 1;

/* --- DONNÉES --- */
var orgRoot = {
  hidden: true,
  children: [
    {
      label: "CEO",
      children: [
        {
          label: "CTO",
          children: [
            { label: "Dev 1", children: [] },
            { label: "Dev 2", children: [] }
          ]
        },
        {
          label: "CFO",
          children: [
            { label: "Comptable", children: [] }
          ]
        }
      ]
    }
  ]
};

/* --- ASSIGNATION DES IDS --- */
function assignIds(node) {

  if (!node.id) {
    node.id = nextId++;
  }

  if (!node.children) {
    node.children = [];
  }

  for (var i = 0; i < node.children.length; i++) {
    assignIds(node.children[i]);
  }

}
assignIds(orgRoot);

/* --- RENDU HTML --- */
function renderOrgTree(root) {

  var container = document.getElementById("org-container");
  var rootEl = document.querySelector(".org-root");

  var globalText = "inherit";

  if (rootEl) {
    globalText = rootEl.style.color || "inherit";
  }

  var html = '<div class="org-root" style="color:' + globalText + ';">\n';

  // Affiche uniquement les enfants du conteneur invisible
  for (var i = 0; i < root.children.length; i++) {
    html += renderOrgNode(root.children[i], globalText, 2);
  }

  html += '</div>';

  container.innerHTML = html;
}

/* --- SÉLECTION / ÉDITION --- */
document.addEventListener('click', function(e) {
  if (e.target.id === "inlineEdit") return;

  var node = findNodeElement(e.target);
  if (!node) return;

  var id = parseInt(node.getAttribute('data-id'), 10);

  if (editMode.checked) {
    startInlineRename(id, node);
  } else {
    selectedId = id;
    updateSelectionHighlight();
  }
});

/* --- RENDU --- */
function renderOrgNode(node, globalText, indent) {
  var pad = "";
  for (var i = 0; i < indent; i++) pad += " ";

  var bg = (node.bg != null) ? node.bg : globalBoxBg;
  var color = node.textColor || globalText;

  var html = pad + '<div class="org-node" data-id="' + node.id + '">\n';
  html += pad + '  <div class="org-label" style="background:' + bg + '; color:' + color + ';">' +
          nl2br(escapeHtml(node.label));

  if (node.img) {
    html += '<br><img src="' + node.img + '" style="max-width:80px; margin-top:4px;">';
  }

  html += '</div>\n';

  if (node.children.length > 0) {
    html += pad + '  <div class="org-children">\n';
    for (var j = 0; j < node.children.length; j++) {
      html += renderOrgNode(node.children[j], globalText, indent + 4);
    }
    html += pad + '  </div>\n';
  }

  html += pad + '</div>\n';
  return html;
}

window.onload = function() {
  renderOrgTree(orgRoot);
};

/* --- ÉDITION INLINE --- */
function startInlineRename(id, nodeEl) {
  var node = findNodeById(orgRoot, id);
  var labelEl = nodeEl.getElementsByClassName("org-label")[0];

  var old = node.label;

  labelEl.innerHTML =
    '<textarea wrap="off" id="inlineEdit" style="width:90%;height:60px;"></textarea>';

  var ta = document.getElementById("inlineEdit");
  ta.value = old;
  ta.focus();

  ta.addEventListener("keydown", function(ev) {
    if (ev.keyCode === 13 && !ev.shiftKey) return;
  });

  ta.onblur = function() {
      finishInlineRename(id, ta.value);
  };
}

function finishInlineRename(id, newText) {
  var node = findNodeById(orgRoot, id);
  node.label = newText;

  renderOrgTree(orgRoot);
  selectedId = id;
  updateSelectionHighlight();
}

/* --- ACTIONS - AJOUT / SUPPRESSION --- */
function addChild() {
  if (!selectedId) return;
  var node = findNodeById(orgRoot, selectedId);
  var label = prompt("Nom du nouveau nœud :");
  if (!label) return;
  var newNode = { label: label, children: [] };
  assignIds(newNode);
  node.children.push(newNode);
  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

function addSibling() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;
  var label = prompt("Nom du nouveau nœud :");
  if (!label) return;

  var newNode = {
    label: label,
    children: []
  };

  assignIds(newNode);

  // Recherche la position du nœud sélectionné
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      // Insertion juste après le nœud sélectionné
      parent.children.splice(i + 1, 0, newNode);
      break;
    }
  }

  renderOrgTree(orgRoot);
  selectedId = newNode.id;
  updateSelectionHighlight();
}

function moveLeft() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;

  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      if (i === 0) return;
      var tmp = parent.children[i - 1];
      parent.children[i - 1] = parent.children[i];
      parent.children[i] = tmp;
      renderOrgTree(orgRoot);
      updateSelectionHighlight();
      return;
    }
  }

}

function moveRight() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;

  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      if (i >= parent.children.length - 1) return;
      var tmp = parent.children[i + 1];
      parent.children[i + 1] = parent.children[i];
      parent.children[i] = tmp;
      renderOrgTree(orgRoot);
      updateSelectionHighlight();
      return;
    }
  }

}

function moveUp() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;

  // Déjà racine
  if (parent === orgRoot)
    return;

  var grandParent = findParent(orgRoot, parent.id);
  if (!grandParent) return;

  var node = null;
  var index = -1;

  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      node = parent.children[i];
      index = i;
      break;
    }
  }

  if (!node) return;
  parent.children.splice(index, 1);
  for (i = 0; i < grandParent.children.length; i++) {
    if (grandParent.children[i].id === parent.id) {
      grandParent.children.splice(i + 1, 0, node);
      break;
    }
  }

  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

function moveDown() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;

  var node = null;
  var index = -1;

  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      node = parent.children[i];
      index = i;
      break;
    }
  }

  if (!node) return;

  // premier frère → impossible
  if (index === 0)
    return;

  var newParent = parent.children[index - 1];
  parent.children.splice(index, 1);
  newParent.children.push(node);
  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

function deleteNode() {
  if (!selectedId) return;
  var parent = findParent(orgRoot, selectedId);
  if (!parent) return;

  // Empêche la suppression du conteneur invisible
  if (selectedId === orgRoot.id) return;

  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) {
      parent.children.splice(i, 1);
      break;
    }
  }

  selectedId = null;
  renderOrgTree(orgRoot);
}

/* --- ACTIONS - IMAGES --- */
function loadNodeImage(input) {
  if (!selectedId) return;
  var file = input.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(e) {
    var node = findNodeById(orgRoot, selectedId);
    node.img = e.target.result;
    renderOrgTree(orgRoot);
    updateSelectionHighlight();
  };
  reader.readAsDataURL(file);

  input.value = "";
}

function removeImageFromNode() {
  if (!selectedId) return;

  var node = findNodeById(orgRoot, selectedId);
  if (!node.img) return; // aucune image → rien à faire

  delete node.img;       // on supprime l'image
  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

/* --- SÉLECTION --- */
function findNodeElement(el) {
  while (el && el !== document) {
    if (el.className && el.className.indexOf('org-node') !== -1) return el;
    el = el.parentNode;
  }
  return null;
}

function updateSelectionHighlight() {
  var nodes = document.getElementsByClassName('org-node');
  for (var i = 0; i < nodes.length; i++) {
    var id = parseInt(nodes[i].getAttribute('data-id'), 10);
    nodes[i].className = (id === selectedId) ? 'org-node selected' : 'org-node';
  }
}

/* --- RECHERCHE --- */
function findNodeById(node, id) {

  if (!node) return null;

  if (node.id === id) {
    return node;
  }

  for (var i = 0; i < node.children.length; i++) {
    var found = findNodeById(node.children[i], id);
    if (found) {
      return found;
    }
  }

  return null;
}

function findParent(node, id) {

  if (!node) return null;

  for (var i = 0; i < node.children.length; i++) {

    if (node.children[i].id === id) {
      return node;
    }

    var found = findParent(node.children[i], id);

    if (found) {
      return found;
    }
  }

  return null;
}

/* --- UTILITAIRES --- */
function nl2br(str) {
  return str.replace(/\n/g, "<br>");
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(m) {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[m];
  });
}

function generateCode(text) {
  var ta = document.getElementById("output");
  ta.value = text;
}

/* --- Styles --- */
function setActiveButton(btn) {
  // Retirer .active de tous les boutons de style
  var buttons = document.getElementsByClassName("style-btn");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = buttons[i].className.replace(" active", "");
  }

  // Ajouter .active au bouton cliqué
  btn.className += " active";
}

var pendingColorAction = null;

function applyColor() {
  var col = document.getElementById("colorInput").value;
  if (!col || !pendingColorAction) return;

  col = col.toLowerCase()
           .replace(/^([0-9a-f]{6})$/, "#$1")
           .replace(/^([0-9a-f]{3})$/, "#$1");

  if (pendingColorAction === "globalText") {
    var root = document.querySelector(".org-root");
    root.style.color = col;
  }

  if (pendingColorAction === "selectedText" && selectedId) {
    var node = findNodeById(orgRoot, selectedId);
    node.textColor = col;
  }

  if (pendingColorAction === "globalBg") {
    globalBoxBg = col;
  }

  if (pendingColorAction === "selectedBg" && selectedId) {
    var node = findNodeById(orgRoot, selectedId);
    node.bg = col;
  }

  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

attachColorPickerTo(document.getElementById("colorInput"));

/* --- Boutons de sélection d'action --- */
function changeGlobalTextColor(btn) {
  pendingColorAction = "globalText";
  setActiveButton(btn);
}

function changeSelectedTextColor(btn) {
  if (!selectedId) return;
  pendingColorAction = "selectedText";
  setActiveButton(btn);
}

function changeGlobalColor(btn) {
  pendingColorAction = "globalBg";
  setActiveButton(btn);
}

function changeSelectedBgColor(btn) {
  if (!selectedId) return;
  pendingColorAction = "selectedBg";
  setActiveButton(btn);
}

/* --- Reset --- */
function clearGlobalStyle() {
  globalBoxBg = "transparent";
  var root = document.querySelector(".org-root");
  root.style.color = "inherit";
  renderOrgTree(orgRoot);
}

function clearSelectedStyle() {
  if (!selectedId) return;
  var node = findNodeById(orgRoot, selectedId);
  delete node.bg;
  delete node.textColor;
  renderOrgTree(orgRoot);
  updateSelectionHighlight();
}

/* --- Export HTML --- */
function exportHtmlNode(node, indent) {
  var pad = "";
  for (var i = 0; i < indent; i++) pad += " ";

  var style = "";
  if (node.bg != null) style += "background:" + escapeHtml(node.bg) + ";";
  if (node.textColor) style += "color:" + escapeHtml(node.textColor) + ";";
  if (style) style = ' style="' + style + '"';

  var html = pad + '<div class="org-node" data-id="' + node.id + '">\n';
  html += pad + '  <div class="org-label"' + style + '>' +
        nl2br(escapeHtml(node.label));

  if (node.img) {
    html += '<br><img src="' + node.img + '" style="max-width:80px; margin-top:4px;">';
  }

  html += '</div>\n';

  if (node.children.length > 0) {
    html += pad + '  <div class="org-children">\n';
    for (var j = 0; j < node.children.length; j++) {
      html += exportHtmlNode(node.children[j], indent + 4);
    }
    html += pad + '  </div>\n';
  }

  html += pad + '</div>\n';
  return html;
}

function buildHtml() {

  var root = document.querySelector(".org-root");
  var globalText = root.style.color || "inherit";

  var css =
    "<style>\n" +
    ".org-scroll{white-space:nowrap;overflow-x:auto;}\n" +
    ".org-root{display:inline-block;color:" + globalText + ";}\n" +
    ".org-node{display:inline-block;text-align:center;margin:10px 5px;vertical-align:top;}\n" +
    ".org-label{border:1px solid #808080;padding:4px 8px;background:" + globalBoxBg + ";}\n" +
    ".org-children{margin-top:10px;text-align:center;}\n" +
    "</style>\n";

  var html =
    '<div class="org-scroll">\n' +
    '<div class="org-root">\n';

  // Exporte toutes les racines
  for (var i = 0; i < orgRoot.children.length; i++) {
    html += exportHtmlNode(orgRoot.children[i], 2);
  }

  html +=
    '</div>\n' +
    '</div>';

  return css + html;
}

/* --- IMPORT HTML --- */
function importHtml(html) {

  var container = document.createElement("div");
  container.innerHTML = html;

  function parseNode(el) {

    var labelEl = el.getElementsByClassName("org-label")[0];

    var imgEl = labelEl.getElementsByTagName("img")[0];
    var imgSrc = null;

    if (imgEl) {
      imgSrc = imgEl.src;
    }

    var raw = labelEl.innerHTML;

    raw = raw.replace(/<img[^>]*>/gi, "");

    var label = raw.replace(/<br\s*\/?>/gi, "\n");

    label = label.replace(/^\s+|\s+$/g, "");

    var node = {
      label: label,
      children: []
    };

    if (imgSrc) {
      node.img = imgSrc;
    }

    if (labelEl.style.color) {
      node.textColor = labelEl.style.color;
    }

    if (labelEl.style.background) {
      node.bg = labelEl.style.background;
    }

    var childrenContainer = null;

    for (var i = 0; i < el.children.length; i++) {
        if (el.children[i].className === "org-children") {
            childrenContainer = el.children[i];
            break;
        }
    }

    if (childrenContainer) {

      for (var i = 0; i < childrenContainer.children.length; i++) {

        node.children.push(parseNode(childrenContainer.children[i]));

      }

    }

    return node;

  }

  var rootEl = container.getElementsByClassName("org-root")[0];

  if (!rootEl) return null;

  var style = container.getElementsByTagName("style")[0];

  if (style) {

      var css = style.textContent;

      var m = css.match(/\.org-root\s*\{[^}]*color\s*:\s*([^;]+);/i);
      if (m) {
          document.querySelector(".org-root").style.color = m[1].trim();
      }

      m = css.match(/\.org-label\s*\{[^}]*background\s*:\s*([^;]+);/i);
      if (m) {
          globalBoxBg = m[1].trim();
      }

  }

  // Création du conteneur invisible
  var root = {
    hidden: true,
    children: []
  };

  // Lecture de toutes les racines
  for (var i = 0; i < rootEl.children.length; i++) {

    var child = rootEl.children[i];

    if (child.className.indexOf("org-node") !== -1) {

      root.children.push(parseNode(child));

    }

  }

  assignIds(root);

  return root;

}

function importData(text) {
  if (text.indexOf("<div") !== -1) {
    orgRoot = importHtml(text);
  }
  renderOrgTree(orgRoot);
  selectedId = null;
}

function doImport() {
  var txt = document.getElementById("output").value;
  importData(txt);
}
</script>

</body>
</html>
