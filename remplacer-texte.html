<script>
/* --- Compatibilité maximale (ES3) --- */
function applyPrefix(text, prefix) {
    if (!prefix) return text;
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = prefix + lines[i];
        }
    }
    return lines.join("\n");
}
function applySuffix(text, suffix) {
    if (!suffix) return text;
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = lines[i] + suffix;
        }
    }
    return lines.join("\n");
}
function removePrefix(text, prefix) {
    if (!prefix) return text;
    var lines = text.split(/\r?\n/);
    var L = prefix.length;
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].indexOf(prefix) === 0) {
            lines[i] = lines[i].substring(L);
        }
    }
    return lines.join("\n");
}
function removeSuffix(text, suffix) {
    if (!suffix) return text;
    var lines = text.split(/\r?\n/);
    var L = suffix.length;
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].length >= L &&
            lines[i].substring(lines[i].length - L) === suffix) {
            lines[i] = lines[i].substring(0, lines[i].length - L);
        }
    }
    return lines.join("\n");
}
function updateStats(text) {
    var chars = text.length;
    // Compter les mots (séparés par espaces, tab, retours ligne)
    var trimmed = text.replace(/\s+/g, " ").trim();
    var words = trimmed === "" ? 0 : trimmed.split(" ").length;
    // Compter les lignes
    var lines = text === "" ? 0 : text.split(/\r?\n/).length;
    document.getElementById("stats").innerHTML =
        "Caractères : " + chars +
        ", Mots : " + words +
        ", Lignes : " + lines;
}
function appliquerTransformations() {
  var txt = document.getElementById("input").value;
  txt = transformerTexte(txt);
  updateStats(txt);
  document.getElementById("output").value = txt;
}
function exclusiviteCasse(chk) {
  if (chk === "min") {
    document.getElementById("chk_maj").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "maj") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "inv") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_maj").checked = false;
  }
  saveChecks();
}
function decocherTout() {
  document.getElementById("chk_min").checked = false;
  document.getElementById("chk_maj").checked = false;
  document.getElementById("chk_inv").checked = false;
  document.getElementById("chk_acc").checked = false;
  document.getElementById("chk_spc").checked = false;
  document.getElementById("chk_quo").checked = false;
  document.getElementById("chk_squo").checked = false;
  saveChecks();
}
function sansAccents(str) {
  // Table complète pan‑européenne
  var map = {
    // Français
    'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a',
    'ç':'c',
    'è':'e','é':'e','ê':'e','ë':'e',
    'ì':'i','í':'i','î':'i','ï':'i',
    'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o',
    'ù':'u','ú':'u','û':'u','ü':'u',
    'ÿ':'y','ý':'y',
    'À':'A','Á':'A','Â':'A','Ã':'A','Ä':'A','Å':'A',
    'Ç':'C',
    'È':'E','É':'E','Ê':'E','Ë':'E',
    'Ì':'I','Í':'I','Î':'I','Ï':'I',
    'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O',
    'Ù':'U','Ú':'U','Û':'U','Ü':'U',
    'Ý':'Y',
    'œ':'oe','Œ':'OE',
    // Scandinave
    'ø':'o','Ø':'O',
    'æ':'ae','Æ':'AE',
    // Allemand
    'ß':'ss',
    // Turc
    'ğ':'g','Ğ':'G',
    'ş':'s','Ş':'S',
    'ı':'i','İ':'I',
    // Roumain
    'ă':'a','Ă':'A',
    'ș':'s','Ș':'S',
    'ț':'t','Ț':'T',
    // Polonais
    'ą':'a','Ą':'A',
    'ć':'c','Ć':'C',
    'ę':'e','Ę':'E',
    'ł':'l','Ł':'L',
    'ń':'n','Ń':'N',
    'ś':'s','Ś':'S',
    'ź':'z','Ź':'Z',
    'ż':'z','Ż':'Z',
    // Tchèque / Slovaque
    'č':'c','Č':'C',
    'ď':'d','Ď':'D',
    'ě':'e','Ě':'E',
    'ň':'n','Ň':'N',
    'ř':'r','Ř':'R',
    'š':'s','Š':'S',
    'ť':'t','Ť':'T',
    'ž':'z','Ž':'Z',
    // Croate / Slovène / Serbe latin
    'đ':'d','Đ':'D',
    // Hongrois
    'ő':'o','Ő':'O',
    'ű':'u','Ű':'U',
    // Baltes
    'ū':'u','Ū':'U',
    'ī':'i','Ī':'I',
    'ļ':'l','Ļ':'L',
    'ķ':'k','Ķ':'K',
    'ģ':'g','Ģ':'G'
  };
  // 1) Remplacer les lettres précomposées
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var ch = str.charAt(i);
    out += map[ch] || ch;
  }
  // 2) Supprimer les accents combinés (compatibilité totale)
  // couvre : Ő, Š, Ž, Ț, Ğ, etc. même en version combinée
  out = out.replace(/[\u0300-\u036f]/g, "");
  return out;
}
// Boutons Effacer
function effacerTout() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
  updateStats("");
}
function effacerRemplacements() {  
  document.getElementById("repl_container").innerHTML = "";
  localStorage.removeItem("repl_list");
  document.getElementById("repl_ignore_case").checked = false;
  localStorage.removeItem("repl_ignore_case");
  document.getElementById("addPrefix").value = "";
  localStorage.removeItem("add_prefix_value");
  document.getElementById("addSuffix").value = "";
  localStorage.removeItem("add_suffix_value");
  document.getElementById("removePrefix").value = "";
  localStorage.removeItem("remove_prefix_value");
  document.getElementById("removeSuffix").value = "";
  localStorage.removeItem("remove_suffix_value");
}
/* --- Sauvegarde / Restauration --- */
function saveChecks() {
  localStorage.setItem("chk_min", document.getElementById("chk_min").checked ? "1" : "0");
  localStorage.setItem("chk_maj", document.getElementById("chk_maj").checked ? "1" : "0");
  localStorage.setItem("chk_inv", document.getElementById("chk_inv").checked ? "1" : "0");
  localStorage.setItem("chk_acc", document.getElementById("chk_acc").checked ? "1" : "0");
  localStorage.setItem("chk_spc", document.getElementById("chk_spc").checked ? "1" : "0");
  localStorage.setItem("chk_quo", document.getElementById("chk_quo").checked ? "1" : "0");
  localStorage.setItem("chk_squo", document.getElementById("chk_squo").checked ? "1" : "0");
}

  exclusiviteCasse("min");
};
document.getElementById("chk_maj").onchange = function() {

};
document.getElementById("chk_inv").onchange = function() {
  exclusiviteCasse("inv");
};
document.getElementById("addPrefix").oninput = function () {
  localStorage.setItem("add_prefix_value", document.getElementById("addPrefix").value);
};
document.getElementById("addSuffix").oninput = function () {
  localStorage.setItem("add_suffix_value", document.getElementById("addSuffix").value);
};
document.getElementById("removePrefix").oninput = function () {
  localStorage.setItem("remove_prefix_value", document.getElementById("removePrefix").value);
};
document.getElementById("removeSuffix").oninput = function () {
  localStorage.setItem("remove_suffix_value", document.getElementById("removeSuffix").value);
};
document.getElementById("chk_acc").onchange = saveChecks;
document.getElementById("chk_spc").onchange = saveChecks;
document.getElementById("chk_quo").onchange = saveChecks;
document.getElementById("chk_squo").onchange = saveChecks;
document.getElementById("fileSuffix").oninput = function () {
    localStorage.setItem(
        "file_suffix",
        this.value
    );
};
window.onload = function() {
  var cmin = localStorage.getItem("chk_min");
  var cmaj = localStorage.getItem("chk_maj");
  var cinv = localStorage.getItem("chk_inv");
  var cacc = localStorage.getItem("chk_acc");
  var cspc = localStorage.getItem("chk_spc");
  var cquo = localStorage.getItem("chk_quo");
  var csquo = localStorage.getItem("chk_squo");
  if (cmin !== null) document.getElementById("chk_min").checked = (cmin === "1");
  if (cmaj !== null) document.getElementById("chk_maj").checked = (cmaj === "1");
  if (cinv !== null) document.getElementById("chk_inv").checked = (cinv === "1");
  if (cacc !== null) document.getElementById("chk_acc").checked = (cacc === "1");
  if (cspc !== null) document.getElementById("chk_spc").checked = (cspc === "1");
  if (cquo !== null) document.getElementById("chk_quo").checked = (cquo === "1");
  if (csquo !== null) document.getElementById("chk_squo").checked = (csquo === "1");
  var v;
  v = localStorage.getItem("add_prefix_value");
  if (v !== null) document.getElementById("addPrefix").value = v;
  v = localStorage.getItem("add_suffix_value");
  if (v !== null) document.getElementById("addSuffix").value = v;
  v = localStorage.getItem("remove_prefix_value");
  if (v !== null) document.getElementById("removePrefix").value = v;
  v = localStorage.getItem("remove_suffix_value");
  if (v !== null) document.getElementById("removeSuffix").value = v;
  var s = localStorage.getItem("file_suffix");
  if (s !== null)
      document.getElementById("fileSuffix").value = s;
    chargerReplacements();
    document.getElementById("repl_ignore_case").onchange = saveReplacements;
  };
// Exporter options
function exportOptions() {
    var data = {
        checks: {
            min: document.getElementById("chk_min").checked,
            maj: document.getElementById("chk_maj").checked,
            inv: document.getElementById("chk_inv").checked,
            acc: document.getElementById("chk_acc").checked,
            spc: document.getElementById("chk_spc").checked,
            quo: document.getElementById("chk_quo").checked,
            squo: document.getElementById("chk_squo").checked
        },
        prefixSuffix: {
            addPrefix: document.getElementById("addPrefix").value,
            addSuffix: document.getElementById("addSuffix").value,
            removePrefix: document.getElementById("removePrefix").value,
            removeSuffix: document.getElementById("removeSuffix").value
        },
        replacements: getReplacements(),
        ignoreCase: document.getElementById("repl_ignore_case").checked
    };
    var json = JSON.stringify(data, null, 2);
    // envoyer dans le textarea d'import
    var ta = document.getElementById("json");
    ta.value = json;
    // afficher la boîte d'import
    document.getElementById("importBox").style.display = "block";
}
function getReplacements() {
    var cont = document.getElementById("repl_container");
    var list = [];
    var divs = cont.getElementsByTagName("div");
    for (var i = 0; i < divs.length; i++) {
        var ta = divs[i].getElementsByTagName("textarea");
        var from = "";
        var to = "";
        for (var j = 0; j < ta.length; j++) {
            var t = ta[j].getAttribute("data-type");
            if (t === "from") from = ta[j].value;
            if (t === "to") to = ta[j].value;
        }
        list.push({
            from: from,
            to: to
        });
    }
    return list;
}
function showImportBox() {
    document.getElementById("importBox").style.display = "block";
}
function applyImport() {
    var txt = document.getElementById("json").value;
    if (!txt) return;
    try {
        var data = JSON.parse(txt);
        // Cases à cocher
        var c = data.checks;
        if (c) {
            document.getElementById("chk_min").checked = c.min;
            document.getElementById("chk_maj").checked = c.maj;
            document.getElementById("chk_inv").checked = c.inv;
            document.getElementById("chk_acc").checked = c.acc;
            document.getElementById("chk_spc").checked = c.spc;
            document.getElementById("chk_quo").checked = c.quo;
            document.getElementById("chk_squo").checked = c.squo;
        }
        // Préfixes / suffixes
        var p = data.prefixSuffix;
        if (p) {
            document.getElementById("addPrefix").value = p.addPrefix;
            document.getElementById("addSuffix").value = p.addSuffix;
            document.getElementById("removePrefix").value = p.removePrefix;
            document.getElementById("removeSuffix").value = p.removeSuffix;
        }
        // Remplacements
        if (data.replacements) {
            var cont = document.getElementById("repl_container");
            cont.innerHTML = ""; // évite la multiplication
            for (var i = 0; i < data.replacements.length; i++) {
                var r = data.replacements[i];
                ajouterRemplacement(r.from, r.to);
            }
        }
        // Ignorer casse
        if (data.ignoreCase !== undefined) {
            document.getElementById("repl_ignore_case").checked = data.ignoreCase;
        }
        saveChecks();
        localStorage.setItem("add_prefix_value", document.getElementById("addPrefix").value);
        localStorage.setItem("add_suffix_value", document.getElementById("addSuffix").value);
        localStorage.setItem("remove_prefix_value", document.getElementById("removePrefix").value);
        localStorage.setItem("remove_suffix_value", document.getElementById("removeSuffix").value);
        saveReplacements();
        document.getElementById("importBox").style.display = "none";
    } catch(e) {
        alert("JSON invalide.");
    }
}
/* --- Remplacements personnalisés avec déplacement ↑ ↓ --- */
function ajouterRemplacement(from, to) {
  var cont = document.getElementById("repl_container");
  var div = document.createElement("div");
  div.style.marginBottom = "4px";
  // Bouton monter
  var up = document.createElement("button");
  up.textContent = "↑";
  up.style = "width:28px;height:28px;vertical-align:middle;";
  up.onclick = function () {
    var prev = div.previousSibling;
    if (prev) {
      cont.insertBefore(div, prev);
      saveReplacements();
    }
  };
  // Bouton descendre
  var down = document.createElement("button");
  down.textContent = "↓";
  down.style = "width:28px;height:28px;vertical-align:middle;";
  down.onclick = function () {
    var next = div.nextSibling;
    if (next) {
      cont.insertBefore(next, div);
      saveReplacements();
    }
  };
  // Bouton ajouter après
  var add = document.createElement("button");
  add.textContent = "+";
  add.style = "width:28px;height:28px;vertical-align:middle;";
  add.onclick = function () {
    // créer un nouveau remplacement vide
    var newDiv = ajouterRemplacement("", "");
    // déplacer le nouveau bloc juste après celui-ci
    cont.insertBefore(newDiv, div.nextSibling);
    saveReplacements();
  };
  // Bouton supprimer
  var del = document.createElement("button");
  del.textContent = "x";
  del.className = "btn-color";
  del.style = "background:#ff4444;width:28px;height:28px;vertical-align:middle;";
  del.onclick = function () {
    cont.removeChild(div);
    saveReplacements();
  };
  // Champ "chercher"
  var inp1 = document.createElement("textarea");
  inp1.setAttribute("data-type", "from");
  inp1.value = from || "";
  inp1.placeholder = "chercher";
  inp1.rows = 4;
  inp1.wrap = "off";
  inp1.style.height = "100px";
  inp1.oninput = saveReplacements;
  // Champ "remplacer"
  var inp2 = document.createElement("textarea");
  inp2.setAttribute("data-type", "to");
  inp2.value = to || "";
  inp2.placeholder = "remplacer";
  inp2.rows = 4;
  inp2.wrap = "off";
  inp2.style.height = "100px";
  inp2.oninput = saveReplacements;
  // Construction de la ligne
  div.appendChild(document.createTextNode("Chercher :"));
  div.appendChild(document.createElement("br"));
  div.appendChild(inp1);
  div.appendChild(document.createElement("br"));
  div.appendChild(document.createTextNode("Remplacer par :"));
  div.appendChild(document.createElement("br"));
  div.appendChild(inp2);
  div.appendChild(document.createElement("br"));
  div.appendChild(up);
  div.appendChild(down);
  div.appendChild(add);
  div.appendChild(del);
  var hr = document.createElement("hr");
  hr.style.border = "0";
  hr.style.borderTop = "1px solid";
  div.appendChild(hr);
  cont.appendChild(div);
  saveReplacements();
  return div;
}
/* --- Fichiers multiples --- */
var fichiersMultiples = [];
function afficherFichiersMultiples() {
    var zone = document.getElementById("multiFileList");
    if (!zone) return;
    var html = "";
    for (var i = 0; i < fichiersMultiples.length; i++) {
        html +=
        "<div>" +
        (i + 1) +
        " - " +
        fichiersMultiples[i].nom +
        " (" +
        fichiersMultiples[i].contenu.length +
        " caractères) " +
        '<button onclick="telechargerFichier(' + i + ')">' +
        'Télécharger' +
        '</button>' +
        "</div>";
    }
    zone.innerHTML = html;
}
function telechargerFichier(index) {
    traiterTousFichiers();
    var suffixeTelechargement =
        document.getElementById("fileSuffix").value;
    var fichier = fichiersMultiples[index];
    var blob = new Blob(
        [fichier.resultat],
        { type: "text/plain" }
    );
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download =
        fichier.nom.replace(
            /(\.[^.]+)?$/,
            suffixeTelechargement + "$1"
        );
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}
function telechargerToutZip() {
    // Assure que tous les fichiers ont leur "resultat"
    traiterTousFichiers();
    var zip = new JSZip();
    var suffixeTelechargement =
        document.getElementById("fileSuffix").value;
    // Ajouter chaque fichier dans le ZIP
    for (var i = 0; i < fichiersMultiples.length; i++) {
        var fichier = fichiersMultiples[i];
        var nomFinal = fichier.nom.replace(
            /(\.[^.]+)?$/,
            suffixeTelechargement + "$1"
        );
        zip.file(nomFinal, fichier.resultat);
    }
    // Générer le ZIP et le télécharger
    zip.generateAsync({ type: "blob" }).then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "fichiers_traites.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    });
}
function chargerFichiers(files) {
    fichiersMultiples = [];
    var restant = files.length;
    if (restant === 0) return;
    for (var i = 0; i < files.length; i++) {
        (function(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                fichiersMultiples.push({
                    nom: file.name,
                    contenu: e.target.result
                });
                restant--;
                if (restant === 0) {
                    afficherFichiersMultiples();
                }
            };
            reader.readAsText(file);
        })(files[i]);
    }
}
function transformerTexte(txt) {
  if (document.getElementById("chk_min").checked) {
    txt = txt.toLowerCase();
  }
  if (document.getElementById("chk_maj").checked) {
    txt = txt.toUpperCase();
  }
  if (document.getElementById("chk_inv").checked) {
    var out = "";
    for (var i = 0; i < txt.length; i++) {
      var c = txt.charAt(i);
      var lower = c.toLowerCase();
      var upper = c.toUpperCase();
      out += (c === lower) ? upper : lower;
    }
    txt = out;
  }
  if (document.getElementById("chk_acc").checked) {
    txt = sansAccents(txt);
  }
  if (document.getElementById("chk_spc").checked) {
    txt = txt.replace(/\t/g, "_");
    txt = txt.replace(/ +/g, " ");
    txt = txt.replace(/ /g, "_");
  }
  if (document.getElementById("chk_quo").checked) {
    txt = txt.replace(/[«»“”„‟❝❞⹂〝〞〟＂『』「」]/g, '"');
  }
  if (document.getElementById("chk_squo").checked) {
    txt = txt.replace(/[‘’‚‛`]/g, "'");
  }
  txt = appliquerRemplacementsPersonnalises(txt);
  txt = applyPrefix(txt, document.getElementById("addPrefix").value);
  txt = removePrefix(txt, document.getElementById("removePrefix").value);
  txt = applySuffix(txt, document.getElementById("addSuffix").value);
  txt = removeSuffix(txt, document.getElementById("removeSuffix").value);
  return txt;
}
function traiterTousFichiers() {
    if (fichiersMultiples.length === 0) {
        alert("Aucun fichier chargé");
        return;
    }
    for (var i = 0; i < fichiersMultiples.length; i++) {
        fichiersMultiples[i].resultat =
            transformerTexte(
                fichiersMultiples[i].contenu
            );
    }
}
document.getElementById("multiFileInput")
.addEventListener("change", function() {
    chargerFichiers(this.files);
});
var dz = document.getElementById("dropzone");
dz.addEventListener("dragenter", function(e) {

});
dz.addEventListener("dragover", function(e) {

function saveReplacements() {
  var cont = document.getElementById("repl_container");
  var list = [];
  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var inputs = [];
    var ta = div.getElementsByTagName("textarea");
    for(var j=0;j<ta.length;j++){
        inputs.push(ta[j]);
    }
    var from = "";
    var to = "";
    for (var j = 0; j < inputs.length; j++) {
      var t = inputs[j].getAttribute("data-type");
      if (t === "from") from = inputs[j].value;
      if (t === "to")   to   = inputs[j].value;
    }
    list.push({from: from, to: to});
  }
  // Sauvegarde des règles
  localStorage.setItem("repl_list", JSON.stringify(list));
  // Sauvegarde de la case "ignorer la casse"
  var ignore = document.getElementById("repl_ignore_case").checked;
  localStorage.setItem("repl_ignore_case", ignore ? "1" : "0");
}
function chargerReplacements() {
  // 1) Restaurer la case AVANT tout
  var ic = localStorage.getItem("repl_ignore_case");
  if (ic === "1") document.getElementById("repl_ignore_case").checked = true;
  // 2) Charger les règles APRÈS
  var saved = localStorage.getItem("repl_list");
  if (saved) {
    var arr = JSON.parse(saved);
    for (var i = 0; i < arr.length; i++) {
      ajouterRemplacement(arr[i].from, arr[i].to);
    }
  }
}
function appliquerRemplacementsPersonnalises(txt) {
  var cont = document.getElementById("repl_container");
  var ignore = document.getElementById("repl_ignore_case").checked;
  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var inputs = [];
    var ta = div.getElementsByTagName("textarea");
    for(var j=0;j<ta.length;j++){
        inputs.push(ta[j]);
    }
    var from = "";
    var to = "";
    for (var j = 0; j < inputs.length; j++) {
      var t = inputs[j].getAttribute("data-type");
      if (t === "from") from = inputs[j].value;
      if (t === "to")   to   = inputs[j].value;
    }
    if (from === "") continue;
    if (!ignore) {
      // Mode normal
      txt = txt.split(from).join(to);
    } else {
      // Mode insensible à la casse (ES3 compatible)
      var lowerTxt = txt.toLowerCase();
      var lowerFrom = from.toLowerCase();
      var pos = 0;
      var out = "";
      while (true) {
        var idx = lowerTxt.indexOf(lowerFrom, pos);
        if (idx === -1) {
          out += txt.substring(pos);
          break;
        }
        out += txt.substring(pos, idx) + to;
        pos = idx + from.length;
      }
      txt = out;
    }
  }
  return txt;
}
