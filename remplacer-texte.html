<button onclick="effacerTout()">Effacer tout</button>

</div>

Caractères : 0, Mots : 0, Lignes : 0
</div>
</div>
<script src="outils.js"></script>
<script src="libs/jszip.min.js"></script>
<script>
/* COMPATIBILITÉ ES3 */
function applyPrefix(text, prefix) {
    if (!prefix) return text;
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = prefix + lines[i];
        }
    }
    return lines.join("\n");
}
function applySuffix(text, suffix) {
    if (!suffix) return text;
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = lines[i] + suffix;
        }
    }
    return lines.join("\n");
}
function removePrefix(text, prefix) {
    if (!prefix) return text;
    var lines = text.split(/\r?\n/);
    var L = prefix.length;
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].indexOf(prefix) === 0) {
            lines[i] = lines[i].substring(L);
        }
    }
    return lines.join("\n");
}
function removeSuffix(text, suffix) {
    if (!suffix) return text;
    var lines = text.split(/\r?\n/);
    var L = suffix.length;
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].length >= L &&
            lines[i].substring(lines[i].length - L) === suffix) {
            lines[i] = lines[i].substring(0, lines[i].length - L);
        }
    }
    return lines.join("\n");
}
function updateStats(text) {
    var chars = text.length;
    var trimmed = text.replace(/\s+/g, " ").trim();
    var words = trimmed === ""
        ? 0
        : trimmed.split(" ").length;
    var lines = text === ""
        ? 0
        : text.split(/\r?\n/).length;
    document.getElementById("stats").innerHTML =
        "Caractères : " + chars +
        ", Mots : " + words +
        ", Lignes : " + lines;
}
/* TRANSFORMATION */
function appliquerTransformations() {
    var txt = document.getElementById("input").value;
    txt = transformerTexte(txt);
    updateStats(txt);
    document.getElementById("output").value = txt;
}
/* LOCALSTORAGE */
var STORAGE_KEY = "remplacer_texte_storage";
var STORAGE_DEFAULTS = {
    checks: {
        min: false,
        maj: false,
        inv: false,
        acc: false,
        spc: false,
        quo: false,
        squo: false
    },
    prefixSuffix: {
        addPrefix: "",
        addSuffix: "",
        removePrefix: "",
        removeSuffix: ""
    },
    replacements: [],
    ignoreCase: false,
    fileSuffix: ""
};
var loadingState = false;
function loadStorage() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
        return {};
    }
    try {
        var data = JSON.parse(raw);
        if (data && typeof data === "object") {
            return data;
        }
    } catch (e) {
    }
    return {};
}
function saveState() {
    if (loadingState) {
        return;
    }
    var data = {
        checks: {
            min: document.getElementById("chk_min").checked,
            maj: document.getElementById("chk_maj").checked,
            inv: document.getElementById("chk_inv").checked,
            acc: document.getElementById("chk_acc").checked,
            spc: document.getElementById("chk_spc").checked,
            quo: document.getElementById("chk_quo").checked,
            squo: document.getElementById("chk_squo").checked
        },
        prefixSuffix: {
            addPrefix: document.getElementById("addPrefix").value,
            addSuffix: document.getElementById("addSuffix").value,
            removePrefix: document.getElementById("removePrefix").value,
            removeSuffix: document.getElementById("removeSuffix").value
        },
        replacements: getReplacements(),
        ignoreCase: document.getElementById("repl_ignore_case").checked,
        fileSuffix: document.getElementById("fileSuffix").value
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadState() {
    var data = loadStorage();
    loadingState = true;
    var c = data.checks || {};
    document.getElementById("chk_min").checked = c.min !== undefined ? c.min : STORAGE_DEFAULTS.checks.min;
    document.getElementById("chk_maj").checked = c.maj !== undefined ? c.maj : STORAGE_DEFAULTS.checks.maj;
    document.getElementById("chk_inv").checked = c.inv !== undefined ? c.inv : STORAGE_DEFAULTS.checks.inv;
    document.getElementById("chk_acc").checked = c.acc !== undefined ? c.acc : STORAGE_DEFAULTS.checks.acc;
    document.getElementById("chk_spc").checked = c.spc !== undefined ? c.spc : STORAGE_DEFAULTS.checks.spc;
    document.getElementById("chk_quo").checked = c.quo !== undefined ? c.quo : STORAGE_DEFAULTS.checks.quo;
    document.getElementById("chk_squo").checked = c.squo !== undefined ? c.squo : STORAGE_DEFAULTS.checks.squo;
    var p = data.prefixSuffix || {};
    document.getElementById("addPrefix").value = p.addPrefix !== undefined
            ? p.addPrefix
            : STORAGE_DEFAULTS.prefixSuffix.addPrefix;
    document.getElementById("addSuffix").value = p.addSuffix !== undefined
            ? p.addSuffix
            : STORAGE_DEFAULTS.prefixSuffix.addSuffix;
    document.getElementById("removePrefix").value = p.removePrefix !== undefined
            ? p.removePrefix
            : STORAGE_DEFAULTS.prefixSuffix.removePrefix;
    document.getElementById("removeSuffix").value = p.removeSuffix !== undefined
            ? p.removeSuffix
            : STORAGE_DEFAULTS.prefixSuffix.removeSuffix;
    document.getElementById("repl_ignore_case").checked = data.ignoreCase !== undefined
            ? data.ignoreCase
            : STORAGE_DEFAULTS.ignoreCase;
    document.getElementById("fileSuffix").value = data.fileSuffix !== undefined
            ? data.fileSuffix
            : STORAGE_DEFAULTS.fileSuffix;
    var cont = document.getElementById("repl_container");
    cont.innerHTML = "";
    if (data.replacements &&
        data.replacements.length) {
        for (var i = 0; i < data.replacements.length; i++) {
            var r = data.replacements[i];
            ajouterRemplacement(
                r.from || "",
                r.to || ""
            );
        }
    }
    loadingState = false;
}
/* OPTIONS DE CASSE */
function exclusiviteCasse(chk) {
    if (chk === "min") {
        document.getElementById("chk_maj").checked = false;
        document.getElementById("chk_inv").checked = false;
    }
    if (chk === "maj") {
        document.getElementById("chk_min").checked = false;
        document.getElementById("chk_inv").checked = false;
    }
    if (chk === "inv") {
        document.getElementById("chk_min").checked = false;
        document.getElementById("chk_maj").checked = false;
    }
    saveState();
}
function decocherTout() {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_maj").checked = false;
    document.getElementById("chk_inv").checked = false;
    document.getElementById("chk_acc").checked = false;
    document.getElementById("chk_spc").checked = false;
    document.getElementById("chk_quo").checked = false;
    document.getElementById("chk_squo").checked = false;
    saveState();
}
/* ACCENTS */
function sansAccents(str) {
    var map = {
        'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a',
        'ç':'c',
        'è':'e','é':'e','ê':'e','ë':'e',
        'ì':'i','í':'i','î':'i','ï':'i',
        'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o',
        'ù':'u','ú':'u','û':'u','ü':'u',
        'ÿ':'y','ý':'y',
        'À':'A','Á':'A','Â':'A','Ã':'A','Ä':'A','Å':'A',
        'Ç':'C',
        'È':'E','É':'E','Ê':'E','Ë':'E',
        'Ì':'I','Í':'I','Î':'I','Ï':'I',
        'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O',
        'Ù':'U','Ú':'U','Û':'U','Ü':'U',
        'Ý':'Y',
        'œ':'oe','Œ':'OE',
        'ø':'o','Ø':'O',
        'æ':'ae','Æ':'AE',
        'ß':'ss',
        'ğ':'g','Ğ':'G',
        'ş':'s','Ş':'S',
        'ı':'i','İ':'I',
        'ă':'a','Ă':'A',
        'ș':'s','Ș':'S',
        'ț':'t','Ț':'T',
        'ą':'a','Ą':'A',
        'ć':'c','Ć':'C',
        'ę':'e','Ę':'E',
        'ł':'l','Ł':'L',
        'ń':'n','Ń':'N',
        'ś':'s','Ś':'S',
        'ź':'z','Ź':'Z',
        'ż':'z','Ż':'Z',
        'č':'c','Č':'C',
        'ď':'d','Ď':'D',
        'ě':'e','Ě':'E',
        'ň':'n','Ň':'N',
        'ř':'r','Ř':'R',
        'š':'s','Š':'S',
        'ť':'t','Ť':'T',
        'ž':'z','Ž':'Z',
        'đ':'d','Đ':'D',
        'ő':'o','Ő':'O',
        'ű':'u','Ű':'U',
        'ū':'u','Ū':'U',
        'ī':'i','Ī':'I',
        'ļ':'l','Ļ':'L',
        'ķ':'k','Ķ':'K',
        'ģ':'g','Ģ':'G'
    };
    var out = "";
    for (var i = 0; i < str.length; i++) {
        var ch = str.charAt(i);
        out += map[ch] || ch;
    }
    out = out.replace(/[\u0300-\u036f]/g, "");
    return out;
}
/* EFFACEMENT */
function effacerTout() {
    document.getElementById("input").value = "";
    document.getElementById("output").value = "";
    updateStats("");
}
function effacerRemplacements() {
    document.getElementById("repl_container").innerHTML = "";
    document.getElementById("repl_ignore_case").checked = false;
    document.getElementById("addPrefix").value = "";
    document.getElementById("addSuffix").value = "";
    document.getElementById("removePrefix").value = "";
    document.getElementById("removeSuffix").value = "";
    saveState();
}
/* EVENEMENTS OPTIONS */
document.getElementById("chk_min").onchange = function() {
    exclusiviteCasse("min");
};
document.getElementById("chk_maj").onchange = function() {
    exclusiviteCasse("maj");
};
document.getElementById("chk_inv").onchange = function() {
    exclusiviteCasse("inv");
};
document.getElementById("chk_acc").onchange = saveState;
document.getElementById("chk_spc").onchange = saveState;
document.getElementById("chk_quo").onchange = saveState;
document.getElementById("chk_squo").onchange = saveState;
document.getElementById("addPrefix").oninput = saveState;
document.getElementById("addSuffix").oninput = saveState;
document.getElementById("removePrefix").oninput = saveState;
document.getElementById("removeSuffix").oninput = saveState;
document.getElementById("repl_ignore_case").onchange = saveState;
document.getElementById("fileSuffix").oninput = saveState;
/* EXPORT / IMPORT */
function exportOptions() {
    var data = {
        checks: {
            min: document.getElementById("chk_min").checked,
            maj: document.getElementById("chk_maj").checked,
            inv: document.getElementById("chk_inv").checked,
            acc: document.getElementById("chk_acc").checked,
            spc: document.getElementById("chk_spc").checked,
            quo: document.getElementById("chk_quo").checked,
            squo: document.getElementById("chk_squo").checked
        },
        prefixSuffix: {
            addPrefix: document.getElementById("addPrefix").value,
            addSuffix: document.getElementById("addSuffix").value,
            removePrefix: document.getElementById("removePrefix").value,
            removeSuffix: document.getElementById("removeSuffix").value
        },
        replacements: getReplacements(),
        ignoreCase: document.getElementById("repl_ignore_case").checked,
        fileSuffix: document.getElementById("fileSuffix").value
    };
    document.getElementById("json").value = JSON.stringify(data, null, 2);
    document.getElementById("importBox").style.display = "block";
}
function showImportBox() {
    document.getElementById("importBox").style.display = "block";
}
function applyImport() {
    var txt = document.getElementById("json").value;
    if (!txt) return;
    try {
        var data = JSON.parse(txt);
        loadingState = true;
        // Cases
        var c = data.checks;
        if (c) {
            document.getElementById("chk_min").checked = c.min || false;
            document.getElementById("chk_maj").checked = c.maj || false;
            document.getElementById("chk_inv").checked = c.inv || false;
            document.getElementById("chk_acc").checked = c.acc || false;
            document.getElementById("chk_spc").checked = c.spc || false;
            document.getElementById("chk_quo").checked = c.quo || false;
            document.getElementById("chk_squo").checked = c.squo || false;
        }
        // Préfixes / suffixes */
        var p = data.prefixSuffix;
        if (p) {
            document.getElementById("addPrefix").value =
                p.addPrefix || "";
            document.getElementById("addSuffix").value =
                p.addSuffix || "";
            document.getElementById("removePrefix").value =
                p.removePrefix || "";
            document.getElementById("removeSuffix").value =
                p.removeSuffix || "";
        }
        // Remplacements
        var cont =
            document.getElementById("repl_container");
        cont.innerHTML = "";
        if (data.replacements) {
            for (var i = 0;
                 i < data.replacements.length;
                 i++) {
                var r = data.replacements[i];
                ajouterRemplacement(r.from || "", r.to || "");
            }
        }
        // Ignorer casse
        if (data.ignoreCase !== undefined) {
            document.getElementById("repl_ignore_case").checked = data.ignoreCase;
        }
        // Suffixe fichiers
        if (data.fileSuffix !== undefined) {
            document.getElementById("fileSuffix").value = data.fileSuffix;
        }
        loadingState = false;
        saveState();
        document.getElementById("importBox").style.display = "none";
    } catch (e) {
        loadingState = false;
        alert("JSON invalide.");
    }
}
/* REMPLACEMENTS PERSONNALISES */
function getReplacements() {
    var cont = document.getElementById("repl_container");
    var list = [];
    var divs = cont.getElementsByTagName("div");
    for (var i = 0; i < divs.length; i++) {
        var ta = divs[i].getElementsByTagName("textarea");
        var from = "";
        var to = "";
        for (var j = 0; j < ta.length; j++) {
            var t = ta[j].getAttribute("data-type");
            if (t === "from") {
                from = ta[j].value;
            }
            if (t === "to") {
                to = ta[j].value;
            }
        }
        list.push({
            from: from,
            to: to
        });
    }
    return list;
}
function saveReplacements() {
    saveState();
}
function ajouterRemplacement(from, to) {
    var cont = document.getElementById("repl_container");
    var div = document.createElement("div");
    div.style.marginBottom = "4px";
    // Monter
    var up =
        document.createElement("button");
    up.textContent = "↑";
    up.style = "width:28px;height:28px;vertical-align:middle;";
    up.onclick = function () {
        var prev = div.previousSibling;
        if (prev) {
            cont.insertBefore(div, prev);
            saveReplacements();
        }
    };
    // Descendre
    var down = document.createElement("button");
    down.textContent = "↓";
    down.style = "width:28px;height:28px;vertical-align:middle;";
    down.onclick = function () {
        var next = div.nextSibling;
        if (next) {
            cont.insertBefore(next, div);
            saveReplacements();
        }
    };
    // Ajouter après
    var add = document.createElement("button");
    add.textContent = "+";
    add.style = "width:28px;height:28px;vertical-align:middle;";
    add.onclick = function () {
        var newDiv = ajouterRemplacement("", "");
        cont.insertBefore(newDiv, div.nextSibling);
        saveReplacements();
    };
    // Supprimer
    var del = document.createElement("button");
    del.textContent = "x";
    del.style = "width:28px;height:28px;vertical-align:middle;";
    del.onclick = function () {
        cont.removeChild(div);
        saveReplacements();
    };
    // Chercher
    var inp1 = document.createElement("textarea");
    inp1.setAttribute("data-type", "from");
    inp1.value = from || "";
    inp1.placeholder = "chercher";
    inp1.rows = 4;
    inp1.wrap = "off";
    inp1.style.height = "100px";
    inp1.oninput = saveReplacements;
    // Remplacer
    var inp2 = document.createElement("textarea");
    inp2.setAttribute("data-type", "to");
    inp2.value = to || "";
    inp2.placeholder = "remplacer";
    inp2.rows = 4;
    inp2.wrap = "off";
    inp2.style.height = "100px";
    inp2.oninput = saveReplacements;
    // Construction
    div.appendChild(document.createTextNode("Chercher :"));
    div.appendChild(document.createElement("br"));
    div.appendChild(inp1);
    div.appendChild(document.createElement("br"));
    div.appendChild(document.createTextNode("Remplacer par :"));
    div.appendChild(document.createElement("br"));
    div.appendChild(inp2);
    div.appendChild(document.createElement("br"));
    div.appendChild(up);
    div.appendChild(down);
    div.appendChild(add);
    div.appendChild(del);
    var hr = document.createElement("hr");
    hr.style.border = "0";
    hr.style.borderTop = "1px solid";
    div.appendChild(hr);
    cont.appendChild(div);
    saveReplacements();
    return div;
}
/* TRANSFORMATION */
function transformerTexte(txt) {
    if (document.getElementById("chk_min").checked) {
        txt = txt.toLowerCase();
    }
    if (document.getElementById("chk_maj").checked) {
        txt = txt.toUpperCase();
    }
    if (document.getElementById("chk_inv").checked) {
        var out = "";
        for (var i = 0; i < txt.length; i++) {
            var c = txt.charAt(i);
            var lower = c.toLowerCase();
            var upper = c.toUpperCase();
            out +=
                (c === lower)
                ? upper
                : lower;
        }
        txt = out;
    }
    if (document.getElementById("chk_acc").checked) {
        txt = sansAccents(txt);
    }
    if (document.getElementById("chk_spc").checked) {
        txt = txt.replace(/\t/g, "_");
        txt = txt.replace(/ +/g, " ");
        txt = txt.replace(/ /g, "_");
    }
    if (document.getElementById("chk_quo").checked) {
        txt = txt.replace(/[«»“”„‟❝❞⹂〝〞〟＂『』「」]/g, '"');
    }
    if (document.getElementById("chk_squo").checked) {
        txt = txt.replace(/[‘’‚‛`]/g, "'");
    }
    txt = appliquerRemplacementsPersonnalises(txt);
    txt = applyPrefix(txt, document.getElementById("addPrefix").value);
    txt = removePrefix(txt, document.getElementById("removePrefix").value);
    txt = applySuffix(txt, document.getElementById("addSuffix").value);
    txt = removeSuffix(txt, document.getElementById("removeSuffix").value);
    return txt;
}
/* REMPLACEMENTS */
function appliquerRemplacementsPersonnalises(txt) {
    var cont = document.getElementById("repl_container");
    var ignore = document.getElementById("repl_ignore_case").checked;
    for (var i = 0;
         i < cont.children.length;
         i++) {
        var div = cont.children[i];
        var ta = div.getElementsByTagName("textarea");
        var from = "";
        var to = "";
        for (var j = 0;
             j < ta.length;
             j++) {
            var t = ta[j].getAttribute("data-type");
            if (t === "from") {
                from = ta[j].value;
            }
            if (t === "to") {
                to = ta[j].value;
            }
        }
        if (from === "") {
            continue;
        }
        if (!ignore) {
            txt =
                txt.split(from).join(to);
        } else {
            var lowerTxt = txt.toLowerCase();
            var lowerFrom = from.toLowerCase();
            var pos = 0;
            var out = "";
            while (true) {
                var idx = lowerTxt.indexOf(lowerFrom, pos);
                if (idx === -1) {
                    out += txt.substring(pos);
                    break;
                }
                out += txt.substring(pos, idx) + to;
                pos = idx + from.length;
            }
            txt = out;
        }
    }
    return txt;
}
/* FICHIERS MULTIPLES */
var fichiersMultiples = [];
function afficherFichiersMultiples() {
    var zone = document.getElementById("multiFileList");
    if (!zone) return;
    var html = "";
    for (var i = 0;
         i < fichiersMultiples.length;
         i++) {
        html +=
            "<div>" +
            (i + 1) +
            " - " +
            fichiersMultiples[i].nom +
            " (" +
            fichiersMultiples[i].contenu.length +
            " caractères) " +
            '<button onclick="telechargerFichier(' +
            i +
            ')">' +
            "Télécharger" +
            "</button>" +
            "</div>";
    }
    zone.innerHTML = html;
}
function telechargerFichier(index) {
    traiterTousFichiers();
    var suffixeTelechargement = document.getElementById("fileSuffix").value;
    var fichier = fichiersMultiples[index];
    var blob = new Blob([fichier.resultat], {type:"text/plain"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fichier.nom.replace(/(\.[^.]+)?$/, suffixeTelechargement + "$1");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}
function telechargerToutZip() {
    traiterTousFichiers();
    var zip = new JSZip();
    var suffixeTelechargement = document.getElementById("fileSuffix").value;
    for (var i = 0;
         i < fichiersMultiples.length;
         i++) {
        var fichier = fichiersMultiples[i];
        var nomFinal = fichier.nom.replace(/(\.[^.]+)?$/, suffixeTelechargement + "$1");
        zip.file(nomFinal, fichier.resultat);
    }
    zip.generateAsync({
        type:"blob"
    }).then(function(blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "fichiers_traites.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    });
}
function chargerFichiers(files) {
    fichiersMultiples = [];
    var restant = files.length;
    if (restant === 0) return;
    for (var i = 0;
         i < files.length;
         i++) {
        (function(file) {
            var reader = new FileReader();
            reader.onload =
                function(e) {
                    fichiersMultiples.push({
                        nom: file.name,
                        contenu:
                            e.target.result
                    });
                    restant--;
                    if (restant === 0) {
                        afficherFichiersMultiples();
                    }
                };
            reader.readAsText(file);
        })(files[i]);
    }
}
function traiterTousFichiers() {
    if (fichiersMultiples.length === 0) {
        alert("Aucun fichier chargé");
        return;
    }
    for (var i = 0;
         i < fichiersMultiples.length;
         i++) {
        fichiersMultiples[i].resultat = transformerTexte(fichiersMultiples[i].contenu);
    }
}
/* DRAG & DROP */
document.getElementById("multiFileInput").addEventListener("change", function() {
        chargerFichiers(this.files);
    }
);
var dz = document.getElementById("dropzone");
dz.addEventListener(
    "dragenter",
    function(e) {
        e.preventDefault();
        dz.classList.add("hover");
    }
);
dz.addEventListener(
    "dragover",
    function(e) {
        e.preventDefault();
        dz.classList.add("hover");
    }
);
dz.addEventListener(
    "dragleave",
    function() {
        dz.classList.remove("hover");
    }
);
dz.addEventListener(
    "drop",
    function(e) {
        e.preventDefault();
        dz.classList.remove("hover");
        chargerFichiers(e.dataTransfer.files);
    }
);
/* CHARGEMENT INITIAL */
window.onload = function() {
    loadState();
};
