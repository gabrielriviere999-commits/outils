<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camembert SVG</title>
<link rel="stylesheet" href="outils.css">
<link rel="stylesheet" href="color-palette.css">
<style>
table{border-collapse:collapse;}
td,th {
  border-bottom:2px groove #808080;
  padding:4px;
  font-size:13px;
}
input[type=text],input[type=number]{width:100%;}
#preview svg {
  max-width:100%;
  height:auto;
}
.pie-legend {
  list-style:none;
  padding:0;
  margin-top:10px;
  font-size:14px;
}
.pie-legend li {
  margin:3px 0;
  display:block;
}
.pie-legend span {
  width:12px;
  height:12px;
  display:inline-block;
  margin-right:6px;
  border-radius:50%;
}
.container-camembert {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
}
.card-camembert {
  padding:10px;
  display:block;
}
</style>
</head>
<body>
<h2>Diagramme circulaire (camembert) SVG</h2>
<div class="overlayColorPicker">
  <div class="overlayColorPicker-cell">
    <div class="mini-picker" id="miniPicker">
      <div class="sv-box" id="svBox">
        <div class="sv-cursor" id="svCursor"></div>
      </div>
      <div class="hue-slider" id="hueSlider">
        <div class="hue-cursor" id="hueCursor"></div>
      </div>
      <label><input type="checkbox" id="alphaToggle"></input>Alpha</label>
      <div class="alpha-slider" id="alphaSlider">
        <div class="alpha-cursor" id="alphaCursor"></div>
      </div>
      <div class="quick-colors">
        <div class="qc" data-col="#000000" tabindex="0" style="background:#000000"></div>
        <div class="qc" data-col="#ffffff" tabindex="0" style="background:#ffffff"></div>
        <div class="qc" data-col="#ff0000" tabindex="0" style="background:#ff0000"></div>
        <div class="qc" data-col="#ff9900" tabindex="0" style="background:#ff9900"></div>
        <div class="qc" data-col="#ffff00" tabindex="0" style="background:#ffff00"></div>
        <div class="qc" data-col="#00ff00" tabindex="0" style="background:#00ff00"></div>
        <div class="qc" data-col="#00ffff" tabindex="0" style="background:#00ffff"></div>
        <div class="qc" data-col="#0000ff" tabindex="0" style="background:#0000ff"></div>
        <div class="qc" data-col="#ff00ff" tabindex="0" style="background:#ff00ff"></div>
      </div>
      <button id="closePickerBtn" onclick="closePicker()">Fermer</button>
    </div>
  </div>
</div>
<div class="container-camembert">

<div class="card-camembert border-externe">
<h3>Parts</h3>
<div class="scrollZone">
<table id="tbl">
  <thead>
    <tr><th style="width:80px">Libellé</th><th style="width:50px">Val %</th><th style="width:105px";>Couleur</th><th></th></tr>
  </thead>
  <tbody></tbody>
</table>
</div>
<button id="addBtn">Ajouter une part</button>
<button id="validateBtn" class="btn-color" style="background:#ff8800;">Valider</button>
<p></p>
<label>Taille du camembert : <input type="number" id="pieSize" value="200" style="width:60px;"></label>
</div>

<div class="card-camembert border-externe">
  <h3>Aperçu</h3>
  <div id="preview" class="scrollZone"></div>
</div>

<div class="card-camembert border-externe">
  <h3>output SVG</h3>
  <textarea id="output"></textarea><br>
  <button id="importBtn" class="btn-color" style="background:#ff8800;">Mettre à jour</button>
  <button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier</button>
  <button id="importTextareaFileoutput">Importer fichier...</button>
  <input type="file" id="textareaFileoutput" style="display:none;">
</div>

</div>
<script src="outils.js"></script>
<script src="color-palette.js"></script>
<script>
/* --- Données --- */
var slices = [
  { label: "A", value: 40, color: "#e74c3c" },
  { label: "B", value: 30, color: "#3498db" },
  { label: "C", value: 20, color: "#2ecc71" }
];

var tblBody = document.getElementById("tbl").getElementsByTagName("tbody")[0];
var preview = document.getElementById("preview");
var outputArea = document.getElementById("output");
var pieSize = 200;

/* --- Construction du tableau --- */
function normalizeColor(col) {
  var tmp = document.createElement("div");
  tmp.style.color = col;
  if (!tmp.style.color) return null;
  document.body.appendChild(tmp);
  var rgba = window.getComputedStyle ?
             window.getComputedStyle(tmp).color :
             tmp.currentStyle.color;
  document.body.removeChild(tmp);
  // rgb(r,g,b)
  var m = rgba.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
  // rgba(r,g,b,a)
  var ma = rgba.match(/^rgba\((\d+),\s*(\d+),\s*(\d+),\s*([0-9.]+)\)$/);
  var r, g, b, a = 255;
  if (m) {
    r = parseInt(m[1],10);
    g = parseInt(m[2],10);
    b = parseInt(m[3],10);
  }
  else if (ma) {
    r = parseInt(ma[1],10);
    g = parseInt(ma[2],10);
    b = parseInt(ma[3],10);
    a = Math.round(parseFloat(ma[4]) * 255);
  }
  else {
    return null;
  }
  function hex(v){
    var h = v.toString(16);
    return h.length < 2 ? "0"+h : h;
  }
  return "#" + hex(r) + hex(g) + hex(b) + (a < 255 ? hex(a) : "");
}

function svgColor(col) {
  var m = col.match(/^#([0-9a-fA-F]{8})$/);
  if (m) {
    var h = m[1];
    return {
      fill: "#" + h.substr(0,6),
      opacity: (parseInt(h.substr(6,2),16) / 255)
    };
  }
  return {
    fill: col,
    opacity: 1
  };
}

function rebuildTable() {
  tblBody.innerHTML = "";

  // Calcul du total pour afficher les pourcentages
  var total = 0;
  for (var t = 0; t < slices.length; t++) total += slices[t].value;

  for (var i = 0; i < slices.length; i++) {
    var s = slices[i];
    var tr = document.createElement("tr");

    // LABEL
    var td1 = document.createElement("td");
    var inp1 = document.createElement("input");
    inp1.type = "text";
    inp1.value = s.label;
    inp1.oninput = function(index){ return function(){
      slices[index].label = this.value;
    }}(i);
    td1.appendChild(inp1);
    tr.appendChild(td1);

    // POURCENTAGE
    var td2 = document.createElement("td");

    var inp2 = document.createElement("input");
    inp2.type = "number";
    inp2.min = "0";
    inp2.max = "100";
    inp2.step = "0.1";

    var pct = total > 0 ? (s.value / total) * 100 : 0;
    pct = Math.round(pct * 10) / 10;
    inp2.value = pct;

    inp2.oninput = function(index){ return function(){
      var p = parseFloat(this.value);
      if (isNaN(p) || p < 0) p = 0;
      if (p > 100) p = 100;

      slices[index].value = p;
    }}(i);

    td2.appendChild(inp2);
    tr.appendChild(td2);

    // COULEUR (HEX + noms CSS)
    var td3 = document.createElement("td");

    var inp3 = document.createElement("input");
    inp3.type = "text";
    inp3.className = "ColorPickerZindex";
    inp3.style.width = "70px";
    inp3.value = s.color;
    inp3.maxLength = 20;

    var preview = document.createElement("div");
    preview.className = "previewColorPicker";
    preview.style.background = s.color;
    preview.style.width = "20px";
    preview.style.height = "20px";
    preview.style.verticalAlign = "middle";
    preview.style.marginLeft = "4px";
    td3.appendChild(inp3);
    td3.appendChild(preview);

    // Color picker HSV
    attachColorPickerTo(inp3);

    inp3.onchange = function(index){ return function(){
      var v = this.value.trim();

        if (/^[0-9A-Fa-f]{6}$/.test(v)) v = "#" + v;
        else if (/^[0-9A-Fa-f]{8}$/.test(v)) v = "#" + v;
        else if (/^[0-9A-Fa-f]{3}$/.test(v)) v = "#" + v;
        else if (/^[0-9A-Fa-f]{4}$/.test(v)) v = "#" + v;

      var hex = normalizeColor(v);
      if (hex) {
        slices[index].color = hex;
        this.value = hex;
        renderPie();
      }
    }}(i);

    tr.appendChild(td3);

    // BOUTONS ↑ ↓ x
    var td4 = document.createElement("td");

    // ↑
    var upBtn = document.createElement("button");
    upBtn.innerHTML = "↑";
    upBtn.style = "width:28px;height:28px;vertical-align:middle;";
    upBtn.onclick = function(index){ return function(){
      if (index > 0) {
        var tmp = slices[index - 1];
        slices[index - 1] = slices[index];
        slices[index] = tmp;
        renderPie();
        rebuildTable();
      }
    }}(i);
    td4.appendChild(upBtn);

    // ↓
    var downBtn = document.createElement("button");
    downBtn.innerHTML = "↓";
    downBtn.style = "width:28px;height:28px;vertical-align:middle;";
    downBtn.onclick = function(index){ return function(){
      if (index < slices.length - 1) {
        var tmp = slices[index + 1];
        slices[index + 1] = slices[index];
        slices[index] = tmp;
        renderPie();
        rebuildTable();
      }
    }}(i);
    td4.appendChild(downBtn);

    // x
    var delBtn = document.createElement("button");
    delBtn.innerHTML = "x";
    delBtn.className = "btn-color";
    delBtn.style = "background:#ff4444;width:28px;height:28px;vertical-align:middle;";
    delBtn.onclick = function(index){ return function(){
      slices.splice(index,1);
      renderPie();
      rebuildTable();
    }}(i);
    td4.appendChild(delBtn);

    tr.appendChild(td4);

    tblBody.appendChild(tr);
  }
}

document.onmouseup = function () {
    draggingHue = false;
    draggingSV  = false;

    if (activeInput) {
        activeInput.dispatchEvent(new Event("change"));
    }
};

document.ontouchend = function () {
    draggingHue = false;
    draggingSV  = false;

    if (activeInput) {
        activeInput.dispatchEvent(new Event("change"));
    }
};

document.getElementById("addBtn").onclick = function() {
  slices.push({
    label: "Nouvelle",
    value: 10,
    color: "#"+("000000"+Math.floor(Math.random()*16777215).toString(16)).slice(-6)
  });
  renderPie();
  rebuildTable();
};

document.getElementById("validateBtn").onclick = function() {
  renderPie();
  rebuildTable();
};

document.getElementById("pieSize").oninput = function() {
  var v = parseInt(this.value, 10);
  if (isNaN(v) || v < 50) v = 50;
  if (v > 800) v = 800;
  pieSize = v;
};

/* --- Génération du SVG + LÉGENDE --- */
function renderPie() {
  var total = 0;
  for (var i = 0; i < slices.length; i++) total += slices[i].value;

  if (total <= 0) {
    preview.innerHTML = "<em>Aucune donnée</em>";
    outputArea.value = "";
    return;
  }

  // Taille dynamique
  var size = pieSize;
  var cx = size / 2;
  var cy = size / 2;
  var r  = (size / 2) - 10;

  var angle = -Math.PI / 2;

  // SVG début
  var svg = '<svg width="'+size+'" height="'+(size+ (slices.length*20)+20)+'" '+
            'viewBox="0 0 '+size+' '+(size+ (slices.length*20)+20)+'" '+
            'xmlns="http://www.w3.org/2000/svg">';

  // PARTIES DU CAMEMBERT
  if (slices.length === 1) {
    // Cas spécial : cercle complet
    var sc = svgColor(slices[0].color);

    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+sc.fill+'"'+
           (sc.opacity < 1 ? ' fill-opacity="'+sc.opacity+'"' : '')+
           '>';
           '<title>'+escapeHtml(slices[0].label)+' (100%)</title>' +
           '</circle>';
  } else {
    for (var i = 0; i < slices.length; i++) {
      var s = slices[i];
      var a = (s.value / total) * Math.PI * 2;

      var x1 = cx + r * Math.cos(angle);
      var y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(angle + a);
      var y2 = cy + r * Math.sin(angle + a);

      var large = a > Math.PI ? 1 : 0;

      var d = "M "+cx+" "+cy+
              " L "+x1+" "+y1+
              " A "+r+" "+r+" 0 "+large+" 1 "+x2+" "+y2+
              " Z";

      var pct = (s.value / total) * 100;
      pct = Math.round(pct * 10) / 10;

      var sc = svgColor(s.color);
      svg += '<path fill="'+sc.fill+'"'+
             (sc.opacity < 1 ? ' fill-opacity="'+sc.opacity+'"' : '')+
             ' d="'+d+'">' +
             '<title>'+escapeHtml(s.label)+' ('+pct+'%)</title>' +
             '</path>';

      angle += a;
    }
  }

  // LÉGENDE DANS LE SVG
  var legendY = size + 15;

  for (var i = 0; i < slices.length; i++) {
    var s = slices[i];
    var pct = (s.value / total) * 100;
    pct = Math.round(pct * 10) / 10;

    // Point coloré
    var sc = svgColor(s.color);
    svg += '<circle cx="10" cy="'+legendY+'" r="6" fill="'+sc.fill+'"'+
           (sc.opacity < 1 ? ' fill-opacity="'+sc.opacity+'"' : '')+
           '></circle>';

    // Fond derrière le texte
    svg += '<rect x="20" y="'+(legendY-8)+'" width="200" height="18" fill="black"></rect>';

    // Texte
    svg += '<text x="25" y="'+(legendY+4)+'" font-size="12" font-family="sans-serif" fill="#ccc">'+
           escapeHtml(s.label)+' - '+pct+'%'+
           '</text>';

    legendY += 20;
  }

  svg += "</svg>";

  preview.innerHTML = svg;
  outputArea.value = svg;
}

function escapeHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* --- Import depuis le SVG + légende --- */
document.getElementById("importBtn").onclick = function() {
  var txt = outputArea.value;
  if (!txt) return;

  preview.innerHTML = txt;

  var div = document.createElement("div");
  div.innerHTML = txt;

  var svg = div.getElementsByTagName("svg")[0];
  if (svg) {
      var w = parseInt(svg.getAttribute("width"), 10);
      if (!isNaN(w) && w > 0) {
          pieSize = w;
          document.getElementById("pieSize").value = w;
      }
  }

  var paths = div.getElementsByTagName("path");
  var newSlices = [];

  for (var i = 0; i < paths.length; i++) {
    var p = paths[i];
    var color = p.getAttribute("fill");

    var title = p.getElementsByTagName("title")[0];
    var raw = title ? title.textContent : "Part";
    var label = raw;
    var pct = 0;

    // Format attendu : "Label (40%)"
    var pos1 = raw.lastIndexOf("(");
    var pos2 = raw.lastIndexOf("%)");

    if (pos1 !== -1 && pos2 !== -1) {
      label = raw.substring(0, pos1 - 1);
      pct = parseFloat(raw.substring(pos1 + 1, pos2));
    }

    // Valeur brute reconstruite (total = 100)
    var value = pct;

    newSlices.push({
      label: label,
      value: isNaN(value) ? 0 : value,
      color: color || "#cccccc"
    });
  }

  slices = newSlices;
  rebuildTable();
  renderPie();
};

rebuildTable();
renderPie();
</script>
</body>
</html>
