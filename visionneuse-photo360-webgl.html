<script>

/* Références DOM */
var canvas = document.getElementById("scene");
var statut = document.getElementById("statut");
var fovAff = document.getElementById("fov");
var depot = document.getElementById("depot");
var erreur = document.getElementById("erreur");
var btnRot = document.getElementById("btnRotation");
var btnReset = document.getElementById("btnReset");
var fileinput = document.getElementById("fileinput");
var fovSlider = document.getElementById("fovSlider");
var btnGauche = document.getElementById("btnGauche");
var btnHaut = document.getElementById("btnHaut");
var btnBas = document.getElementById("btnBas");
var btnDroit = document.getElementById("btnDroite");
/* État de la caméra */
var yaw = 0;                 // lacet (radians)
var pitch = 0;                 // tangage (radians)
var fov = 75;                // degrés
var FOV_MIN = 5, FOV_MAX = 100;
var autoRotation = false;
var vitesse = { x: 0, y: 0 };  // inertie
// Rendu à la demande : vrai = il faut redessiner une frame
var sale = true;
// État des directions maintenues (flèches du clavier + boutons)
var touches = { gauche: false, droite: false, haut: false, bas: false };
// Bornage du tangage : libre jusqu'à ±89° (1.55 rad), le zénith/nadir reste
// atteignable mais on évite le blocage exact du pôle (dégénéré).
function bornerPitch(p) {
  return Math.max(-1.55, Math.min(1.55, p));
}
/* Initialisation WebGL (rendu par lancer de rayon sur sphère) */
var gl = null;
try {
  gl = canvas.getContext("webgl") ||
       canvas.getContext("experimental-webgl");
} catch (e) {
  gl = null;
}
var prog = null, uni = {}, attribPos = null;
// Grandes images : découpage en tuiles verticales (bandes de longitudes).
// Jusqu'à TUILES_MAX textures, chacune tenant dans la limite du GPU.
var tuiles = [];
var texDummy = null;                    // 1x1 px pour les unités inutilisées
var TUILES_MAX = 4;                     // ajusté selon MAX_TEXTURE_IMAGE_UNITS
var VERT =
  "attribute vec2 aPos;\n" +
  "varying vec2 vNdc;\n" +
  "void main() {\n" +
  "  vNdc = aPos;\n" +
  "  gl_Position = vec4(aPos, 0.0, 1.0);\n" +
  "}\n";
// Pour chaque pixel : on construit le rayon caméra puis on le convertit
// en coordonnées équirectangulaires (longitude / latitude).
// La longitude est découpée en uTuiles bandes : on sélectionne la texture
// correspondante (uTex0..uTex3) et on échantillonne dedans en coordonnées
// locales (le petit recouvrement uPad évite une couture entre tuiles).
var FRAG =
  "precision highp float;\n" +
  "uniform float uYaw;\n" +
  "uniform float uPitch;\n" +
  "uniform float uTanF;\n" +
  "uniform float uAspect;\n" +
  "uniform float uTuiles;\n" +
  "uniform float uPad;\n" +
  "uniform sampler2D uTex0;\n" +
  "uniform sampler2D uTex1;\n" +
  "uniform sampler2D uTex2;\n" +
  "uniform sampler2D uTex3;\n" +
  "varying vec2 vNdc;\n" +
  "const float PI = 3.141592653589793;\n" +
  "void main() {\n" +
  "  float cy = cos(uYaw),  sy = sin(uYaw);\n" +
  "  float cp = cos(uPitch), sp = sin(uPitch);\n" +
  "  vec3 fwd = vec3(sy * cp, sp, -cy * cp);\n" +
  "  vec3 right = vec3(cy, 0.0, sy);\n" +
  "  vec3 up = vec3(-sy * sp, cp, cy * sp);\n" +
  "  vec3 ray = fwd + right * (vNdc.x * uTanF * uAspect) + up * (vNdc.y * uTanF);\n" +
  "  ray = normalize(ray);\n" +
  "  float u = fract(atan(ray.x, -ray.z) / (2.0 * PI) + 0.5);\n" + // bouclage horizontal
  "  float v = 0.5 + asin(clamp(ray.y, -1.0, 1.0)) / PI;\n" +
  "  float f = u * uTuiles;\n" +
  "  float idx = floor(f);\n" +
  "  float lu = uPad + (f - idx) * (1.0 - 2.0 * uPad);\n" + // coordonnée locale dans la tuile
  "  vec2 luv = vec2(lu, v);\n" +
  "  vec4 col;\n" +
  "  if (idx < 0.5)      { col = texture2D(uTex0, luv); }\n" +
  "  else if (idx < 1.5) { col = texture2D(uTex1, luv); }\n" +
  "  else if (idx < 2.5) { col = texture2D(uTex2, luv); }\n" +
  "  else                { col = texture2D(uTex3, luv); }\n" +
  "  gl_FragColor = col;\n" +
  "}\n";
function initGL() {
  if (!gl) { afficherErreur("WebGL n'est pas disponible sur ce navigateur."); return false; }
  function compiler(type, source) {
    var s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      afficherErreur("Erreur de shader : " + gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  var vs = compiler(gl.VERTEX_SHADER, VERT);
  var fs = compiler(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    afficherErreur("Erreur de liaison du programme WebGL.");
    return false;
  }
  gl.useProgram(prog);
  // Un seul grand triangle couvrant tout l'écran
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  attribPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(attribPos);
  gl.vertexAttribPointer(attribPos, 2, gl.FLOAT, false, 0, 0);
  // Nombre de tuiles possibles : limité par les unités de texture du fragment shader
  TUILES_MAX = Math.min(4, gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) || 8);
  // Emplacement des uniforms
  uni.yaw = gl.getUniformLocation(prog, "uYaw");
  uni.pitch = gl.getUniformLocation(prog, "uPitch");
  uni.tanF = gl.getUniformLocation(prog, "uTanF");
  uni.aspect = gl.getUniformLocation(prog, "uAspect");
  uni.tuiles = gl.getUniformLocation(prog, "uTuiles");
  uni.pad = gl.getUniformLocation(prog, "uPad");
  uni.tex0 = gl.getUniformLocation(prog, "uTex0");
  uni.tex1 = gl.getUniformLocation(prog, "uTex1");
  uni.tex2 = gl.getUniformLocation(prog, "uTex2");
  uni.tex3 = gl.getUniformLocation(prog, "uTex3");
  // Chaque sampler pointe vers son unité de texture (0 à 3)
  gl.uniform1i(uni.tex0, 0);
  gl.uniform1i(uni.tex1, 1);
  gl.uniform1i(uni.tex2, 2);
  gl.uniform1i(uni.tex3, 3);
  // Texture 1x1 noire : les unités inutilisées doivent rester liées
  // (les samplers sont actifs même si la branche n'est jamais prise).
  texDummy = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texDummy);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
  return true;
}
/* Texture : démonstration générée au canvas 2D */
function textureDemonstration() {
  var c = document.createElement("canvas");
  c.width = 2048; c.height = 1024;
  var g = c.getContext("2d");
  // Ciel
  var ciel = g.createLinearGradient(0, 0, 0, 512);
  ciel.addColorStop(0.00, "#0b1e4d");
  ciel.addColorStop(0.45, "#3f6fb5");
  ciel.addColorStop(0.90, "#a8cbe8");
  ciel.addColorStop(1.00, "#dfeaf2");
  g.fillStyle = ciel;
  g.fillRect(0, 0, 2048, 512);
  // Soleil
  var soleil = g.createRadialGradient(1550, 170, 10, 1550, 170, 120);
  soleil.addColorStop(0, "rgba(255,244,200,1)");
  soleil.addColorStop(1, "rgba(255,244,200,0)");
  g.fillStyle = soleil;
  g.fillRect(1400, 20, 300, 300);
  // Sol
  var sol = g.createLinearGradient(0, 512, 0, 1024);
  sol.addColorStop(0.00, "#8fae6a");
  sol.addColorStop(0.25, "#5f8b46");
  sol.addColorStop(1.00, "#2e4a26");
  g.fillStyle = sol;
  g.fillRect(0, 512, 2048, 512);
  // Grille : méridiens tous les 15°, parallèles tous les 15°
  g.strokeStyle = "rgba(255,255,255,0.28)";
  g.lineWidth = 2;
  var i, x, y;
  for (i = 0; i <= 24; i++) {
    x = Math.round(i * 2048 / 24);
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke();
  }
  for (i = 1; i < 12; i++) {
    y = Math.round(i * 1024 / 12);
    g.beginPath(); g.moveTo(0, y); g.lineTo(2048, y); g.stroke();
  }
  // Équateur + méridien central plus visibles
  g.strokeStyle = "rgba(255,255,255,0.55)";
  g.beginPath(); g.moveTo(0, 512); g.lineTo(2048, 512); g.stroke();
  g.beginPath(); g.moveTo(1024, 0); g.lineTo(1024, 1024); g.stroke();
  // Points cardinaux (u = 0.5 correspond à la vue initiale "Nord")
  g.textAlign = "center";
  g.textBaseline = "middle";
  var card = [ { l: "N", x: 1024 }, { l: "E", x: 1536 }, { l: "S", x: 2048 }, { l: "S", x: 0 }, { l: "O", x: 512 } ];
  for (i = 0; i < card.length; i++) {
    g.fillStyle = "rgba(255,255,255,0.92)";
    g.font = "bold 90px 'Segoe UI', sans-serif";
    g.fillText(card[i].l, card[i].x, 300);
    g.beginPath(); g.arc(card[i].x, 300, 60, 0, Math.PI * 2);
    g.strokeStyle = "rgba(255,255,255,0.8)"; g.lineWidth = 4; g.stroke();
  }
  // Repère texte pour vérifier le sens de lecture
  g.font = "bold 48px 'Segoe UI', sans-serif";
  g.fillStyle = "rgba(255,255,255,0.85)";
  g.fillText("← Test de texture 360° →", 1024, 860);
  return c;
}
/* ------------------------------------------------------------
   Envoi d'une image au GPU, avec découpage en tuiles si besoin :
   - si la hauteur dépasse la taille max, l'image entière est réduite ;
   - si la largeur dépasse la taille max, l'image est découpée en
     tuiles verticales (bandes de longitudes), chacune tenant dans
     la limite du GPU — jusqu'à TUILES_MAX tuiles (sinon réduction) ;
   - les tuiles se recouvrent de quelques pixels pour éviter une
     couture, et le bouclage horizontal est fait dans le shader.
   ------------------------------------------------------------ */
// Dessine une bande verticale [x, x+largeur[ de la source, avec bouclage
// horizontal si la bande dépasse le bord droit de l'image.
function dessinerBande(g, source, W, H, x, largeur, xDest) {
  x = ((x % W) + W) % W;
  if (x + largeur <= W) {
    g.drawImage(source, x, 0, largeur, H, xDest, 0, largeur, H);
  } else {
    var part1 = W - x;
    g.drawImage(source, x, 0, part1, H, xDest, 0, part1, H);
    g.drawImage(source, 0, 0, largeur - part1, H, xDest + part1, 0, largeur - part1, H);
  }
}
// Crée le canvas d'une tuile : la bande [xDebut, xDebut+largeur[ plus
// "pad" pixels de recouvrement de chaque côté (le filtre LINEAR peut
// ainsi interpoler avec les vrais pixels voisins, sans couture).
function creerTuile(source, W, H, xDebut, largeur, pad) {
  var c = document.createElement("canvas");
  c.width = largeur + 2 * pad;
  c.height = H;
  var g = c.getContext("2d");
  g.drawImage(source, xDebut, 0, largeur, H, pad, 0, largeur, H);
  dessinerBande(g, source, W, H, xDebut - pad, pad, 0);
  dessinerBande(g, source, W, H, xDebut + largeur, pad, pad + largeur);
  return c;
}
function envoyerTexture(source, largeur, hauteur) {
  if (!gl) return null;
  var max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  var redimensionnee = false;
  var i;
  // 1) Hauteur trop grande pour le GPU : on réduit l'image entière
  if (hauteur > max) {
    var sh = max / hauteur;
    var ch = document.createElement("canvas");
    ch.width = Math.max(1, Math.floor(largeur * sh));
    ch.height = max;
    ch.getContext("2d").drawImage(source, 0, 0, ch.width, ch.height);
    source = ch; largeur = ch.width; hauteur = ch.height;
    redimensionnee = true;
  }
  // 2) Largeur : nombre de tuiles nécessaires
  var n = 1;
  if (largeur > max) n = Math.ceil(largeur / max);
  if (n > TUILES_MAX) {
    // Image trop large même pour TUILES_MAX tuiles : réduction finale
    var sw = (TUILES_MAX * max) / largeur;
    var cw = document.createElement("canvas");
    cw.width = TUILES_MAX * max;
    cw.height = Math.max(1, Math.floor(hauteur * sw));
    cw.getContext("2d").drawImage(source, 0, 0, cw.width, cw.height);
    source = cw; largeur = cw.width; hauteur = cw.height;
    n = TUILES_MAX;
    redimensionnee = true;
  }
  // 3) Largeur multiple exacte de n (découpage régulier dans le shader)
  var pad = 4;
  // La tuile contient chunkPx + 2*pad pixels. Il faut donc garder la taille totale <= MAX_TEXTURE_SIZE.
  var maxChunkPx = max - 2 * pad;
  var chunkPx = Math.floor(largeur / n);
  // Sécurité supplémentaire : aucune tuile ne doit dépasser la limite GPU.
  chunkPx = Math.min(chunkPx, maxChunkPx);
  // On ajuste la largeur totale pour avoir exactement n tuiles.
  var largeurTuiles = chunkPx * n;
  if (largeurTuiles !== largeur) {
      var creg = document.createElement("canvas");
      creg.width = largeurTuiles;
      creg.height = hauteur;
      creg.getContext("2d").drawImage(
          source,
          0, 0, largeurTuiles, hauteur
      );
      source = creg;
      largeur = creg.width;
  }
  var padFrac = pad / (chunkPx + 2 * pad);
  // 4) Libération des anciennes tuiles puis création des nouvelles
  for (i = 0; i < tuiles.length; i++) gl.deleteTexture(tuiles[i]);
  tuiles = [];
  for (i = 0; i < n; i++) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE,
      creerTuile(source, largeur, hauteur, i * chunkPx, chunkPx, pad));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    tuiles.push(t);
  }
  // 5) Les unités de texture inutilisées restent liées au dummy 1x1
  for (i = n; i < 4; i++) {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, texDummy);
  }
  gl.uniform1f(uni.tuiles, n);
  gl.uniform1f(uni.pad, padFrac);
  sale = true; // nouvelle image : redessiner
  return { w: largeur, h: hauteur, tuiles: n, redimensionnee: redimensionnee };
}
/* Envoie une source (Image ou canvas) au GPU et met à jour le statut */
function chargerTexture(source, nom) {
  var w = source.naturalWidth || source.width;
  var h = source.naturalHeight || source.height;
  var info = envoyerTexture(source, w, h);
  if (!info) return;
  statut.textContent = nom + " - " + info.w + "x" + info.h +
    (info.tuiles > 1 ? " (" + info.tuiles + " tuiles)" : "") +
    (info.redimensionnee ? " (adaptée à la taille max)" : "");
}
/* Chargement d'une photo utilisateur */
/* GPS EXIF : extraction des coordonnées d'un JPEG. (JPEG -> segment APP1 "Exif" -> IFD0 -> IFD GPS -> lat/lon rationnels) */
var gps360 = null; // { lat: degrés décimaux, lon: ... } ou null
function lire16(b, o, petit) {
  if (petit) return b[o] | (b[o + 1] << 8);
  return (b[o] << 8) | b[o + 1];
}
function lire32(b, o, petit) {
  if (petit) return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16)) + b[o + 3] * 16777216;
  return ((b[o] * 16777216) + (b[o + 1] << 16) + (b[o + 2] << 8)) + b[o + 3];
}
function lireRationnel(b, base, o, petit) {
  var num = lire32(b, base + o, petit);
  var den = lire32(b, base + o + 4, petit);
  if (!den) return 0;
  return num / den;
}
/* Retourne {lat, lon} en degrés décimaux, ou null si pas de GPS. */
function extraireGpsExif(octets) {
  var n = octets.length;
  if (n < 12 || octets[0] !== 0xFF || octets[1] !== 0xD8) return null;
  // Parcours des segments JPEG jusqu'à APP1/Exif.
  var pos = 2;
  var tiff = -1;
  while (pos + 4 < n) {
    if (octets[pos] !== 0xFF) return null;
    var marqueur = octets[pos + 1];
    if (marqueur === 0xD8 || marqueur === 0x01 || (marqueur >= 0xD0 && marqueur <= 0xD7)) {
      pos += 2;
      continue;
    }
    var longueur = lire16(octets, pos + 2, false);
    if (marqueur === 0xE1 &&
        octets[pos + 4] === 0x45 && octets[pos + 5] === 0x78 &&
        octets[pos + 6] === 0x69 && octets[pos + 7] === 0x66 &&
        octets[pos + 8] === 0x00) {
      tiff = pos + 10; // début de l'en-tête TIFF
      break;
    }
    pos += 2 + longueur;
  }
  if (tiff < 0 || tiff + 8 > n) return null;
  // En-tête TIFF : boutisme + magic + offset IFD0.
  var petit = octets[tiff] === 0x49 && octets[tiff + 1] === 0x49;
  if (lire16(octets, tiff + 2, petit) !== 0x2A) return null;
  var ifd0 = tiff + lire32(octets, tiff + 4, petit);
  // IFD0 : chercher le pointeur vers l'IFD GPS (tag 0x8825).
  var nb0 = lire16(octets, ifd0, petit);
  var gpsOffset = 0;
  var i;
  for (i = 0; i < nb0 && ifd0 + 2 + i * 12 + 12 <= n; i++) {
    var entree = ifd0 + 2 + i * 12;
    if (lire16(octets, entree, petit) === 0x8825) {
      gpsOffset = tiff + lire32(octets, entree + 8, petit);
      break;
    }
  }
  if (!gpsOffset) return null;
  // IFD GPS : tag 1 = LatRef, 2 = Latitude, 3 = LonRef, 4 = Longitude.
  var nbG = lire16(octets, gpsOffset, petit);
  var latRef = "N", lonRef = "E";
  var lat = null, lon = null;
  for (i = 0; i < nbG && gpsOffset + 2 + i * 12 + 12 <= n; i++) {
    var e = gpsOffset + 2 + i * 12;
    var tag = lire16(octets, e, petit);
    // LatRef / LonRef : ASCII de 1 octet, valeur INLINE dans l'entrée (elle tient dans les 4 octets du champ valeur, ce n'est pas un offset).
    if (tag === 1) latRef = String.fromCharCode(octets[e + 8]);
    else if (tag === 3) lonRef = String.fromCharCode(octets[e + 8]);
    else if (tag === 2) {
      var oLat = lire32(octets, e + 8, petit);
      lat = lireRationnel(octets, tiff, oLat, petit) +
        lireRationnel(octets, tiff, oLat + 8, petit) / 60 +
        lireRationnel(octets, tiff, oLat + 16, petit) / 3600;
    } else if (tag === 4) {
      var oLon = lire32(octets, e + 8, petit);
      lon = lireRationnel(octets, tiff, oLon, petit) +
        lireRationnel(octets, tiff, oLon + 8, petit) / 60 +
        lireRationnel(octets, tiff, oLon + 16, petit) / 3600;
    }
  }
  if (lat === null || lon === null) return null;
  if (latRef === "S") lat = -lat;
  if (lonRef === "W") lon = -lon;
  return { lat: lat, lon: lon };
}
/* Affichage dans le menu + lien Google Maps. */
function afficherGps() {
  var gps = document.getElementById("gps");
  if (!gps360) {
    gps.innerHTML = "Aucune donnée GPS.";
    return;
  }
  var txt = gps360.lat.toFixed(6) + ", " + gps360.lon.toFixed(6);
  var url = "https://www.openstreetmap.org/?mlat=" + gps360.lat + "&mlon=" + gps360.lon + "#map=18/" + gps360.lat + "/" + gps360.lon;
  gps.innerHTML = "";
  var a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.appendChild(document.createTextNode("📍 " + txt + " (OpenStreetMap)"));
  gps.appendChild(a);
}
/* Lien de téléchargement de l'image chargée. */
function majLienTelechargement() {
  var cont = document.getElementById("telechargement");
  cont.innerHTML = "";
  if (!imageSourceOriginale || !imageSourceOriginale.src) {
    return;
  }
  var src = imageSourceOriginale.src;
  // Nom de fichier : depuis le nom affiché, ou déduit de l'URL, ou générique.
  var nom = "photo360";
  if (src.indexOf("data:") !== 0) {
    var m = src.match(/([^\/?#]+)\.[a-z0-9]+(\?|#|$)/i);
    if (m) nom = m[1];
  }
  var a = document.createElement("a");
  a.href = src;
  a.download = nom;
  a.appendChild(document.createTextNode("Télécharger l'image"));
  cont.appendChild(a);
}
/* Analyse les octets d'un JPEG et met à jour l'affichage GPS. */
function analyserGpsOctets(octets) {
  gps360 = null;
  try {
    gps360 = extraireGpsExif(new Uint8Array(octets));
  } catch (e) {
    gps360 = null;
  }
  afficherGps();
}
/* Lecture GPS depuis un File (input / drag-drop). */
function chargerGpsFichier(f) {
  gps360 = null;
  afficherGps();
  if (!f) return;
  // Vieux moteurs : FileReader ou readAsArrayBuffer peuvent manquer. Le GPS est optionnel : on abandonne silencieusement.
  try {
    if (typeof FileReader !== "function" || !FileReader.prototype.readAsArrayBuffer) {
      return;
    }
    var lecteur = new FileReader();
    lecteur.onload = function(e) { analyserGpsOctets(e.target.result); };
    lecteur.onerror = function() {};
    lecteur.readAsArrayBuffer(f);
  } catch (e) {}
}
/* Lecture GPS depuis une URL (same-origin ; XHR, pas d'API moderne). */
function chargerGpsUrl(src) {
  gps360 = null;
  afficherGps();
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", src, true);
    xhr.responseType = "arraybuffer";
    xhr.onload = function() {
      if (xhr.status === 200 || xhr.status === 0) {
        analyserGpsOctets(xhr.response);
      }
    };
    xhr.onerror = function() {};
    xhr.send(null);
  } catch (e) {}
}
var imageSourceOriginale = null;
function chargerFichier(f) {
  try {
    chargerGpsFichier(f);
  } catch (e) {}
  var lecteur = new FileReader();
  lecteur.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      imageSourceOriginale = img;
      chargerTexture(img, f.name);
      majLienTelechargement();
      masquerErreur();
    };
    img.onerror = function () {
      afficherErreur("Impossible de décoder cette image dans ce contexte.");
    };
    img.src = e.target.result;
  };
  lecteur.onerror = function () { afficherErreur("Lecture du fichier impossible."); };
  lecteur.readAsDataURL(f);
}
/* CHARGEMENT D'UNE PHOTO PAR CHEMIN (fichier servi par le site) */
function chargerPhoto(src) {
  statut.textContent = "Chargement de " + src + "...";
  chargerGpsUrl(src);
  var img = new Image();
  img.onload = function() {
    if (!gl || !prog) {
      afficherErreur("WebGL indisponible : photo non affichée.");
      statut.textContent = "Texture de démonstration";
      return;
    }
    imageSourceOriginale = img;
    chargerTexture(img, src); /* envoie au GPU (tuiles, réduction) + statut */
    masquerErreur();
    yaw = 0;
    pitch = 0;
    vitesse.x = 0;
    vitesse.y = 0;
    majLienTelechargement();
    sale = true;
  };
  img.onerror = function() {
    afficherErreur("Impossible de charger : " + src);
    statut.textContent = "Texture de démonstration";
  };
  img.src = src;
}
/* Interactions : souris, molette, tactile, clavier */
var saisie = false;
var dernier = { x: 0, y: 0 };
var pincement = null; // distance entre 2 doigts
function commencer(x, y) {
  saisie = true;
  dernier.x = x; dernier.y = y;
  vitesse.x = 0; vitesse.y = 0;
  canvas.className = "saisie";
}
function deplacer(x, y) {
  var dx = x - dernier.x, dy = y - dernier.y;
  dernier.x = x; dernier.y = y;
  // Sensibilité "naturelle" : un mouvement d'une largeur d'écran ≈ un demi-tour visuel.
  // On relie l'angle à la largeur de la fenêtre, pas à un chiffre fixe.
  var k = (fov * Math.PI / 180) / Math.max(1, canvas.clientWidth);
  yaw   -= dx * k;
  pitch = bornerPitch(pitch + dy * k);
  vitesse.x = -dx * k; vitesse.y = dy * k;
  sale = true; // la vue a bougé : redessiner
}
function terminer() {
  saisie = false;
  canvas.className = "";
}
canvas.addEventListener("mousedown", function (e) {
  if (e.preventDefault) e.preventDefault();
  commencer(e.clientX, e.clientY);
}, false);
window.addEventListener("mousemove", function (e) {
  if (saisie) deplacer(e.clientX, e.clientY);
}, false);
window.addEventListener("mouseup", terminer, false);
// Tactile : 1 doigt = rotation, 2 doigts = pincement (zoom)
canvas.addEventListener("touchstart", function (e) {
  if (e.touches.length === 1) {
    commencer(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2) {
    pincement = distanceTouches(e.touches);
  }
  if (e.preventDefault) e.preventDefault();
}, false);
canvas.addEventListener("touchmove", function (e) {
  if (e.touches.length === 1 && saisie) {
    deplacer(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2 && pincement !== null) {
    var d = distanceTouches(e.touches);
    fov = fov * (pincement / d);
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
    pincement = d;
    sale = true;
  }
  if (e.preventDefault) e.preventDefault();
}, false);
canvas.addEventListener("touchend", function (e) {
  if (e.touches.length === 0) { terminer(); pincement = null; }
  else if (e.touches.length === 1) {
    saisie = false;
    commencer(e.touches[0].clientX, e.touches[0].clientY);
  }
  if (e.preventDefault) e.preventDefault();
}, false);
function distanceTouches(t) {
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
// Molette : zoom
function molette(e) {
  var d = (e.deltaY || e.wheelDelta || 0);
  if (d > 0) fov += 5; else if (d < 0) fov -= 5;
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  sale = true;
  if (e.preventDefault) e.preventDefault();
}
canvas.addEventListener("wheel", molette, { passive: false });
/* Clavier : on mémorise les flèches maintenues (permet les diagonales, car la lecture se fait à chaque image dans la boucle de rendu) */
window.addEventListener("keydown", function (e) {
// Ctrl + / Ctrl - : zoom
if (e.ctrlKey) {
  if (e.key === "+" || e.key === "=") {
    fov -= 5; // zoom avant
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
    sale = true;
    if (e.preventDefault) e.preventDefault();
    return;
  }
  if (e.key === "-" || e.key === "_") {
    fov += 5; // dézoom
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
    sale = true;
    if (e.preventDefault) e.preventDefault();
    return;
  }
}
// Flèches
  if (e.keyCode === 37) touches.gauche = true;
  else if (e.keyCode === 39) touches.droite = true;
  else if (e.keyCode === 38) touches.haut = true;
  else if (e.keyCode === 40) touches.bas = true;
  else return;
  if (e.preventDefault) e.preventDefault(); // évite le défilement de la page
}, false);
window.addEventListener("keyup", function (e) {
  if (e.keyCode === 37) touches.gauche = false;
  else if (e.keyCode === 39) touches.droite = false;
  else if (e.keyCode === 38) touches.haut = false;
  else if (e.keyCode === 40) touches.bas = false;
}, false);
// Slider FOV
fovSlider.addEventListener("input", function () {
  fov = parseInt(fovSlider.value, 10) || 75;
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  sale = true;
}, false);
/* Boutons directionnels : maintenir enfoncé pour tourner en continu. Ils partagent le même état que les flèches du clavier. */
function boutonMaintenir(btn, cle) {
  function activer() { touches[cle] = true; }
  function relacher() { touches[cle] = false; }
  btn.addEventListener("mousedown", activer, false);
  btn.addEventListener("touchstart", function (e) {
    if (e.preventDefault) e.preventDefault();
    activer();
  }, false);
  btn.addEventListener("mouseleave", relacher, false);
  window.addEventListener("mouseup", relacher, false);
  window.addEventListener("touchend", relacher, false);
  window.addEventListener("touchcancel", relacher, false);
}
boutonMaintenir(btnGauche, "gauche");
boutonMaintenir(btnHaut, "haut");
boutonMaintenir(btnBas, "bas");
boutonMaintenir(btnDroit, "droite");
// Sélection via le bouton
fileinput.addEventListener("change", function () {
  if (fileinput.files && fileinput.files[0]) chargerFichier(fileinput.files[0]);
  fileinput.value = "";
}, false);
// Glisser-déposer d'une image sur la page
window.addEventListener("dragover", function (e) {
  if (e.preventDefault) e.preventDefault();
  depot.className = "actif";
}, false);
window.addEventListener("dragleave", function () { depot.className = ""; }, false);
window.addEventListener("drop", function (e) {
  if (e.preventDefault) e.preventDefault();
  depot.className = "";
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    chargerFichier(e.dataTransfer.files[0]);
  }
}, false);
// Boutons
function toggleAutoRotation() {
  autoRotation = !autoRotation;
  btnRot.className = autoRotation ? "active" : "";
  sale = true;
};
function resetPhoto360() {
  yaw = 0;
  pitch = 0;
  fov = 75;
  vitesse.x = 0;
  vitesse.y = 0;
  sale = true;
};
function afficherErreur(msg) {
  erreur.textContent = msg;
  erreur.style.display = "block";
  if (typeof erreur._timer !== "undefined") clearTimeout(erreur._timer);
  erreur._timer = setTimeout(function () { masquerErreur(); }, 5000);
}
function masquerErreur() { erreur.style.display = "none"; }
/* Boucle de rendu */
// Renvoie true si la taille du canvas a changé (il faut alors redessiner)
function redimensionner() {
  var dpr = window.devicePixelRatio || 1;
  if (dpr > 2) dpr = 2;
  var w = Math.round(canvas.clientWidth * dpr);
  var h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    return true;
  }
  return false;
}
/* Chargement automatique : ?file=... dans l'URL est prioritaire sur PHOTO_DEMARRAGE. */
try {
  var m = window.location.search.match(/[?&]file=([^&]+)/);
  if (m) {
    chargerPhoto(decodeURIComponent(m[1]));
  }
} catch (e) {}
var dernierTemps = 0;
var requestFrame =
  window.requestAnimationFrame ||
  window.webkitRequestAnimationFrame ||
  window.mozRequestAnimationFrame ||
  window.msRequestAnimationFrame ||
  function (callback) {
    return window.setTimeout(function () {
      callback(new Date().getTime());
    }, 16);
  };
function boucle(ts) {
  var dt = dernierTemps ? (ts - dernierTemps) / 1000 : 0;
  if (dt > 0.1) dt = 0.1;
  dernierTemps = ts;
  // Inertie après relâchement
  if (!saisie) {
    yaw += vitesse.x;
    pitch = bornerPitch(pitch + vitesse.y);
    vitesse.x *= 0.92; vitesse.y *= 0.92;
    if (Math.abs(vitesse.x) < 0.00005) vitesse.x = 0;
    if (Math.abs(vitesse.y) < 0.00005) vitesse.y = 0;
    if (vitesse.x !== 0 || vitesse.y !== 0) sale = true;
  }
  // Rotation automatique
  if (autoRotation && !saisie) {
    yaw += 0.15 * dt;
    sale = true;
  }
  // Déplacement continu : flèches et boutons maintenus.
  // Les diagonales sont normalisées pour garder la même vitesse en biais.
  var mx = (touches.droite ? 1 : 0) - (touches.gauche ? 1 : 0);
  var my = (touches.haut   ? 1 : 0) - (touches.bas    ? 1 : 0);
  if (mx !== 0 || my !== 0) {
    var pas = 1.3 * (fov / 75); // radians par seconde
    var n = Math.sqrt(mx * mx + my * my);
    yaw += (mx / n) * pas * dt;
    pitch = bornerPitch(pitch + (my / n) * pas * dt);
    sale = true;
  }
  // Sécurité : maintient le tangage dans les bornes (±89°)
  pitch = bornerPitch(pitch);
  // Rendu à la demande : on ne redessine que si quelque chose a changé
  if (gl && prog) {
    if (redimensionner()) sale = true; // redimensionner efface le canvas
    if (sale) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform1f(uni.yaw, yaw);
      gl.uniform1f(uni.pitch, pitch);
      gl.uniform1f(uni.tanF, Math.tan(fov * Math.PI / 360));
      gl.uniform1f(uni.aspect, canvas.width / Math.max(1, canvas.height));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      sale = false;
    }
  }
  // Affichage FOV (uniquement si la valeur affichée change)
  var fovTxt = "FOV " + Math.round(fov) + "°";
  if (fovAff.textContent !== fovTxt) fovAff.textContent = fovTxt;
  // Synchronise le slider quand le FOV change (molette, pincement)
  if (parseInt(fovSlider.value, 10) !== Math.round(fov)) {
    fovSlider.value = Math.round(fov);
  }
  requestFrame(boucle);
}
/* Démarrage */
if (initGL()) {
  var demo = textureDemonstration();
  chargerTexture(demo, "Texture de démonstration");
  requestFrame(boucle);
}
</script>
