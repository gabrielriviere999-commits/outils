<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../outils/favicon.png" type="image/png">
<link rel="stylesheet" href="../outils/outils.css">
<title>OCR</title>
<style>
*{box-sizing:border-box;}
#imageContainer {
  position:relative;
  width:100%;
  height:500px;
  height:70vh;
  overflow:auto;
}
#imageCanvas {
  display:block;
  margin:0;
  background:#222;
  touch-action:none;
  cursor:crosshair;
}
#selectionCanvas {
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
}
#status {
  min-height:24px;
  padding:4px;
  margin-top:4px;
  border:1px inset #c0c0c0;
  background:#000;
  color:#00ff00;
  font-family:monospace;
}
#progress {
  width:100%;
  height:20px;
}
</style>
</head>
<body>
<h2>Extracteur texte OCR</h2>
<div class="section">
  <h3>Image</h3>
    <div style="display:table;table-layout:fixed;width:100%;">
      <div style="display:table-row;">
        <div style="display:table-cell;">
          <input type="file" id="imageFile" style="width:100%;box-sizing:border-box;">
        </div>
        <div style="display:table-cell;">
          <input id="pasteimageFile" placeholder="Ou cliquer et Ctrl+V" maxlength="0" style="width:100%;box-sizing:border-box;">
        </div>
      </div>
    </div>
  <button id="resetButton">Reset</button>
  <label>Zoom :</label>
  <button data-action="zoomMinus" class="rangebtn multitouchbtn">−</button>
  <input type="range" id="zoom" min="25" max="500" value="100">
  <button data-action="zoomPlus" class="rangebtn multitouchbtn">+</button>
  <span id="zoomLabel">100%</span>
  <button class="scroll-btn" data-dir="left" data-target="imageContainer">←</button>
  <button class="scroll-btn" data-dir="right" data-target="imageContainer">→</button>
  <button class="scroll-btn" data-dir="up" data-target="imageContainer">↑</button>
  <button class="scroll-btn" data-dir="down" data-target="imageContainer">↓</button>
    <label>Langue :</label>
    <select id="language">
      <option value="fra">Français</option>
      <option value="eng">Anglais</option>
      <!--option value="spa">Espagnol</option>
      <option value="deu">Allemand</option>
      <option value="ita">Italien</option>
      <option value="por">Portugais</option-->
    </select>
    <button id="ocrButton">Tout le texte</button>
    <button id="copyoutput">Copier</button>
    <progress id="progress" value="0" max="100"></progress>
    <div id="status">Tesseract.js non initialisé.</div>
  <div id="imageContainer">
    <canvas id="imageCanvas"></canvas>
    <canvas id="selectionCanvas"></canvas>
  </div>
</div>
<div class="section">
  <h3>Texte reconnu</h3>
  <textarea id="output" wrap="off"></textarea>
</div>
<div id="popupResultContent" style="display:none">
  <b class="titleb">Texte reconnu</b><hr class="titlehr">
  <textarea id="popupResultText" wrap="off"></textarea>
  <div style="margin-top:5px;">
    <button data-action="copyPopupResultText">Copier</button><hr>
    <button data-action="closePopup">Fermer</button>
  </div>
</div>
<script src="../outils/outils.js"></script>
<script src="../outils/popup.js"></script>
<script src="../outils/multitouch.js"></script>
<script src="libs/tesseract/tesseract.min.js"></script>
<script>
addMultiTouch("#popupResultContent button");
function copyPopupResultText(){var btn=document.activeElement;copyTextarea("popupResultText", btn);setTimeout(function(){btn.focus();},0);}
(function () {
    "use strict";
    var imageFile = document.getElementById("imageFile");
    var ocrButton = document.getElementById("ocrButton");
    var resetButton = document.getElementById("resetButton");
    var language = document.getElementById("language");
    var progress = document.getElementById("progress");
    var status = document.getElementById("status");
    var result = document.getElementById("output");
    var zoom = document.getElementById("zoom");
    var zoomLabel = document.getElementById("zoomLabel");
    var imageContainer = document.getElementById("imageContainer");
    var canvas = document.getElementById("imageCanvas");
    var selectionCanvas = document.getElementById("selectionCanvas");
    var ctx = canvas.getContext("2d");
    var selectionCtx = selectionCanvas.getContext("2d");
    var image = new Image();
    var imageLoaded = false;
    var worker = null;
    var workerLanguage = null;
    var scale = 1;
    var displayScale = 1;
    var selecting = false;
    var selection = null;
    var selectionTouchId = null;
    var autoScrollTimer = null;
    var lastTouchX = 0;
    var lastTouchY = 0;
    var selectionStartX = 0;
    var selectionStartY = 0;
    /* Chemins Tesseract.js 5 LOCAUX */
    var TESSERACT_WORKER = "libs/tesseract/worker.min.js";
    var TESSERACT_CORE = "libs/tesseract/core";
    var TESSDATA = "tessdata";
    /* Affichage du statut */
    function setStatus(text) {
        status.innerHTML = text;
    }
    /* Progression OCR */
    function setProgress(value) {
        if (value < 0) {
            value = 0;
        }
        if (value > 100) {
            value = 100;
        }
        progress.value = value;
    }
    /* Création du worker Tesseract
     * Tesseract.js 5 :
     * createWorker(lang, oem, options)
     * Les anciens :
     * load()
     * loadLanguage()
     * initialize()
     * ne sont plus nécessaires. */
    function createOCRWorker(lang, callback) {
        if (!window.Tesseract) {
            setStatus("Erreur : Tesseract.js n'est pas chargé.");
            return;
        }
        setStatus("Chargement du moteur OCR...");
        setProgress(0);
        Tesseract.createWorker(
            lang,
            1,
            {
                workerPath: TESSERACT_WORKER,
                corePath: TESSERACT_CORE,
                langPath: TESSDATA,
                logger: function (message) {
                    if (message) {
                        if (
                            typeof message.progress === "number"
                        ) {
                            setProgress(
                                Math.round(message.progress * 100)
                            );
                        }
                        if (message.status) {
                            setStatus(message.status);
                        }
                    }
                },
                errorHandler: function (error) {
                    setStatus("Erreur Tesseract : " + error);
                }
            }
        )
        .then(function (newWorker) {
            worker = newWorker;
            workerLanguage = lang;
            setProgress(100);
            setStatus("Moteur OCR prêt.");
            if (callback) {
                callback();
            }
        })
        .catch(function (error) {
            worker = null;
            workerLanguage = null;
            setStatus("Impossible de charger Tesseract : " + error);
        });
    }
    /* Charger l'image */
    function loadImage() {
        var file;
        if (!imageFile.files ||
            !imageFile.files.length) {
            setStatus("Sélectionnez d'abord une image.");
            return;
        }
        file = imageFile.files[0];
        var reader = new FileReader();
        reader.onload = function (event) {
            image.onload = function () {
                imageLoaded = true;
                selection = null;
                zoom.value = 100;
                scale = 1;
                zoomLabel.innerHTML = "100%";
                drawImage();
                drawSelection();
                setStatus("Image chargée.");
            };
            image.onerror = function () {
                imageLoaded = false;
                setStatus("Impossible de lire l'image.");
            };
            image.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
    /* Charger une image depuis une URL : ?file=image.png */
    function loadImageFromURL(src) {
        if (!src) {
            return;
        }
        image.onload = function () {
            imageLoaded = true;
            selection = null;
            zoom.value = 100;
            scale = 1;
            zoomLabel.innerHTML = "100%";
            drawImage();
            drawSelection();
            setStatus("Image chargée depuis l'URL.");
        };
        image.onerror = function () {
            imageLoaded = false;
            setStatus("Impossible de charger l'image : " + src);
        };
        image.src = src;
    }
    /* Chargement automatique depuis l'URL */
    var imageURL = null;
    try {
        var matchFile = window.location.search.match(/[?&](?:file|image)=([^&]+)/);
        if (matchFile) {
            imageURL = decodeURIComponent(matchFile[1]);
        }
    } catch (e) {
        imageURL = null;
    }
    if (imageURL) {
        loadImageFromURL(imageURL);
    }
    /* Dessiner l'image */
    function drawImage() {
        var width;
        var height;
        var containerHeight;
        var fitScale;
        if (!imageLoaded) {
            return;
        }
        // Le canvas conserve TOUJOURS la résolution originale.
        width = image.naturalWidth;
        height = image.naturalHeight;
        canvas.width = width;
        canvas.height = height;
        selectionCanvas.width = width;
        selectionCanvas.height = height;
        ctx.clearRect(0, 0, width, height);
        // Image originale, sans réduction.
        ctx.drawImage(image, 0, 0, width, height);
        // Calcul de la taille d'affichage. On adapte l'image à la hauteur du conteneur.
        containerHeight = imageContainer.clientHeight;
        if (!containerHeight) {
            containerHeight = 500;
        }
        fitScale = containerHeight / height;
        // Le zoom est appliqué uniquement à l'affichage.
        displayScale = fitScale * scale;
        canvas.style.width = Math.round(width * displayScale) + "px";
        canvas.style.height = Math.round(height * displayScale) + "px";
        selectionCanvas.style.width = Math.round(width * displayScale) + "px";
        selectionCanvas.style.height = Math.round(height * displayScale) + "px";
        drawSelection();
    }
    /* Zoom */
    function applyZoom() {
        var value = parseInt(zoom.value, 10);
        var width;
        var height;
        if (!value) {
            value = 100;
        }
        zoomLabel.innerHTML = value + "%";
        if (!imageLoaded) {
            return;
        }
        // On ne redessine PAS le canvas. On change seulement sa taille d'affichage.
        displayScale = (imageContainer.clientHeight / image.naturalHeight) * (value / 100);
        width = Math.round(image.naturalWidth * displayScale);
        height = Math.round(image.naturalHeight * displayScale);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        selectionCanvas.style.width = width + "px";
        selectionCanvas.style.height = height + "px";
    }
    /* Sélection */
    function startSelection(x, y) {
        if (!imageLoaded) {
            return;
        }
        selecting = true;
        selectionStartX = x;
        selectionStartY = y;
        selection = {
            x: x,
            y: y,
            width: 0,
            height: 0
        };
        drawSelection();
    }
    function updateSelection(x, y) {
        var sx;
        var sy;
        var ex;
        var ey;
        if (!selecting) {
            return;
        }
        sx = selectionStartX;
        sy = selectionStartY;
        ex = x;
        ey = y;
        selection.x = Math.min(sx, ex);
        selection.y = Math.min(sy, ey);
        selection.width = Math.abs(ex - sx);
        selection.height = Math.abs(ey - sy);
        drawSelection();
    }
    function endSelection() {
        if (!selecting) {
            return;
        }
        selecting = false;
        drawSelection();
        if (
            selection &&
            selection.width > 2 &&
            selection.height > 2
        ) {
            runOCR(true);
        }
    }
    function drawSelection() {
        var x;
        var y;
        var w;
        var h;
        selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
        if (!selection) {
            return;
        }
        x = selection.x;
        y = selection.y;
        w = selection.width;
        h = selection.height;
        selectionCtx.save();
        selectionCtx.strokeStyle = "#ff0000";
        selectionCtx.lineWidth = 2;
        selectionCtx.setLineDash([6, 4]);
        selectionCtx.strokeRect(x, y, w, h);
        selectionCtx.restore();
    }
    /* Coordonnées souris / tactile */
    function getCanvasPosition(event) {
        var rect = canvas.getBoundingClientRect();
        var clientX;
        var clientY;
        if (
            event.touches &&
            event.touches.length
        ) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
        } else {
            clientX = event.clientX;
            clientY = event.clientY;
        }
        return {
            x:
                (clientX - rect.left) /
                (rect.width / canvas.width),
            y:
                (clientY - rect.top) /
                (rect.height / canvas.height)
        };
    }
    function updateAutoScroll(pointer) {
        var rect = imageContainer.getBoundingClientRect();
        var margin = 25;
        var speed = 8;
        lastTouchX = pointer.clientX;
        lastTouchY = pointer.clientY;
        if (autoScrollTimer) {
            return;
        }
        autoScrollTimer = setInterval(function () {
            var moved = false;
            if (lastTouchX < rect.left + margin) {
                imageContainer.scrollLeft -= speed;
                moved = true;
            }
            if (lastTouchX > rect.right - margin) {
                imageContainer.scrollLeft += speed;
                moved = true;
            }
            if (lastTouchY < rect.top + margin) {
                imageContainer.scrollTop -= speed;
                moved = true;
            }
            if (lastTouchY > rect.bottom - margin) {
                imageContainer.scrollTop += speed;
                moved = true;
            }
            if (moved && selecting) {
                var p = getCanvasPosition({
                    clientX: lastTouchX,
                    clientY: lastTouchY
                });
                updateSelection(p.x, p.y);
            }
        }, 16);
    }
    function stopAutoScroll() {
        if (autoScrollTimer) {
            clearInterval(autoScrollTimer);
            autoScrollTimer = null;
        }
    }
    /* Souris */
    function mouseDown(event) {
        if (!imageLoaded) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        startSelection(p.x, p.y);
    }
    function mouseMove(event) {
        if (!selecting) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        updateSelection(p.x, p.y);
    }
    function mouseUp(event) {
        if (!selecting) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        updateSelection(p.x, p.y);
        endSelection();
    }
    /* Popup du résultat OCR */
    function openResultPopup() {
        var container = document.getElementById("popupResultContent");
        var popupText = document.getElementById("popupResultText");
        popupText.value = result.value;
        openPopupMenu(container);
    }
    /* OCR */
    function getOCRCanvas(useSelection) {
        var tempCanvas;
        var tempCtx;
        var sx;
        var sy;
        var sw;
        var sh;
        if (!imageLoaded) {
            return null;
        }
        if (
            useSelection && selection && selection.width > 2 && selection.height > 2
        ) {
            sx = Math.round(selection.x);
            sy = Math.round(selection.y);
            sw = Math.round(selection.width);
            sh = Math.round(selection.height);
        } else {
            sx = 0;
            sy = 0;
            sw = canvas.width;
            sh = canvas.height;
        }
        tempCanvas = document.createElement("canvas");
        tempCanvas.width = sw;
        tempCanvas.height = sh;
        tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
        return tempCanvas;
    }
    function runOCR(useSelection) {
        var lang = language.value;
        var inputCanvas;
        if (!imageLoaded) {
            setStatus("Chargez d'abord une image.");
            return;
        }
        inputCanvas = getOCRCanvas(useSelection);
        if (!inputCanvas) {
            setStatus("Aucune image à analyser.");
            return;
        }
        result.value = "";
        setProgress(0);
        function recognize() {
            setStatus("Reconnaissance OCR...");
            worker.recognize(
                inputCanvas
            )
            .then(function (response) {
                var text = "";
                if (
                    response &&
                    response.data &&
                    typeof response.data.text === "string"
                ) {
                    text = response.data.text;
                }
                result.value = text;
                setProgress(100);
                setStatus("Reconnaissance terminée.");
                openResultPopup();
            })
            .catch(function (error) {
                setStatus("Erreur OCR : " + error);
            });
        }
        // Le worker est réutilisé tant que la langue ne change pas.
        if (
            worker &&
            workerLanguage === lang
        ) {
            recognize();
            return;
        }
        // Une autre langue nécessite un nouveau worker.
        if (worker) {
            worker.terminate()
                .then(function () {
                    worker = null;
                    workerLanguage = null;
                    createOCRWorker(lang, recognize);
                })
                .catch(function () {
                    worker = null;
                    workerLanguage = null;
                    createOCRWorker(lang, recognize);
                });
        } else {
            createOCRWorker(lang, recognize);
        }
    }
    /* Réinitialisation */
    function resetAll() {
        imageLoaded = false;
        image.src = "";
        selection = null;
        selecting = false;
        canvas.width = 1;
        canvas.height = 1;
        selectionCanvas.width = 1;
        selectionCanvas.height = 1;
        result.value = "";
        setProgress(0);
        setStatus("Réinitialisé.");
    }
    /* Événements */
    imageFile.onchange = function () {
        loadImage();
    };
    zoom.oninput = applyZoom;
    zoom.onchange = function () {
        var value = parseInt(zoom.value, 10);
        if (!value) {
            value = 100;
        }
        scale = value / 100;
        applyZoom();
    };
    ocrButton.onclick = function () {
        runOCR(false);
    };
    resetButton.onclick = resetAll;
    /* Sélection souris */
    canvas.onmousedown = function (event) {
        if (!imageLoaded) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        startSelection(p.x, p.y);
    };
    canvas.onmousemove = function (event) {
        if (!selecting) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        updateSelection(p.x, p.y);
        updateAutoScroll({
            clientX: event.clientX,
            clientY: event.clientY
        });
    };
    canvas.onmouseup = function (event) {
        if (!selecting) {
            return;
        }
        event.preventDefault();
        var p = getCanvasPosition(event);
        updateSelection(p.x, p.y);
        stopAutoScroll();
        endSelection();
    };
    // Si le doigt ou la souris sort du canvas pendant la sélection
    document.addEventListener("mousemove", function (event) {
        if (!selecting) {
            return;
        }
        if (event.target === canvas) {
            return;
        }
        canvas.onmousemove(event);
    });
    document.onmouseup = function (event) {
        if (!selecting) {
            return;
        }
        canvas.onmouseup(event);
    };
    /* Sélection tactile */
    var touchEnabled = true;
    var selectionTouchId = null;
    canvas.addEventListener("touchstart", function (event) {
        if (!touchEnabled || !imageLoaded) {
            return;
        }
        event.preventDefault();
        var touch = event.changedTouches[0];
        selectionTouchId = touch.identifier;
        canvas.onmousedown({
            clientX: touch.clientX,
            clientY: touch.clientY,
            preventDefault: function () {}
        });
    }, { passive: false });
    canvas.addEventListener("touchmove", function (event) {
        if (!touchEnabled) {
            return;
        }
        event.preventDefault();
        var touch = null;
        var i;
        for (i = 0; i < event.touches.length; i++) {
            if (event.touches[i].identifier === selectionTouchId) {
                touch = event.touches[i];
                break;
            }
        }
        if (!touch) {
            return;
        }
        canvas.onmousemove({
            clientX: touch.clientX,
            clientY: touch.clientY,
            preventDefault: function () {}
        });
    }, { passive: false });
    canvas.addEventListener("touchend", function (event) {
        if (!touchEnabled) {
            return;
        }
        event.preventDefault();
        var touch = null;
        var i;
        for (i = 0; i < event.changedTouches.length; i++) {
            if (event.changedTouches[i].identifier === selectionTouchId) {
                touch = event.changedTouches[i];
                break;
            }
        }
        if (!touch) {
            return;
        }
        canvas.onmouseup({
            clientX: touch.clientX,
            clientY: touch.clientY,
            preventDefault: function () {}
        });
        selectionTouchId = null;
    }, { passive: false });
    canvas.addEventListener("touchcancel", function (event) {
        if (!touchEnabled) {
            return;
        }
        event.preventDefault();
        selectionTouchId = null;
        selecting = false;
        stopAutoScroll();

    }, { passive: false });
    /* Nettoyage */
    window.onbeforeunload = function () {
            if (worker) {
                worker.terminate();
                worker = null;
            }
        };
    /* État initial */
    // setStatus("Prêt. Chargez une image.");
    /* Chargement de Tesseract au démarrage */
    window.onload = function () {
        createOCRWorker(language.value);
    };
})();
</script>
</body>
</html>
