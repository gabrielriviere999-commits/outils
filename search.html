<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche</title>
<meta name="description" content="Recherche">
<link rel="icon" href="favicon.png" type="image/png">
<style>
body {
  background:#000;
  color:#ccc;
  font-family:sans-serif;
}
input {
  width:100%;
  box-sizing:border-box;
  padding:4px;
  font-size:14px;
  font-family:sans-serif;
  background:#000;
  color:#ccc;
  border:2px groove #888;
}
a {
  text-decoration:none;
  color:#f44;
  word-break:break-all;
}
a:hover{text-decoration:underline;}
ul{padding-left:15px;margin:0;}
li{line-height:1.5;}
b{color:#f44;}
hr{border:1px inset #f44;}
</style>
</head>
<body>
<main>
<b>Recherche : dépôt outils</b><hr>
<p style="font-size:14px;">Vous pouvez rechercher les noms ou les contenus des fichiers texte et .html mais uniquement les noms pour les autres fichiers.</p>
<input id="search" onkeyup="doSearch()" placeholder="Rechercher..." aria-label="Champ de recherche">
<div id="count" style="margin:4px 0;"></div>
<div id="results"></div>
<script src="docs.js"></script>
<script>
var STORAGE_KEY = "recherche_outils_storage";
function doSearch() {
  var q = document.getElementById("search").value.toLowerCase();
  var out = "<ul>";
  var found = 0;
  for (var i = 0; i < docs.length; i++) {
    if (docs[i].content.toLowerCase().indexOf(q) !== -1) {
      out += "<li>"
          + "<a href='" + docs[i].url + "' target='_self'>" + docs[i].title + "</a>"
          + " <a href='" + docs[i].url + "' download>[↓]</a>"
          + "</li>";
      found++;
    }
  }
  out += "</ul>";
  document.getElementById("count").textContent = found > 0 ? found + " résultat(s)" : "Aucun résultat";
  document.getElementById("results").innerHTML = found > 0 ? out : "";
  saveSearch(q, out, found);
}
function saveSearch(q, out, found) {
  var data = {
    query: q,
    results: out,
    count: found
  };
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadSearch() {
  var raw = sessionStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    var data = JSON.parse(raw);
    if (data.query !== undefined) {
      document.getElementById("search").value = data.query;
    }
    if (data.results !== undefined) {
      document.getElementById("results").innerHTML = data.results;
    }
    if (data.count !== undefined) {
      document.getElementById("count").textContent =
          data.count > 0
              ? data.count + " résultat(s)"
              : "Aucun résultat";
    }
  } catch (e) {
    sessionStorage.removeItem(STORAGE_KEY);
  }
}
window.onload = function() {
  loadSearch();
};
</script>
</main>
</body>
</html>
