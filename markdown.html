<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<link rel="stylesheet" href="outils.css">
<style>
#input{height:500px;height:70vh;}
</style>
</head>

<body>

<h2>Markdown</h2>
<div class="toolbar">

  <!-- Titres -->
  <button data-md="# ">h1</button>
  <button data-md="## ">h2</button>
  <button data-md="### ">h3</button>
  <button data-md="#### ">h4</button>
  <button data-md="##### ">h5</button>
  <button data-md="###### ">h6</button>
|
  <!-- Texte -->
  <button data-md="**texte**">Gras</button>
  <button data-md="*texte*">Italique</button>
  <button data-md="~~texte~~">Barré</button>
|
  <!-- Code -->
  <button data-md="`code`">Code</button>
  <button data-md="CODEBLOCK">Bloc</button>
|
  <!-- Structure -->
  <button data-md="- ">Liste</button>
  <button data-md="1. ">Liste num</button>
  <button data-md="> ">Citation</button>
  <button data-md="---">hr</button>
|
  <!-- Liens -->
  <button data-md="[texte](url)">Lien</button>
  <button data-md="![texte](url)">Image</button>
</div>

<textarea wrap="off" id="input"></textarea><br>
<button id="copyinput" class="btn-color" style="background:#4caf50;">Copier</button>
<button id="importTextareaFileinput">Importer fichier...</button>
<input type="file" id="textareaFileinput" style="display:none;">

<script src="outils.js"></script>
<script>
/* --- Insertion --- */
function insertAtCursor(textarea, text) {
  try {
    var start = textarea.selectionStart;
    var end   = textarea.selectionEnd;

    if (start === undefined || end === undefined) throw "no-selection";

    var value = textarea.value;
    textarea.value =
      value.substring(0, start) + text + value.substring(end);

    textarea.selectionStart = textarea.selectionEnd = start + text.length;
  } catch(e) {
    textarea.value += text;
  }
}

/* --- Toolbar --- */
function wrapSelection(textarea, before, after) {
  try {
    var start = textarea.selectionStart;
    var end   = textarea.selectionEnd;

    if (start === undefined || end === undefined) throw "no-selection";

    var value = textarea.value;
    var selected = value.substring(start, end);

    if (start === end) {
      textarea.value =
        value.substring(0, start) + before + after + value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + before.length;
      return;
    }

    textarea.value =
      value.substring(0, start) +
      before + selected + after +
      value.substring(end);

    textarea.selectionStart = start + before.length;
    textarea.selectionEnd   = start + before.length + selected.length;

  } catch(e) {
    textarea.value += before + after;
  }
}

function initToolbar() {
  var toolbar = document.getElementsByClassName("toolbar")[0];
  var buttons = toolbar.getElementsByTagName("button");
  var textarea = document.getElementById("input");

  for (var i = 0; i < buttons.length; i++) {
    (function(btn) {
      var mdText = btn.getAttribute("data-md");
      if (!mdText) return;

      btn.onclick = function() {
        if (mdText === "CODEBLOCK") {
          mdText = "```\ncode\n```\n";
        }
        if (mdText === "**texte**") {
          wrapSelection(textarea, "**", "**");
        }
        else if (mdText === "*texte*") {
          wrapSelection(textarea, "*", "*");
        }
        else if (mdText === "~~texte~~") {
          wrapSelection(textarea, "~~", "~~");
        }
        else {
          insertAtCursor(textarea, mdText);
        }
        textarea.focus();
      };
    })(buttons[i]);
  }
}

/* --- Init --- */
window.onload = function() {
  initToolbar();
};
</script>

</body>
</html>
