<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frise Chronologique ASCII</title>
<link rel="stylesheet" href="outils.css">
</head>
<body>
<h2>Frise chronologique ASCII</h2>
<div class="container">
<div class="card">
  <h3>Évènements</h3>
  <button onclick="addEventUnshift()">Ajouter évènement au début</button>
  <button onclick="addEventPush()">Ajouter évènement à la fin</button>
  <div id="eventList" class="scrollZone"></div>
</div>
<div class="card">
  <h3>Aperçu / texte</h3>
  <textarea wrap="off" id="output" style="width:100%;height:200px;box-sizing:border-box;"></textarea><br>
  <button onclick="importAscii()" class="btn-color" style="background:#ff8800;">Mettre à jour</button>
  <button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier</button>
  <button id="importTextareaFileoutput">Importer fichier...</button>
  <input type="file" id="textareaFileoutput" style="display:none;">
</div>
</div>
<script src="outils.js"></script>
<script>
/* --- Données internes --- */
var events = [];

/* --- Ajouter un évènement --- */
function addEventUnshift() {
  events.unshift({
    title: "Titre",
    date: "01/01/2000",
    desc: "Description",
  });
  refreshEditor();
  exportAscii();
}

function addEventPush() {
  events.push({
    title: "Titre",
    date: "01/01/2000",
    desc: "Description",
  });
  refreshEditor();
  exportAscii();
}

function addEventAfter(i) {
  events.splice(i + 1, 0, {
    title: "Titre",
    date: "01/01/2000",
    desc: "Description"
  });
  refreshEditor();
  exportAscii();
}

/* --- Supprimer un évènement --- */
function removeEvent(i) {
  events.splice(i, 1);
  refreshEditor();
  exportAscii();
}

/* --- Déplacer un évènement --- */
function moveEventUp(i) {
  if (i <= 0) return;
  var tmp = events[i - 1];
  events[i - 1] = events[i];
  events[i] = tmp;
  refreshEditor();
  exportAscii();
}

function moveEventDown(i) {
  if (i >= events.length - 1) return;
  var tmp = events[i + 1];
  events[i + 1] = events[i];
  events[i] = tmp;
  refreshEditor();
  exportAscii();
}

/* --- Rafraîchir l'éditeur --- */
function refreshEditor() {
  var html = "";
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    html +=
      '<div style="border: 2px groove #808080;padding:5px;margin-bottom:5px;">' +
      'Titre : <input value="' + e.title + '" onchange="events[' + i + '].title=this.value; exportAscii();"><br>' +
      'Date : <input value="' + e.date + '" onchange="events[' + i + '].date=this.value; exportAscii();"><br>' +
      'Description :<br>' +
      '<textarea wrap="off" style="width:100%;height:100px;" onchange="events[' + i + '].desc=this.value; exportAscii();">' +
        e.desc +
      '</textarea><br>' +

      // Boutons ↑ ↓ + x
      '<button onclick="moveEventUp(' + i + ')" style="width:28px;height:28px;vertical-align:middle;">↑</button>' +
      '<button onclick="moveEventDown(' + i + ')" style="width:28px;height:28px;vertical-align:middle;">↓</button>' +
      '<button onclick="addEventAfter(' + i + ')" style="width:28px;height:28px;vertical-align:middle;">+</button>' +
      '<button onclick="removeEvent(' + i + ')" class="btn-color" style="background:#ff4444;width:28px;height:28px;vertical-align:middle;">x</button>' +
      '</div>';
  }
  document.getElementById("eventList").innerHTML = html;
}

/* --- EXPORT TEXTE --- */
function exportAscii() {
  if (events.length === 0) {
    document.getElementById("output").value = "";
    return;
  }

  var i;

  // 1. Largeur de chaque colonne
  var widths = [];
  for (i = 0; i < events.length; i++) {
    var w = events[i].title.length;
    if (events[i].date.length > w) w = events[i].date.length;
    widths[i] = w + 4;
  }

  // 2. Centrage
  function center(text, width) {
    var left = Math.floor((width - text.length) / 2);
    var right = width - text.length - left;
    return repeat(" ", left) + text + repeat(" ", right);
  }

  // 3. Largeur totale (colonnes + séparateurs)
  var totalWidth = 0;
  for (i = 0; i < widths.length; i++) totalWidth += widths[i];
  totalWidth += (events.length - 1); // les "|"

  // 4. Lignes de la flèche (haut et bas)
  var top1 = repeat(" ", totalWidth - 2) + "|\\";
  var sep1 = repeat("-", totalWidth - 1) + " \\";
  var sep2 = repeat("-", totalWidth - 1) + " /";
  var bottomArrow = repeat(" ", totalWidth - 2) + "|/";

  // 5. Titres
  var titleRow = "";
  for (i = 0; i < events.length; i++) {
    titleRow += center(events[i].title, widths[i]);
    if (i < events.length - 1) titleRow += "|";
  }
  titleRow += " }";

  // 7. Dates
  var dateRow = "";
  for (i = 0; i < events.length; i++) {
    dateRow += center(events[i].date, widths[i]);
    if (i < events.length - 1) dateRow += " ";
  }

  // 8. Descriptions
  var descs = [];
  for (i = 0; i < events.length; i++) {
    descs.push(events[i].date + " : " + events[i].desc);
  }

  // 9. Résultat final
  var out =
    top1 + "\n" +
    sep1 + "\n" +
    titleRow + "\n" +
    sep2 + "\n" +
    bottomArrow + "\n" +
    dateRow + "\n\n" +
    descs.join("\n");

  document.getElementById("output").value = out;
}

function repeat(s, n) {
  var r = "";
  while (n-- > 0) r += s;
  return r;
}

/* --- IMPORT TEXTE Format : date | titre | desc --- */
function importAscii() {
  var raw = document.getElementById("output").value;
  var lines = raw.split("\n");
  var i;

  var titles = [];
  var dates = [];
  var descs = [];

  // 1. Ligne des titres (celle qui contient "}")
  var titleIndex = -1;
  for (i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("}") !== -1) {
      titleIndex = i;
      break;
    }
  }
  if (titleIndex === -1) return;

  var titleLine = lines[titleIndex];
  titleLine = titleLine.replace("}", "");
  // découpe par "|"
  var parts = titleLine.split("|");
  for (i = 0; i < parts.length; i++) {
    var t = trim(parts[i]);
    if (t) titles.push(t);
  }

  // 2. Ligne des dates : première ligne non vide après la ligne contenant "|/"
  var arrowIndex = -1;
  for (i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("|/") !== -1) {
      arrowIndex = i;
      break;
    }
  }
  if (arrowIndex !== -1) {
    for (i = arrowIndex + 1; i < lines.length; i++) {
      var l = trim(lines[i]);
      if (l) {
        // découpe par plusieurs espaces
        dates = l.split(/\s{2,}/);
        break;
      }
    }
  }

  // 3. Descriptions multilignes
  var inDesc = false;
  var currentDesc = "";

  for (i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    // Première ligne de description (contient ":")
    if (line.indexOf(":") !== -1) {
      // Si on était déjà dans une description → on la pousse
      if (currentDesc !== "") {
        descs.push(currentDesc);
      }

      // Nouvelle description
      var idx = line.indexOf(":");
      currentDesc = line.substring(idx + 1).replace(/^\s+/, "");
      inDesc = true;
      continue;
    }

    // Lignes suivantes (multilignes)
    if (inDesc) {
      // Fin si ligne vide
      if (line === "") {
        descs.push(currentDesc);
        currentDesc = "";
        inDesc = false;
        continue;
      }

      // Sinon → on ajoute la ligne à la description
      currentDesc += "\n" + line;
    }
  }

  // Dernière description si non poussée
  if (currentDesc !== "") {
    descs.push(currentDesc);
  }

  // 4. Reconstruire events[]
  events = [];
  var maxLen = Math.max(titles.length, dates.length, descs.length);
  for (i = 0; i < maxLen; i++) {
    events.push({
      title: titles[i] || "",
      date: dates[i] || "",
      desc: descs[i] || "",
    });
  }

  refreshEditor();
}

// trim ES3
function trim(s) {
  return s.replace(/^\s+/, "").replace(/\s+$/, "");
}
</script>

</body>
</html>
