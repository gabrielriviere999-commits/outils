<!DOCTYPE html>
<html lang="fr">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur d'unités</title>
<link rel="stylesheet" href="outils.css">
<style>
.container {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
  gap:12px;
}
.dropdown {
  padding:4px;
  cursor:pointer;
}
.dropdown-list {
  margin-top:2px;
  max-height:200px;
  overflow-y:auto;
  display:none;
}
.dropdown-list div {
  padding:4px;
  border-bottom:1px solid #202020;
}
.dropdown-list div:hover {
  background:#000080;
  color:#ccc;
}
.dropdown-selected{font-weight:bold;}
.dropdown-selected:hover{background:#202020;}
.block-cat{background:#e35f5f;}
.block-value{background:#ffd700;}
.block-from{background:#8ec582;}
.block-to{background:#7dc343;}
.block {
  padding:10px;
  margin-top:15px;
}
.block h2 {
  background:#000080;
  color:#ccc;
  padding:4px;
  margin:-10px -10px 10px -10px;
  font-size:14px;
  font-weight:bold;
}
#fromSearchList,
#toSearchList {
  max-height:150px;
  overflow-y:auto;
}
label{color:#000;}
</style>
</head>
<body>
<button onclick="openMenuPopup()" class="select">≡</button>
<div id="popupMenuContent" style="display:none"></div>
<button onclick="openSearchPopup()" class="select">Q</button>
<div id="popupSearchContent" style="display:none">
  <input id="search" onkeyup="doSearch()" placeholder="Rechercher...">
  <div id="count" style="margin:0.5em 0;"></div>
  <div id="results"></div>
</div>
<h2>Convertisseur d'unités</h2>

<div class="container">
<!-- CATEGORIE -->
<div class="block block-cat border-externe">
  <label>Catégorie :</label>
  <div class="dropdown border-interne" id="catDrop">
    <div class="dropdown-selected" id="catSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="catList"></div>
  </div>
</div>

<div class="block block-value border-externe">
  <label for="inputValue">Valeur à convertir :</label>
  <input type="text" id="inputValue" value="1">
</div>
</div>

<div class="container">
<!-- DE -->
<div class="block block-from border-externe">
  <label>Rechercher "De" :</label>
  <input type="text" id="searchFrom">

  <!-- MENU DE RECHERCHE SÉPARÉ -->
  <div class="dropdown-list border-interne" id="fromSearchList" style="display:none;"></div>

  <div class="dropdown border-interne" id="fromDrop">
    <div class="dropdown-selected" id="fromSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="fromList"></div>
  </div>
</div>

<!-- VERS -->
<div class="block block-to border-externe">
  <label>Rechercher "Vers" :</label>
  <input type="text" id="searchTo">

  <!-- MENU DE RECHERCHE SÉPARÉ -->
  <div class="dropdown-list border-interne" id="toSearchList" style="display:none;"></div>

  <div class="dropdown border-interne" id="toDrop">
    <div class="dropdown-selected" id="toSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="toList"></div>
  </div>
</div>
</div>

<div class="block border-externe" style="text-align:center;">
  <button id="swapBtn">Inverser De ↔ Vers</button>
</div>
	
<p>
  Résultat : <strong id="result">—</strong>

</p>

/* --- 3. Extraire les unités --- */
function getUnitList(cat) {
  if (!cat) return [];
  if (cat.special === true) return cat.units;

  var arr = [];
  for (var k in cat.units) arr.push(k);
  return arr;
}

/* --- 4. Liste globale des unités + map unité → catégorie --- */

var allUnits = [];
var unitToCategory = {};

function buildGlobalUnitList() {
  var catName, cat, units, i;

  for (catName in categories) {
    cat = categories[catName];
    units = getUnitList(cat);

    for (i = 0; i < units.length; i++) {
      var u = units[i];
      allUnits.push(u);
      unitToCategory[u] = catName;
    }
  }
}

/* --- 5. Dropdown --- */
function createDropdown(selectedId, listId, onSelect) {
  var selected = document.getElementById(selectedId);
  var list = document.getElementById(listId);
  var isOpen = false;
  var options = [];
  var activeIndex = -1;

  list.style.display = "none";

function highlight() {
  var i;
  for (i = 0; i < options.length; i++) {
    options[i].style.background = (i === activeIndex) ? "#202020" : "";
  }

  if (activeIndex >= 0 && activeIndex < options.length) {
    options[activeIndex].scrollIntoView();
  }
}

  selected.onclick = function () {
    if (isOpen) {
      list.style.display = "none";
      isOpen = false;
      activeIndex = -1;
      highlight();
    } else {
      list.style.display = "block";
      isOpen = true;
      activeIndex = (options.length > 0) ? 0 : -1;
      highlight();
    }
  };

  selected.onkeydown = function (e) {
    var code = e.keyCode || e.which;

    // Entrée ou Espace : ouvrir / valider
    if (code === 13 || code === 32) {
      if (!isOpen) {
        selected.onclick(); // ouvre le menu
      } else {
        if (activeIndex >= 0 && activeIndex < options.length) {
          options[activeIndex].onclick(); // sélectionne l'option
        }
      }
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    if (!isOpen) return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= options.length) activeIndex = 0;
      highlight();
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = options.length - 1;
      highlight();
      if (e.preventDefault) e.preventDefault();
      return false;
    }
  };

  function fill(arr) {
    list.innerHTML = "";
    options = [];
    activeIndex = -1;

    var i;
    for (i = 0; i < arr.length; i++) {
      (function (opt) {
        var div = document.createElement("div");

        var label = opt;
        if (unitNames[opt]) {
          label = opt + " — " + unitNames[opt];
        }

        div.appendChild(document.createTextNode(label));

        div.onclick = function () {
          selected.innerHTML = label;
          list.style.display = "none";
          isOpen = false;
          activeIndex = -1;
          highlight();
          onSelect(opt);
        };

        list.appendChild(div);
        options.push(div);
      })(arr[i]);
    }
  }

  return fill;
}

/* --- 6. Variables global + création des 3 menus --- */
var selectedCategory = null;
var selectedFrom = null;
var selectedTo = null;

var fillCategory = createDropdown("catSelected", "catList", function(opt){
  selectedCategory = opt;
  updateUnits();
});

var fillFrom = createDropdown("fromSelected", "fromList", function(opt){
  selectedFrom = opt;

  // Trouver la catégorie de cette unité
  var catName = unitToCategory[opt];

  // Si la catégorie change
  if (catName && selectedCategory !== catName) {
    selectedCategory = catName;
    document.getElementById("catSelected").innerHTML = catName;

    // Mettre à jour les unités
    updateUnits();

    // Réappliquer la sélection automatiquement
    document.getElementById("fromSelected").innerHTML = opt;
    selectedFrom = opt;
  }

  convert();
});

var fillTo = createDropdown("toSelected", "toList", function(opt){
  selectedTo = opt;

  var catName = unitToCategory[opt];

  if (catName && selectedCategory !== catName) {
    selectedCategory = catName;
    document.getElementById("catSelected").innerHTML = catName;

    updateUnits();

    document.getElementById("toSelected").innerHTML = opt;
    selectedTo = opt;
  }

  convert();
});

/* --- 7. Mise à jour des unités --- */
function updateUnits() {
  var cat = categories[selectedCategory];
  var units = getUnitList(cat);

  fillFrom(units);
  fillTo(units);

  selectedFrom = null;
  selectedTo = null;

  document.getElementById("fromSelected").innerHTML = "—";
  document.getElementById("toSelected").innerHTML = "—";
  document.getElementById("result").innerHTML = "—";
}

/* --- 8. Recherche globale (De + Vers) --- */
// Recherche "De" avec noms + clavier + scroll
document.getElementById("searchFrom").oninput = function () {
  var q = this.value.toLowerCase();
  var list = document.getElementById("fromSearchList");
  var i;

  list.innerHTML = "";

  if (q === "") {
    list.style.display = "none";
    return;
  }

  var filtered = [];
  for (i = 0; i < allUnits.length; i++) {
    var u = allUnits[i];
    var name = unitNames[u] ? unitNames[u].toLowerCase() : "";

    if (u.toLowerCase().indexOf(q) !== -1 || name.indexOf(q) !== -1) {
      filtered.push(u);
    }
  }

  for (i = 0; i < filtered.length; i++) {
    (function(unit){
      var div = document.createElement("div");

      var label = unit;
      if (unitNames[unit]) {
        label = unit + " — " + unitNames[unit];
      }

      div.appendChild(document.createTextNode(label));

      div.onclick = function () {
        var catName = unitToCategory[unit];

        if (selectedCategory !== catName) {
          selectedCategory = catName;
          document.getElementById("catSelected").innerHTML = catName;
          updateUnits();
        }

        selectedFrom = unit;
        document.getElementById("fromSelected").innerHTML = label;

        list.style.display = "none";
        convert();
      };

      list.appendChild(div);
    })(filtered[i]);
  }

  list.style.display = filtered.length ? "block" : "none";
};


// Navigation clavier pour la recherche "De"
(function(){
  var input = document.getElementById("searchFrom");
  var list  = document.getElementById("fromSearchList");
  var searchOptions = [];
  var activeIndex = -1;

function highlight() {
  var i;
  for (i = 0; i < searchOptions.length; i++) {
    searchOptions[i].style.background = (i === activeIndex) ? "#202020" : "";
  }

  if (activeIndex >= 0 && activeIndex < searchOptions.length) {
    var item = searchOptions[activeIndex];
    item.scrollIntoView();
  }
}

  var oldInput = input.oninput;
  input.oninput = function(){
    oldInput.call(this);

    searchOptions = [];
    var children = list.children;
    var i;
    for (i = 0; i < children.length; i++) {
      searchOptions.push(children[i]);
    }

    activeIndex = (searchOptions.length > 0) ? 0 : -1;
    highlight();
  };

  input.onkeydown = function(e){
    var code = e.keyCode || e.which;

    if (list.style.display !== "block") return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= searchOptions.length) activeIndex = 0;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = searchOptions.length - 1;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 13) { // Entrée
      if (activeIndex >= 0 && activeIndex < searchOptions.length) {
        searchOptions[activeIndex].onclick();
      }
      e.preventDefault();
      return false;
    }
  };
})();

// Recherche "Vers" avec noms + clavier + scroll
document.getElementById("searchTo").oninput = function () {
  var q = this.value.toLowerCase();
  var list = document.getElementById("toSearchList");
  var i;

  list.innerHTML = "";

  if (q === "") {
    list.style.display = "none";
    return;
  }

  var filtered = [];
  for (i = 0; i < allUnits.length; i++) {
    var u = allUnits[i];
    var name = unitNames[u] ? unitNames[u].toLowerCase() : "";

    if (u.toLowerCase().indexOf(q) !== -1 || name.indexOf(q) !== -1) {
      filtered.push(u);
    }
  }

  for (i = 0; i < filtered.length; i++) {
    (function(unit){
      var div = document.createElement("div");

      var label = unit;
      if (unitNames[unit]) {
        label = unit + " — " + unitNames[unit];
      }

      div.appendChild(document.createTextNode(label));

      div.onclick = function () {
        var catName = unitToCategory[unit];

        if (selectedCategory !== catName) {
          selectedCategory = catName;
          document.getElementById("catSelected").innerHTML = catName;
          updateUnits();
        }

        selectedTo = unit;
        document.getElementById("toSelected").innerHTML = label;

        list.style.display = "none";
        convert();
      };

      list.appendChild(div);
    })(filtered[i]);
  }

  list.style.display = filtered.length ? "block" : "none";
};

// Navigation clavier pour la recherche "Vers"
(function(){
  var input = document.getElementById("searchTo");
  var list  = document.getElementById("toSearchList");
  var searchOptions = [];
  var activeIndex = -1;

function highlight() {
  var i;
  for (i = 0; i < searchOptions.length; i++) {
    searchOptions[i].style.background = (i === activeIndex) ? "#202020" : "";
  }

  if (activeIndex >= 0 && activeIndex < searchOptions.length) {
    var item = searchOptions[activeIndex];
    item.scrollIntoView();
  }
}

  var oldInput = input.oninput;
  input.oninput = function(){
    oldInput.call(this);

    searchOptions = [];
    var children = list.children;
    var i;
    for (i = 0; i < children.length; i++) {
      searchOptions.push(children[i]);
    }

    activeIndex = (searchOptions.length > 0) ? 0 : -1;
    highlight();
  };

  input.onkeydown = function(e){
    var code = e.keyCode || e.which;

    if (list.style.display !== "block") return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= searchOptions.length) activeIndex = 0;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = searchOptions.length - 1;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 13) { // Entrée
      if (activeIndex >= 0 && activeIndex < searchOptions.length) {
        searchOptions[activeIndex].onclick();
      }
      e.preventDefault();
      return false;
    }
  };
})();

/* --- 9. Conversion --- */
function cleanNumber(n) {
  return Number(n.toFixed(12));
}

function convert() {
  if (!selectedCategory || !selectedFrom || !selectedTo) return;

  var cat = categories[selectedCategory];

  // Récupérer la valeur entrée
  var raw = document.getElementById("inputValue").value;

  // Remplace la virgule par un point
  raw = raw.replace(",", ".");

  var val = parseFloat(raw);

  if (isNaN(val)) {
    document.getElementById("result").innerHTML = "—";
    return;
  }

  // CAS SPÉCIAL : TEMPÉRATURE
  if (cat.special === true) {
    var res;

    if (selectedFrom === "C" && selectedTo === "F") res = val * 9/5 + 32;
    else if (selectedFrom === "F" && selectedTo === "C") res = (val - 32) * 5/9;
    else if (selectedFrom === "C" && selectedTo === "K") res = val + 273.15;
    else if (selectedFrom === "K" && selectedTo === "C") res = val - 273.15;
    else if (selectedFrom === "F" && selectedTo === "K") res = (val - 32) * 5/9 + 273.15;
    else if (selectedFrom === "K" && selectedTo === "F") res = (val - 273.15) * 9/5 + 32;
    else res = val;

    res = cleanNumber(res);

    document.getElementById("result").innerHTML =
      val + " " + selectedFrom + " = " + res + " " + selectedTo;
    return;
  }

  // CAS NORMAL : BASE MULTIPLICATIVE
  var units = cat.units;
  var baseFrom = units[selectedFrom];
  var baseTo = units[selectedTo];

  if (!baseFrom || !baseTo) return;

  var ratio = baseFrom / baseTo;
  var res = cleanNumber(val * ratio);

  document.getElementById("result").innerHTML =
    val + " " + selectedFrom + " = " + res + " " + selectedTo;
}

document.getElementById("inputValue").oninput = convert;

/* --- 10. Initialisation --- */
(function init() {
  buildGlobalUnitList();

  var catNames = [];
  for (var k in categories) catNames.push(k);

  fillCategory(catNames);
})();

/* --- 11. COPIER --- */
document.getElementById("copyBtn").onclick = function () {
  var btn = event.target;
  var text = document.getElementById("result").innerHTML;

  // Créer un textarea caché
  var temp = document.createElement("textarea");
  temp.value = text;
  temp.style.position = "absolute";
  temp.style.left = "-9999px";
  document.body.appendChild(temp);

  // Sélectionner + copier
  temp.select();
  try { document.execCommand("copy"); } catch (e) {}

  // Supprimer le textarea
  document.body.removeChild(temp);
  btn.focus();
};

document.getElementById("inputValue").value = "1";
convert();

/* --- 12. bouton Inverser De ↔ Vers --- */
document.getElementById("swapBtn").onclick = function () {

  // On échange les unités sélectionnées
  var oldFrom = selectedFrom;
  var oldTo   = selectedTo;

  if (!oldFrom || !oldTo) return;

  // On met à jour les variables internes
  selectedFrom = oldTo;
  selectedTo   = oldFrom;

  // On met à jour l'affichage (avec noms si disponibles)
  var labelFrom = selectedFrom;
  if (unitNames[selectedFrom]) {
    labelFrom = selectedFrom + " — " + unitNames[selectedFrom];
  }

  var labelTo = selectedTo;
  if (unitNames[selectedTo]) {
    labelTo = selectedTo + " — " + unitNames[selectedTo];
  }

  document.getElementById("fromSelected").innerHTML = labelFrom;
  document.getElementById("toSelected").innerHTML   = labelTo;

  // On recalcule
  convert();
};
