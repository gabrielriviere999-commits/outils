<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
<title>Photo 360°</title>
<style>
#scene {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:block;
  cursor:grab;
  touch-action:none;
}
#scene.saisie{cursor:grabbing;}
.menu {
  top:0;
  left:0;
  position:absolute;
  z-index:10;
  font-size:14px;
  height:36px;
  padding:0 10px;
}
.btnDir {
  width:34px;
  height:30px;
  padding:0;
  line-height:1;
  font-size:14px;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
}
#depot {
  position:absolute;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  background:rgba(20,40,80,0.45);
  border:3px dashed #7aa7ff;
}
#depot.actif{display:block;}
#depot span{color:#fff;}
#erreur{color:#ef4444}
#statut{display:block;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<button data-action="openMenuPopup" class="menu multitouchbtn">≡</button>
<div id="popupMenuContent" style="display:none">
  <b class="titleb">Menu</b><hr class="titlehr">
  <div style="display:table;table-layout:fixed;width:100%;">
    <div style="display:table-row;">
      <div style="display:table-cell;">
        <input type="file" id="fileinput">
      </div>
      <div style="display:table-cell;">
        <input id="pastefileinput" placeholder="Ou cliquer et Ctrl+V" maxlength="0" style="width:100%;box-sizing:border-box;">
      </div>
    </div>
  </div>
  <hr>
  <div style="display:table;table-layout:fixed;width:100%;">
    <div style="display:table-row;">
      <div style="display:table-cell;width:25%;">
        <span id="fov">FOV 75°</span>
      </div>
      <div style="display:table-cell;">
		<button class="rangebtn" data-action="fovSliderMinus">−</button>
        <input type="range" id="fovSlider" min="5" max="100" step="1" value="75">
        <button class="rangebtn" data-action="fovSliderPlus">+</button>
      </div>
    </div>
  </div>
  <hr>
  <div style="display:table;table-layout:fixed;width:100%;">
    <div style="display:table-row;">
      <div style="display:table-cell;">
        <button class="btnDir" id="btnGauche">←</button>
      </div>
      <div style="display:table-cell;">
        <button class="btnDir" id="btnDroite">→</button>
      </div>
      <div style="display:table-cell;">
        <button class="btnDir" id="btnHaut">↑</button>
      </div>
      <div style="display:table-cell;">
        <button class="btnDir" id="btnBas">↓</button>
      </div>
    </div>
  </div>
  <div style="display:table;table-layout:fixed;width:100%;">
    <div style="display:table-row;">
      <div style="display:table-cell;">
        <button id="btnReset" data-action="resetPhoto360">Reset</button>
      </div>
      <div style="display:table-cell;">
        <button id="btnRotation" data-action="toggleAutoRotation">Auto</button>
      </div>
    </div>
  </div>
  <hr>
  <span id="statut">Texture de démonstration</span>
  <span id="erreur"></span>
  <hr>
  <button data-action="closePopup">Fermer</button>
</div>
<div id="depot"><span>Relâchez pour charger la photo 360°</span></div>
<script src="outils.js"></script>
<script src="popup.js"></script>
<script src="multitouch.js"></script>
<script>
/* MENU */
function openMenuPopup() {
  var container = document.getElementById("popupMenuContent");
  openPopupMenu(container);
}
/* DOM */
var canvas = document.getElementById("scene");
var ctx = canvas.getContext("2d", {
  alpha: false
});
ctx.imageSmoothingEnabled = true;
var statut = document.getElementById("statut");
var fovAff = document.getElementById("fov");
var depot = document.getElementById("depot");
var erreur = document.getElementById("erreur");
var btnRot = document.getElementById("btnRotation");
var btnReset = document.getElementById("btnReset");
var fileinput = document.getElementById("fileinput");
var fovSlider = document.getElementById("fovSlider");
var btnGauche = document.getElementById("btnGauche");
var btnDroite = document.getElementById("btnDroite");
var btnHaut = document.getElementById("btnHaut");
var btnBas = document.getElementById("btnBas");
/* CAMÉRA */
var yaw = 0;
var pitch = 0;
var fov = 75;
var FOV_MIN = 5;
var FOV_MAX = 100;
var autoRotation = false;
var vitesseX = 0;
var vitesseY = 0;
var saisie = false;
var interactionTemporaire360 = false;
var timerInteraction360 = null;
var DUREE_INTERACTION360 = 180;
var touches = {
  gauche: false,
  droite: false,
  haut: false,
  bas: false
};
/* IMAGE */
var imageSourceOriginale = null;
var nomFichierActuel = "";
// PYRAMIDE : copies de l'image pré-réduites (mipmaps maison). Le rendu pioche dans le plus petit niveau dont la bande visible couvre encore l'écran : on n'échantillonne jamais plus de pixels source qu'il n'y a de pixels à l'écran.
var pyramide360 = [];
var echellePyramide360 = 1;
function construirePyramide360(image) {
  pyramide360 = [image];
  var w = image.width || image.naturalWidth;
  var h = image.height || image.naturalHeight;
  var source = image;
  // Niveaux /2 jusqu'à 4 niveaux max, pas sous 2048 px.
  while (w >= 2048 && pyramide360.length < 4) {
    w = Math.floor(w / 2);
    h = Math.floor(h / 2);
    var c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    c.getContext("2d").drawImage(source, 0, 0, w, h);
    pyramide360.push(c);
    source = c;
  }
}
// Plus petit niveau tel que largeurNiveau >= largeurEcran * 360 / fovHorizontal. (Le fov du programme est VERTICAL : focal est calculé sur la hauteur, on retrouve donc le fov horizontal réel via l'aspect.)
function choisirNiveauPyramide360(largeurEcran, hauteurEcran) {
  if (pyramide360.length === 0) {
    return -1;
  }
  var t = Math.tan(fov * Math.PI / 360) * (largeurEcran / Math.max(1, hauteurEcran));
  var fovH = 2 * Math.atan(t) * 180 / Math.PI;
  var besoin = largeurEcran * 360 / Math.max(1, fovH);
  var i;
  var meilleur = 0;
  for (i = 0; i < pyramide360.length; i++) {
    var img = pyramide360[i];
    var w = img.width || img.naturalWidth;
    if (w >= besoin) {
      meilleur = i;
    } else {
      break;
    }
  }
  return meilleur;
}
/* DIRTY FLAG */
var sale = true;
// QUALITÉS DE RENDU Pendant une interaction on privilégie la fluidité. Au repos, le système peut remonter progressivement vers une qualité supérieure.
var QUALITES_360 = [
  { lon: 32,  lat: 16 },
  { lon: 48,  lat: 32 },
  { lon: 64,  lat: 48 },
  { lon: 96, lat: 64 },
  { lon: 128, lat: 96 }
];
var niveauQualite360 = 2;
// Niveau temporaire utilisé pendant les mouvements. On ne détruit pas le niveau normal : on utilise simplement un niveau inférieur pendant l'interaction.
var niveauInteraction360 = 1;
/* ADAPTATION FPS */
var tempsCible360 = 16.0;
var compteurLent360 = 0;
var compteurRapide360 = 0;
var NB_MESURES_AVANT_BAISSE = 3;
var NB_MESURES_AVANT_HAUSSE = 14;
// MAILLAGES Tous les niveaux sont construits une fois puis conservés. Cela évite de reconstruire le maillage à chaque changement de qualité.
var maillages360 = [];
var maillage360 = null;
/* CONSTRUCTION D'UN MAILLAGE */
function construireMaillage360PourQualite(niveau) {
  var q = QUALITES_360[niveau];
  var nx = q.lon;
  var ny = q.lat;
  var largeurLigne = nx + 1;
  var nbSommets = largeurLigne * (ny + 1);
  var nbTriangles = nx * ny * 2;
  var positions = new Float32Array(nbSommets * 3);
  var uv = new Float32Array(nbSommets * 2);
  var uvPixels = new Float32Array(nbSommets * 2);
  var indices = new Uint16Array(nbTriangles * 3);
  var screenX = new Float32Array(nbSommets);
  var screenY = new Float32Array(nbSommets);
  var depth = new Float32Array(nbSommets);
  // Données source par triangle. Elles sont calculées une seule fois.
  var sourceX0 = new Float32Array(nbTriangles);
  var sourceY0 = new Float32Array(nbTriangles);
  var sourceX1 = new Float32Array(nbTriangles);
  var sourceY1 = new Float32Array(nbTriangles);
  var sourceX2 = new Float32Array(nbTriangles);
  var sourceY2 = new Float32Array(nbTriangles);
  var pi = Math.PI;
  var pi2 = Math.PI * 2;
  var i;
  var j;
  var vertex = 0;
  // SOMMETS
  for (j = 0; j <= ny; j++) {
    var v0 = j / ny;
    // Répartition non linéaire : davantage de précision près du haut et du bas.
    var puissance = 1.8;
    var v;
    if (v0 < 0.5) {
      v = 0.5 * Math.pow(v0 * 2, puissance);
    } else {
      v = 1 - 0.5 * Math.pow((1 - v0) * 2, puissance);
    }
    var lat = (0.5 - v) * pi;
    var cl = Math.cos(lat);
    var sl = Math.sin(lat);
    for (i = 0; i <= nx; i++) {
      var u = i / nx;
      var lon = (u - 0.5) * pi2;
      var co = Math.cos(lon);
      var si = Math.sin(lon);
      positions[vertex * 3] = si * cl;
      positions[vertex * 3 + 1] = sl;
      positions[vertex * 3 + 2] = -co * cl;
      uv[vertex * 2] = u;
      uv[vertex * 2 + 1] = v;
      vertex++;
    }
  }
  // INDICES
  var ti = 0;
  var triangle = 0;
  for (j = 0; j < ny; j++) {
    var ligne = j * largeurLigne;
    var ligneSuivante = ligne + largeurLigne;
    for (i = 0; i < nx; i++) {
      var a = ligne + i;
      var b = a + 1;
      var c = ligneSuivante + i;
      var d = c + 1;
      // Triangle 1
      indices[ti++] = a;
      indices[ti++] = b;
      indices[ti++] = c;
      // Triangle 2
      indices[ti++] = b;
      indices[ti++] = d;
      indices[ti++] = c;
      triangle++;
      triangle++;
    }
  }
  // Structure finale
  var mesh = {
    nx: nx,
    ny: ny,
    nbSommets: nbSommets,
    nbTriangles: nbTriangles,
    positions: positions,
    uv: uv,
    uvPixels: uvPixels,
    indices: indices,
    screenX: screenX,
    screenY: screenY,
    depth: depth,
    sourceX0: sourceX0,
    sourceY0: sourceY0,
    sourceX1: sourceX1,
    sourceY1: sourceY1,
    sourceX2: sourceX2,
    sourceY2: sourceY2
  };
  maillages360[niveau] = mesh;
  // Les coordonnées source dépendent de la texture.
  if (imageSourceOriginale) {
    mettreAJourUVPixelsMaillage(mesh);
  }
  return mesh;
}
/* INITIALISATION DES MAILLAGES */
function construireTousLesMaillages360() {
  var i;
  for (i = 0; i < QUALITES_360.length; i++) {
    construireMaillage360PourQualite(i);
  }
  maillage360 = maillages360[niveauQualite360];
}
/* UV PIXELS */
function mettreAJourUVPixelsMaillage(mesh) {
  if (!mesh || !imageSourceOriginale) {
    return;
  }
  var uv = mesh.uv;
  var uvPixels = mesh.uvPixels;
  var iw = imageSourceOriginale.width;
  var ih = imageSourceOriginale.height;
  var i;
  var n = mesh.nbSommets;
  for (i = 0; i < n; i++) {
    uvPixels[i * 2] = uv[i * 2] * iw;
    uvPixels[i * 2 + 1] = uv[i * 2 + 1] * ih;
  }
  // Pré-calcul des coordonnées source par triangle.
  var indices = mesh.indices;
  var sx0 = mesh.sourceX0;
  var sy0 = mesh.sourceY0;
  var sx1 = mesh.sourceX1;
  var sy1 = mesh.sourceY1;
  var sx2 = mesh.sourceX2;
  var sy2 = mesh.sourceY2;
  var t;
  for (t = 0; t < mesh.nbTriangles; t++) {
    var ii = t * 3;
    var i0 = indices[ii];
    var i1 = indices[ii + 1];
    var i2 = indices[ii + 2];
    sx0[t] = uvPixels[i0 * 2];
    sy0[t] = uvPixels[i0 * 2 + 1];
    sx1[t] = uvPixels[i1 * 2];
    sy1[t] = uvPixels[i1 * 2 + 1];
    sx2[t] = uvPixels[i2 * 2];
    sy2[t] = uvPixels[i2 * 2 + 1];
  }
}
/* TEXTURE */
function definirTexture360(image) {
  imageSourceOriginale = image;
  var i;
  for (i = 0; i < maillages360.length; i++) {
    mettreAJourUVPixelsMaillage(maillages360[i]);
  }
  maillage360 = obtenirMaillageActuel();
  sale = true;
}
/* MAILLAGE ACTUEL */
function obtenirNiveauRendu() {
  // Pendant la saisie : on privilégie immédiatement la fluidité.
  if (saisie) {
    return Math.min(niveauQualite360, niveauInteraction360);
  }
  // Pendant l'inertie, on reste légèrement plus prudent qu'à l'arrêt complet.
  if (
    vitesseX !== 0 || vitesseY !== 0
  ) {
    return Math.min(niveauQualite360, Math.max(0, niveauInteraction360 + 1));
  }
  return niveauQualite360;
}
function obtenirMaillageActuel() {
  var niveau = obtenirNiveauRendu();
  if (!maillages360[niveau]) {
    construireMaillage360PourQualite(niveau);
  }
  return maillages360[niveau];
}
/* QUALITÉ ADAPTATIVE */
function ajusterQualite360(tempsMs) {
  // Très lent : on descend rapidement.
  if (tempsMs > 21) {
    compteurLent360++;
    compteurRapide360 = 0;
    if (
      compteurLent360 >= NB_MESURES_AVANT_BAISSE &&  niveauQualite360 > 0
    ) {
      niveauQualite360--;
      compteurLent360 = 0;
      maillage360 = obtenirMaillageActuel();
      sale = true;
    }
    return;
  }
  // Rapide : on remonte lentement.
  if (tempsMs < 10) {
    compteurRapide360++;
    compteurLent360 = 0;
    if (
      compteurRapide360 >= NB_MESURES_AVANT_HAUSSE && niveauQualite360 < QUALITES_360.length - 1
    ) {
      niveauQualite360++;
      compteurRapide360 = 0;
      maillage360 = obtenirMaillageActuel();
      sale = true;
    }
    return;
  }
  // Zone stable.
  compteurLent360 = 0;
  compteurRapide360 = 0;
}
/* PITCH */
function bornerPitch(p) {
  if (p < -1.55) {
    return -1.55;
  }
  if (p > 1.55) {
    return 1.55;
  }
  return p;
}
// RENDU D'UN TRIANGLE save/restore reste nécessaire ici car Canvas 2D ne permet pas de retirer un clip une fois celui-ci appliqué. On ne fait donc aucun save/restore ailleurs.
function dessinerTriangleOptimise(image, s0x, s0y, s1x, s1y, s2x, s2y, d0x, d0y, d1x, d1y, d2x, d2y) {
  var sux = s1x - s0x;
  var suy = s1y - s0y;
  var svx = s2x - s0x;
  var svy = s2y - s0y;
  var det = sux * svy - svx * suy;
  if (
    det > -0.000001 && det < 0.000001
  ) {
    return;
  }
  var dux = d1x - d0x;
  var duy = d1y - d0y;
  var dvx = d2x - d0x;
  var dvy = d2y - d0y;
  // Transformation affine.
  var a = (dux * svy - dvx * suy) / det;
  var c = (dvx * sux - dux * svx) / det;
  var b = (duy * svy - dvy * suy) / det;
  var d = (dvy * sux - duy * svx) / det;
  var e = d0x - a * s0x - c * s0y;
  var f = d0y - b * s0x - d * s0y;
  // Chevauchement volontaire des triangles pour supprimer complètement les micro-interstices noirs.
  var cx = (d0x + d1x + d2x) / 3;
  var cy = (d0y + d1y + d2y) / 3;
  var dx0 = d0x - cx;
  var dy0 = d0y - cy;
  var dx1 = d1x - cx;
  var dy1 = d1y - cy;
  var dx2 = d2x - cx;
  var dy2 = d2y - cy;
  // Plus cette valeur est grande, plus les triangles se recouvrent.
  var expansion = 0.06;
  var e0x = d0x + dx0 * expansion;
  var e0y = d0y + dy0 * expansion;
  var e1x = d1x + dx1 * expansion;
  var e1y = d1y + dy1 * expansion;
  var e2x = d2x + dx2 * expansion;
  var e2y = d2y + dy2 * expansion;
  // Clip + texture.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(e0x, e0y);
  ctx.lineTo(e1x, e1y);
  ctx.lineTo(e2x, e2y);
  ctx.closePath();
  ctx.clip();
  ctx.setTransform(a, b, c, d, e, f);
  ctx.drawImage(image, 0, 0);
  ctx.restore();
}
/* RENDU PRINCIPAL */
function maintenant() {
  if (window.performance && typeof window.performance.now === "function") {
    return window.performance.now();
  }
  return new Date().getTime();
}
function dessinerPhoto360() {
  if (!imageSourceOriginale) {
    return;
  }
  var debutRendu = maintenant();
  var largeur = canvas.width;
  var hauteur = canvas.height;
  // Fond.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, largeur, hauteur);
  // Caméra. Tout est calculé directement dans des scalaires.
  var cyaw = Math.cos(yaw);
  var syaw = Math.sin(yaw);
  var cpitch = Math.cos(pitch);
  var spitch = Math.sin(pitch);
  // RIGHT
  var rx = cyaw;
  var rz = syaw;
  // UP
  var ux = -syaw * spitch;
  var uy = cpitch;
  var uz = cyaw * spitch;
  // FORWARD
  var fx = syaw * cpitch;
  var fy = spitch;
  var fz = -cyaw * cpitch;
  // Projection.
  var focal = (hauteur * 0.5) / Math.tan(fov * Math.PI / 360);
  var centreX = largeur * 0.5;
  var centreY = hauteur * 0.5;
  // Niveau de pyramide adapté au FOV et à la taille du canvas.
  var niveauPyr = choisirNiveauPyramide360(largeur, hauteur);
  var imageRendu = (niveauPyr >= 0) ? pyramide360[niveauPyr] : imageSourceOriginale;
  var wOriginal = imageSourceOriginale.width || imageSourceOriginale.naturalWidth;
  var wRendu = imageRendu.width || imageRendu.naturalWidth;
  echellePyramide360 = wRendu / wOriginal;
  // Maillage.
  var mesh = obtenirMaillageActuel();
  maillage360 = mesh;
  var positions = mesh.positions;
  var screenX = mesh.screenX;
  var screenY = mesh.screenY;
  var depth = mesh.depth;
  var indices = mesh.indices;
  // Projection des sommets.
  var i;
  for (
    i = 0;
    i < mesh.nbSommets;
    i++
  ) {
    var p = i * 3;
    var px = positions[p];
    var py = positions[p + 1];
    var pz = positions[p + 2];
    // Profondeur.
    var z = px * fx + py * fy + pz * fz;
    depth[i] = z;
    // Derrière la caméra.
    if (z <= 0.0001) {
      screenX[i] = 0;
      screenY[i] = 0;
      continue;
    }
    // Coordonnées caméra.
    var x = px * rx + pz * rz;
    var y = px * ux + py * uy + pz * uz;
    screenX[i] = centreX + (x / z) * focal;
    screenY[i] = centreY - (y / z) * focal;
  }
  // Triangles.
  var sx0 = mesh.sourceX0;
  var sy0 = mesh.sourceY0;
  var sx1 = mesh.sourceX1;
  var sy1 = mesh.sourceY1;
  var sx2 = mesh.sourceX2;
  var sy2 = mesh.sourceY2;
  var t;
  for (
    t = 0;
    t < mesh.nbTriangles;
    t++
  ) {
    var ii = t * 3;
    var i0 = indices[ii];
    var i1 = indices[ii + 1];
    var i2 = indices[ii + 2];
    //  Horizon
    var z0 = depth[i0];
    var z1 = depth[i1];
    var z2 = depth[i2];
    var Z_MIN = 0.08;
    if (z0 <= Z_MIN || z1 <= Z_MIN || z2 <= Z_MIN) {
      continue;
    }
    // Coordonnées écran.
    var d0x = screenX[i0];
    var d0y = screenY[i0];
    var d1x = screenX[i1];
    var d1y = screenY[i1];
    var d2x = screenX[i2];
    var d2y = screenY[i2];
    // Culling écran : triangle entièrement hors du canvas.
    var minX = Math.min(d0x, d1x, d2x);
    var maxX = Math.max(d0x, d1x, d2x);
    var minY = Math.min(d0y, d1y, d2y);
    var maxY = Math.max(d0y, d1y, d2y);
    if (maxX < 0 || minX > largeur || maxY < 0 || minY > hauteur) {
      continue;
    }
    // Triangle source (repère image d'origine), mis à l'échelle du niveau choisi.
    dessinerTriangleOptimise(imageRendu,
      sx0[t] * echellePyramide360, sy0[t] * echellePyramide360,
      sx1[t] * echellePyramide360, sy1[t] * echellePyramide360,
      sx2[t] * echellePyramide360, sy2[t] * echellePyramide360,
      d0x, d0y, d1x, d1y, d2x, d2y);
  }
  // Transformation normale.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // Adaptation qualité.
  var tempsRendu = maintenant() - debutRendu;
  ajusterQualite360(tempsRendu);
}
/* REDIMENSIONNEMENT */
function interactionActive360() {
  return (saisie || vitesseX !== 0 || vitesseY !== 0 || autoRotation || interactionTemporaire360);
}
function activerInteractionTemporaire360() {
  interactionTemporaire360 = true;
  if (timerInteraction360 !== null) {
    clearTimeout(timerInteraction360);
  }
  timerInteraction360 = setTimeout(function() {
    interactionTemporaire360 = false;
    timerInteraction360 = null;
    sale = true;
  }, DUREE_INTERACTION360);
  sale = true;
}
function redimensionner() {
  // Plafond volontairement plus bas. Le nombre de pixels est souvent plus important que le nombre de triangles.
  var dpr = window.devicePixelRatio || 1;
  dpr = Math.min(dpr, 1.25);
  // Pendant une interaction on peut réduire légèrement la résolution interne. Le CSS reste évidemment en 100%.
  if (interactionActive360()) {
    dpr *= 0.7;
  }
  var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (
    canvas.width !== w || canvas.height !== h
  ) {
    canvas.width = w;
    canvas.height = h;
    sale = true;
    return true;
  }
  return false;
}
/* BOUCLE */
var dernierTemps = 0;
var dernierFovAffiche = -1;
function boucle(ts) {
  var dt = dernierTemps ? (ts - dernierTemps) / 1000 : 0;
  dernierTemps = ts;
  // Évite les énormes sauts après changement d'onglet ou mise en veille.
  if (dt > 0.1) {
    dt = 0.1;
  }
  var interactionAvant = interactionActive360();
  // INERTIE
  if (!saisie) {
    if (vitesseX !== 0 || vitesseY !== 0) {
      yaw += vitesseX;
      pitch = bornerPitch(pitch + vitesseY);
      vitesseX *= 0.92;
      vitesseY *= 0.92;
      if (Math.abs(vitesseX) < 0.00005) {
        vitesseX = 0;
      }
      if (Math.abs(vitesseY) < 0.00005) {
        vitesseY = 0;
      }
      sale = true;
    }
  }
  // ROTATION AUTOMATIQUE
  if (autoRotation && !saisie) {
    yaw += 0.15 * dt;
    sale = true;
  }
  // Si l'interaction vient de se terminer, on force un rendu pleine résolution.
  var interactionApres = interactionActive360();
  if (interactionAvant && !interactionApres) {
    sale = true;
  }
  // TOUCHES / BOUTONS
  var mx = (touches.droite ? 1 : 0) - (touches.gauche ? 1 : 0);
  var my = (touches.haut ? 1 : 0) - (touches.bas ? 1 : 0);
  if (mx !== 0 || my !== 0) {
    var pas = 1.3 * (fov / 75);
    var longueur =
      Math.sqrt(mx * mx + my * my);
    yaw += (mx / longueur) * pas * dt;
    pitch = bornerPitch(pitch + (my / longueur) * pas * dt);
    sale = true;
  }
  pitch = bornerPitch(pitch);
  // REDIMENSIONNEMENT
  redimensionner();
  // RENDU
  if (sale && imageSourceOriginale) {
    dessinerPhoto360();
    sale = false;
  }
  // UI FOV. On ne modifie le DOM que si la valeur affichée a réellement changé.
  var fovEntier = Math.round(fov);
  if (
    fovEntier !== dernierFovAffiche
  ) {
    dernierFovAffiche = fovEntier;
    fovAff.textContent = "FOV " + fovEntier + "°";
    if (
      parseInt(fovSlider.value, 10) !== fovEntier
    ) {
      fovSlider.value = fovEntier;
    }
  }
  requestFrame(boucle);
}
/* INITIALISATION */
construireTousLesMaillages360();
/* TEXTURE DE DÉMONSTRATION */
function textureDemonstration() {
  var c = document.createElement("canvas");
  c.width = 2048;
  c.height = 1024;
  var g = c.getContext("2d");
  // CIEL
  var ciel = g.createLinearGradient(0, 0, 0, 512);
  ciel.addColorStop(0, "#0b1e4d");
  ciel.addColorStop(0.45, "#3f6fb5");
  ciel.addColorStop(0.90, "#a8cbe8");
  ciel.addColorStop(1, "#dfeaf2");
  g.fillStyle = ciel;
  g.fillRect(0, 0, 2048, 512);
  // SOLEIL
  var soleil = g.createRadialGradient(1550, 170, 10, 1550, 170, 120);
  soleil.addColorStop(0, "rgba(255,244,200,1)");
  soleil.addColorStop(1, "rgba(255,244,200,0)");
  g.fillStyle = soleil;
  g.fillRect(1400, 20, 300, 300);
  // SOL
  var sol = g.createLinearGradient(0, 512, 0, 1024);
  sol.addColorStop(0, "#8fae6a");
  sol.addColorStop(0.25, "#5f8b46");
  sol.addColorStop(1, "#2e4a26");
  g.fillStyle = sol;
  g.fillRect(0, 512, 2048, 512);
  // GRILLE LONGITUDE
  var i;
  g.strokeStyle = "rgba(255,255,255,0.28)";
  g.lineWidth = 2;
  for (
    i = 0;
    i <= 24;
    i++
  ) {
    var x = Math.round(i * 2048 / 24);
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, 1024);
    g.stroke();
  }
  // GRILLE LATITUDE
  for (
    i = 1;
    i < 12;
    i++
  ) {
    var y = Math.round(i * 1024 / 12);
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(2048, y);
    g.stroke();
  }
  // ÉQUATEUR
  g.strokeStyle = "rgba(255,255,255,0.55)";
  g.beginPath();
  g.moveTo(0, 512);
  g.lineTo(2048, 512);
  g.stroke();
  // MÉRIDIEN CENTRAL
  g.beginPath();
  g.moveTo(1024, 0);
  g.lineTo(1024, 1024);
  g.stroke();
  // POINTS CARDINAUX
  g.textAlign = "center";
  g.textBaseline = "middle";
  var card = [
    { l: "N", x: 1024 },
    { l: "E", x: 1536 },
    { l: "S", x: 2048 },
    { l: "S", x: 0 },
    { l: "O", x: 512 }
  ];
  for (
    i = 0;
    i < card.length;
    i++
  ) {
    g.fillStyle = "rgba(255,255,255,0.92)";
    g.font = "bold 90px 'Segoe UI', sans-serif";
    g.fillText(card[i].l, card[i].x, 300);
    g.beginPath();
    g.arc(card[i].x, 300, 60, 0, Math.PI * 2);
    g.strokeStyle = "rgba(255,255,255,0.8)";
    g.lineWidth = 4;
    g.stroke();
  }
  // TEXTE DE TEST
  g.font = "bold 48px 'Segoe UI', sans-serif";
  g.fillStyle = "rgba(255,255,255,0.85)";
  g.fillText("← Test de texture 360° →", 1024, 860);
  return c;
}
/* CHARGEMENT IMAGE */
function chargerFichier(f) {
  if (!f) {
    return;
  }
  var lecteur = new FileReader();
  lecteur.onload =
    function(e) {
      var img =
        new Image();
      img.onload =
        function() {
          definirTexture360(img);
          construirePyramide360(img);
          nomFichierActuel = f.name;
          statut.textContent = f.name + " - " + img.naturalWidth + "x" + img.naturalHeight;
          masquerErreur();
          yaw = 0;
          pitch = 0;
          vitesseX = 0;
          vitesseY = 0;
          sale = true;
        };
      img.onerror =
        function() {
          afficherErreur("Impossible de décoder cette image.");
        };
      img.src = e.target.result;
    };
  lecteur.onerror =
    function() {
      afficherErreur("Lecture du fichier impossible.");
    };
  lecteur.readAsDataURL(f);
}
/* INTERACTION SOURIS */
var dernierX = 0;
var dernierY = 0;
var pincement = null;
function commencer(x, y) {
  saisie = true;
  dernierX = x;
  dernierY = y;
  vitesseX = 0;
  vitesseY = 0;
  canvas.className = "saisie";
  // On passe immédiatement en qualité d'interaction.
  sale = true;
}
function deplacer(x, y) {
  var dx = x - dernierX;
  var dy = y - dernierY;
  dernierX = x;
  dernierY = y;
  var k = (fov * Math.PI / 180) / Math.max(1, canvas.clientWidth);
  yaw -= dx * k;
  pitch = bornerPitch(pitch + dy * k);
  vitesseX = -dx * k;
  vitesseY = dy * k;
  sale = true;
}
function terminer() {
  saisie = false;
  canvas.className = "";
  sale = true;
}
/* SOURIS */
canvas.addEventListener("mousedown",
  function(e) {
    e.preventDefault();
    commencer(e.clientX, e.clientY);
  },
  false
);
window.addEventListener("mousemove",
  function(e) {
    if (saisie) {
      deplacer(e.clientX, e.clientY);
    }
  },
  false
);
window.addEventListener("mouseup", terminer, false);
/* TACTILE */
canvas.addEventListener("touchstart",
  function(e) {
    if (
      e.touches.length === 1
    ) {
      commencer(e.touches[0].clientX, e.touches[0].clientY);
    } else if (
      e.touches.length === 2
    ) {
      pincement = distanceTouches(e.touches);
    }
    e.preventDefault();
  },
  {
    passive:false
  }
);
canvas.addEventListener("touchmove",
  function(e) {
    if (e.touches.length === 1 && saisie) {
      deplacer(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && pincement !== null) {
      var d = distanceTouches(e.touches);
      if (d > 0) {
        fov = fov * (pincement / d);
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        pincement = d;
        sale = true;
      }
    }
    e.preventDefault();
  },
  {
    passive:false
  }
);
canvas.addEventListener("touchend",
  function(e) {
    if (e.touches.length === 0) {
      terminer();
      pincement = null;
    } else if (e.touches.length === 1) {
      saisie = false;
      commencer(e.touches[0].clientX, e.touches[0].clientY);
    }
    e.preventDefault();
  },
  {
    passive:false
  }
);
function distanceTouches(t) {
  var dx = t[0].clientX - t[1].clientX;
  var dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
/* MOLETTE */
function molette(e) {
  var d = e.deltaY || e.wheelDelta || 0;
  if (d > 0) {
    fov += 5;
  } else if (d < 0) {
    fov -= 5;
  }
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  activerInteractionTemporaire360();
  sale = true;
  e.preventDefault();
}
canvas.addEventListener("wheel", molette,
  {
    passive:false
  }
);
/* CLAVIER */
window.addEventListener("keydown",
  function(e) {
    // Ctrl + / Ctrl -
    if (e.ctrlKey) {
      if (
        e.key === "+" || e.key === "="
      ) {
        fov -= 5;
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        activerInteractionTemporaire360();
        sale = true;
        e.preventDefault();
        return;
      }
      if (e.key === "-" || e.key === "_") {
        fov += 5;
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        activerInteractionTemporaire360();
        sale = true;
        e.preventDefault();
        return;
      }
    }
    // Flèches
    if (e.keyCode === 37) {
      touches.gauche = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 39) {
      touches.droite = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 38) {
      touches.haut = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 40) {
      touches.bas = true;
      activerInteractionTemporaire360();
    } else {
      return;
    }
    e.preventDefault();
  },
  false
);
window.addEventListener("keyup",
  function(e) {
    if (e.keyCode === 37) {
      touches.gauche = false;
    } else if (e.keyCode === 39) {
      touches.droite = false;
    } else if (e.keyCode === 38) {
      touches.haut = false;
    } else if (e.keyCode === 40) {
      touches.bas = false;
    }
  },
  false
);
/* FOV */
fovSlider.addEventListener("input",
  function() {
    fov = parseInt(fovSlider.value, 10) || 75;
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
    activerInteractionTemporaire360();
    sale = true;
  },
  false
);
/* BOUTONS DIRECTIONNELS */
function boutonMaintenir(btn, cle) {
  function activer() {
    touches[cle] = true;
    activerInteractionTemporaire360();
  }
  function relacher() {
    touches[cle] = false;
  }
  btn.addEventListener("mousedown", activer, false);
  btn.addEventListener("touchstart",
    function(e) {
      e.preventDefault();
      activer();
    },
    {
      passive:false
    }
  );
  btn.addEventListener("mouseleave", relacher, false);
  window.addEventListener("mouseup", relacher, false);
  window.addEventListener("touchend", relacher, false);
  window.addEventListener("touchcancel", relacher, false);
}
boutonMaintenir(btnGauche, "gauche");
boutonMaintenir(btnDroite, "droite");
boutonMaintenir(btnHaut, "haut");
boutonMaintenir(btnBas, "bas");
/* FICHIER */
fileinput.addEventListener("change",
  function() {
    if (fileinput.files && fileinput.files[0]) {
      chargerFichier(fileinput.files[0]);
    }
    fileinput.value = "";
  },
  false
);
/* DRAG & DROP */
window.addEventListener("dragover",
  function(e) {
    e.preventDefault();
    depot.className = "actif";
  },
  false
);
window.addEventListener("dragleave",
  function() {
    depot.className = "";
  }, false);
window.addEventListener(
  "drop",
  function(e) {
    e.preventDefault();
    depot.className = "";
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
      chargerFichier(e.dataTransfer.files[0]);
    }
  },
  false
);
/* BOUTONS */
function toggleAutoRotation() {
  autoRotation = !autoRotation;
  btnRot.className = autoRotation ? "active" : "";
  sale = true;
}
function resetPhoto360() {
  yaw = 0;
  pitch = 0;
  fov = 75;
  vitesseX = 0;
  vitesseY = 0;
  sale = true;
}
/* ERREURS */
function afficherErreur(msg) {
  erreur.textContent = msg;
  erreur.style.display = "block";
  if (
    typeof erreur._timer !== "undefined"
  ) {
    clearTimeout(erreur._timer);
  }
  erreur._timer =
    setTimeout(
      function() {
        masquerErreur();
      },
      5000
    );
}
function masquerErreur() {
  erreur.style.display = "none";
}
/* DÉMARRAGE */
var demo = textureDemonstration();
definirTexture360(demo);
construirePyramide360(demo);
statut.textContent = "Texture de démonstration - " + demo.width + "x" + demo.height;
redimensionner();
var requestFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame ||
  function (callback) {
    return window.setTimeout(function () {
      callback(new Date().getTime());
    }, 16);
  };
requestFrame(boucle);
/* MULTITOUCH EXTERNE */
if (typeof addMultiTouch === "function") {
  addMultiTouch("button,input");
}
</script>
