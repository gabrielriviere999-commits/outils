<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur d'index de recherche</title>
<link rel="stylesheet" href="outils.css">
</head>
<body>
<h2>Générateur d'index de recherche</h2>
<input type="file" id="zipFile">
<textarea wrap="off" id="output"></textarea><br>
<button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier</button>
<script src="outils.js"></script>
<script src="libs/jszip.min.js"></script>
<script>
document.getElementById("zipFile").onchange = function () {
    var file = this.files[0];
    if (!file) return;
    JSZip.loadAsync(file).then(function(zip) {
        var docs = [];
        var promises = [];
        var IGNORE = {"docs.js":1, "search.html":1};
        // var IGNORE_DIRS = {"dossier":1};
        var TEXT = {".html":1, ".txt":1};
        zip.forEach(function(path, entry) {
            // exclure tous les dossiers cachés
            if (path.indexOf("/.") !== -1) return;
            var parts = path.split("/");
            // exclure tous les fichiers cachés
            var name = parts[parts.length - 1];
            if (name.charAt(0) === ".") return;
            // exclure fichiers spécifiques
            if (IGNORE[name]) return;
            // exclure dossiers spécifiques
            // if (IGNORE_DIRS[parts[0]]) return;
            if (entry.dir) return;
            var dot = name.lastIndexOf(".");
            var ext = dot >= 0 ? name.substring(dot).toLowerCase() : "";
            var isText = TEXT[ext];
            (function(entry, path, name, ext, isText){
                promises.push(
                    entry.async("string").then(function(content){
                        if (!isText) {
                            content = "";
                        } else if (ext === ".html") {
                            content = stripTags(content);
                        }
                        var safe = (name + " " + content)
                            .replace(/[\r\n]+/g, " ")
                            .replace(/\\/g, "\\\\")
                            .replace(/"/g, '\\"');
                        docs.push({
                            title: name,
                            url: path,
                            content: safe
                        });
                    })
                );
            })(entry, path, name, ext, isText);
        });
        Promise.all(promises).then(function(){
            docs.sort(function(a,b){
                a = a.title.toLowerCase();
                b = b.title.toLowerCase();
                if (a < b) return -1;
                if (a > b) return 1;
                return 0;
            });
            var out = "var docs = [\n";
            for (var i=0;i<docs.length;i++){
                var d = docs[i];
                var comma = (i < docs.length-1) ? "," : "";
                out += '  {title:"'+d.title+'", url:"'+d.url+'", content:"'+d.content+'"}'+comma+'\n';
            }
            out += "];\n";
            document.getElementById("output").value = out;
        });
    });
};
function stripTags(html){
    html = html.replace(/<style[\s\S]*?<\/style>/gi,"");
    html = html.replace(/<script[\s\S]*?<\/script>/gi,"");
    html = html.replace(/<[^>]+>/g,"");
    return html;
}
</script>
</body>
</html>
