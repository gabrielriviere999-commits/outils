<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélecteur couleur</title>
<link rel="stylesheet" href="outils.css">
<style>
.box {
  padding:10px;
  width:340px;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
}
.input {
  padding:2px;
  width:160px;
}
#preview {
  height:40px;
  margin-bottom:10px;
  width:100%;
}
#sv-area {
  position:relative;
  width:100%;
  padding-top:75%;
  cursor:crosshair;
  margin-bottom:10px;
}
#sv-white,#sv-black {
  position:absolute;
  inset:0;
}
#sv-white{background:linear-gradient(to right, #fff, rgba(255,255,255,0));}
#sv-black{background:linear-gradient(to top, #000, rgba(0,0,0,0));}
#sv-cursor {
  position:absolute;
  width:12px;
  height:12px;
  border:2px solid #fff;
  background:transparent;
  transform:translate(-50%,-50%);
}
.sv-button {width:40px;height:40px;font-size:24px;}
input[type=range] {
  width:100%;
  margin:4px 0;
}
canvas{margin-left:8px;}
</style>
</head>
<body>
<button onclick="openMenuPopup()" class="select">≡</button>
<div id="popupMenuContent" style="display:none"></div>
<button onclick="openSearchPopup()" class="select">Q</button>
<div id="popupSearchContent" style="display:none">
  <input id="search" onkeyup="doSearch()" placeholder="Rechercher...">
  <div id="count" style="margin:4px 0;"></div>
  <div id="results"></div>
</div>
<h2>Sélecteur couleur</h2>
<div class="box border-externe">

    <div id="preview" class="border-interne"></div>

    <div id="sv-area" class="border-interne" tabindex="0">
        <div id="sv-white"></div>
        <div id="sv-black"></div>
        <div id="sv-cursor"></div>
    </div>

<div id="sv-controls">
    <button id="sv-left" class="sv-button" >←</button>
    <button id="sv-right" class="sv-button">→</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <button id="sv-up" class="sv-button">↑</button>
    <button id="sv-down" class="sv-button">↓</button>
</div>

    <label>Teinte (H)</label>
    <input id="h-range" type="range" min="0" max="360" value="0">
    <canvas id="h-bar" width="324" height="12"></canvas><br><br>

    <label><input type="checkbox" id="alpha-toggle">Alpha</label><br>

    <label>Alpha :</label>
    <input id="a-range" type="range" min="0" max="100" value="100"><br>

    <label>Alpha (champ) :</label>
    <input id="alpha-input" class="input" type="number" value="1" min="0" max="1" step="0.01"><br><br>

    <label>HEX :</label>
    <input id="hex-input" class="input" type="text" value="#FF0000FF">
    <button class="copy-btn" data-copy="hex">Copier</button><br>

    <label>RGB :</label>
    <input id="rgb-input" class="input" type="text" value="255,0,0,1">
    <button class="copy-btn" data-copy="rgb">Copier</button><br>

    <label>HSL :</label>
    <input id="hsl-input" class="input" type="text" value="0,100%,50%,1">
    <button class="copy-btn" data-copy="hsl">Copier</button><br>

    <label>HSV :</label>
    <input id="hsv-input" class="input" type="text" value="0,100%,100%,1">
    <button class="copy-btn" data-copy="hsv">Copier</button><br>

</div>
<script src="popup.js"></script>
<script src="docs.js"></script>
<script>
var r=255,g=0,b=0,a=1;
var h=0,s=1,v=1;

var svArea=document.getElementById("sv-area");
var svCursor=document.getElementById("sv-cursor");
var hRange=document.getElementById("h-range");
var aRange=document.getElementById("a-range");
var alphaToggle=document.getElementById("alpha-toggle");
var alphaInput=document.getElementById("alpha-input");

var preview=document.getElementById("preview");

var hexInput=document.getElementById("hex-input");
var rgbInput=document.getElementById("rgb-input");
var hslInput=document.getElementById("hsl-input");
var hsvInput=document.getElementById("hsv-input");

var lockHex=false, lockRgb=false, lockHsl=false, lockHsv=false;

function clamp(v,min,max){return v<min?min:(v>max?max:v);}

function rgbToHex(r,g,b){
    function h2(x){var s=x.toString(16);return s.length===1?"0"+s:s;}
    return "#"+h2(r)+h2(g)+h2(b);
}
function alphaToHex(a){
    var v=Math.round(a*255);
    var s=v.toString(16);
    return s.length===1?"0"+s:s;
}

var _colorCtx = null;

function cssNameToHex(name){
    if(!_colorCtx){
        var c = document.createElement("canvas");
        _colorCtx = c.getContext("2d");
    }

    _colorCtx.fillStyle = "#000000";
    _colorCtx.fillStyle = name;
    var computed = _colorCtx.fillStyle;

    // si le navigateur n'a pas reconnu → reste "#000000"
    if(computed === "#000000" && name.toLowerCase() !== "black"){
        return null;
    }
    return computed; // "#rrggbb"
}

function parseHex(str){
    str = str.trim();

    // --- AJOUT : accepter aussi les hex courts (#abc) ---
    // si ce n'est pas un hex 3, 6 ou 8 → essayer comme nom CSS
    if(
        !/^#?[0-9A-Fa-f]{3}$/.test(str) &&
        !/^#?[0-9A-Fa-f]{6}$/.test(str) &&
        !/^#?[0-9A-Fa-f]{8}$/.test(str)
    ){
        var hexFromName = cssNameToHex(str);
        if(!hexFromName) return null;
        str = hexFromName; // ex: "#ff0000"
    }

    // normalisation
    str = str.toUpperCase();
    if(str.charAt(0)==="#") str = str.substring(1);

    // --- expansion du format court ---
    if(str.length === 3){
        str = str[0]+str[0] + str[1]+str[1] + str[2]+str[2];
    }

    var aLocal = null;
    if(str.length === 8){
        aLocal = parseInt(str.substring(6,8),16);
        str = str.substring(0,6);
    }

    if(!/^[0-9A-F]{6}$/.test(str)) return null;

    return {
        r:parseInt(str.substring(0,2),16),
        g:parseInt(str.substring(2,4),16),
        b:parseInt(str.substring(4,6),16),
        a:aLocal
    };
}

function parseRgb(str){
    str = str.trim();
    // essayer comme nom CSS
    var hex = cssNameToHex(str);
    if(hex){
        var c = parseHex(hex);
        return { r:c.r, g:c.g, b:c.b, a:c.a };
    }

    var p=str.split(",");
    if(p.length<3) return null;
    var r=parseInt(p[0],10), g=parseInt(p[1],10), b=parseInt(p[2],10);
    if(isNaN(r)||isNaN(g)||isNaN(b)) return null;
    var aLocal=null;
    if(p.length>=4){
        var av=parseFloat(p[3]);
        if(!isNaN(av)) aLocal=av;
    }
    return {r:clamp(r,0,255), g:clamp(g,0,255), b:clamp(b,0,255), a:aLocal};
}

function parseHsl(str){
    str = str.trim();
    // essayer comme nom CSS
    var hex = cssNameToHex(str);
    if(hex){
        var c = parseHex(hex);
        var hsl = rgbToHsl(c.r, c.g, c.b);
        return { h:hsl.h, s:hsl.s, l:hsl.l, a:c.a };
    }

    var p=str.split(",");
    if(p.length<3) return null;
    var h=parseInt(p[0],10), s=parseInt(p[1],10), l=parseInt(p[2],10);
    if(isNaN(h)||isNaN(s)||isNaN(l)) return null;
    var aLocal=null;
    if(p.length>=4){
        var av=parseFloat(p[3]);
        if(!isNaN(av)) aLocal=av;
    }
    return {h:clamp(h,0,360), s:clamp(s,0,100), l:clamp(l,0,100), a:aLocal};
}

function parseHsv(str){
    str = str.trim();
    // essayer comme nom CSS
    var hex = cssNameToHex(str);
    if(hex){
        var c = parseHex(hex);
        var hsv = rgbToHsv(c.r, c.g, c.b);
        return { h:hsv.h, s:hsv.s, v:hsv.v, a:c.a };
    }

    var p=str.split(",");
    if(p.length<3) return null;
    var h=parseInt(p[0],10), s=parseInt(p[1],10), v=parseInt(p[2],10);
    if(isNaN(h)||isNaN(s)||isNaN(v)) return null;
    var aLocal=null;
    if(p.length>=4){
        var av=parseFloat(p[3]);
        if(!isNaN(av)) aLocal=av;
    }
    return {h:clamp(h,0,360), s:clamp(s,0,100), v:clamp(v,0,100), a:aLocal};
}

function hsvToRgb(h,s,v){
    s/=100; v/=100;
    var c=v*s;
    var x=c*(1-Math.abs((h/60)%2-1));
    var m=v-c;
    var r1,g1,b1;
    if(h<60){r1=c;g1=x;b1=0;}
    else if(h<120){r1=x;g1=c;b1=0;}
    else if(h<180){r1=0;g1=c;b1=x;}
    else if(h<240){r1=0;g1=x;b1=c;}
    else if(h<300){r1=x;g1=0;b1=c;}
    else{r1=c;g1=0;b1=x;}
    return {
        r:Math.round((r1+m)*255),
        g:Math.round((g1+m)*255),
        b:Math.round((b1+m)*255)
    };
}

function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    var max=Math.max(r,g,b), min=Math.min(r,g,b);
    var h,s,v=max;
    var d=max-min;
    s=max===0?0:d/max;
    if(max===min) h=0;
    else{
        switch(max){
            case r: h=(g-b)/d+(g<b?6:0); break;
            case g: h=(b-r)/d+2; break;
            case b: h=(r-g)/d+4; break;
        }
        h*=60;
    }
    return {h:Math.round(h), s:Math.round(s*100), v:Math.round(v*100)};
}

function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    var max=Math.max(r,g,b), min=Math.min(r,g,b);
    var h,s,l=(max+min)/2;
    if(max===min){h=s=0;}
    else{
        var d=max-min;
        s=l>0.5?d/(2-max-min):d/(max+min);
        switch(max){
            case r: h=(g-b)/d+(g<b?6:0); break;
            case g: h=(b-r)/d+2; break;
            case b: h=(r-g)/d+4; break;
        }
        h*=60;
    }
    return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)};
}

function saveState(){
    localStorage.setItem("picker_r", r);
    localStorage.setItem("picker_g", g);
    localStorage.setItem("picker_b", b);
    localStorage.setItem("picker_a", a);

    localStorage.setItem("picker_h", h);
    localStorage.setItem("picker_s", s);
    localStorage.setItem("picker_v", v);

    localStorage.setItem("picker_alpha_on", alphaToggle.checked ? "1" : "0");

    localStorage.setItem("picker_hex", hexInput.value);
    localStorage.setItem("picker_rgb", rgbInput.value);
    localStorage.setItem("picker_hsl", hslInput.value);
    localStorage.setItem("picker_hsv", hsvInput.value);
}

if(localStorage.getItem("picker_r") !== null){
    r = parseInt(localStorage.getItem("picker_r"),10);
    g = parseInt(localStorage.getItem("picker_g"),10);
    b = parseInt(localStorage.getItem("picker_b"),10);
    a = parseFloat(localStorage.getItem("picker_a"));

    h = parseFloat(localStorage.getItem("picker_h"));
    s = parseFloat(localStorage.getItem("picker_s"));
    v = parseFloat(localStorage.getItem("picker_v"));

    alphaToggle.checked = localStorage.getItem("picker_alpha_on") === "1";

    hexInput.value = localStorage.getItem("picker_hex");
    rgbInput.value = localStorage.getItem("picker_rgb");
    hslInput.value = localStorage.getItem("picker_hsl");
    hsvInput.value = localStorage.getItem("picker_hsv");
}

function updateUI(){
    var alphaOn=alphaToggle.checked;
    var alphaValue=alphaOn?a:1;

    preview.style.background="rgba("+r+","+g+","+b+","+alphaValue+")";

    var hsv=rgbToHsv(r,g,b);

    var pure=hsvToRgb(h,100,100);
    svArea.style.background="rgb("+pure.r+","+pure.g+","+pure.b+")";

    var rect=svArea.getBoundingClientRect();
    svCursor.style.left=(s*rect.width)+"px";
    svCursor.style.top=((1-v)*rect.height)+"px";

    hRange.value=h;
    alphaInput.value=a;
    aRange.value=Math.round(a*100);

    var hex=rgbToHex(r,g,b);
    var aHex=alphaToHex(a);

    if(!lockHex){
        hexInput.value = alphaOn ? hex+aHex : hex;
    }

    if(!lockRgb){
        if(alphaOn)
            rgbInput.value = r+","+g+","+b+","+a;
        else
            rgbInput.value = r+","+g+","+b;
    }

    var hsl=rgbToHsl(r,g,b);
    if(!lockHsl){
        if(alphaOn)
            hslInput.value = hsl.h+","+hsl.s+"%,"+hsl.l+"%,"+a;
        else
            hslInput.value = hsl.h+","+hsl.s+"%,"+hsl.l+"%";
    }

    if(!lockHsv){
        if(alphaOn)
            hsvInput.value = hsv.h+","+hsv.s+"%,"+hsv.v+"%,"+a;
        else
            hsvInput.value = hsv.h+","+hsv.s+"%,"+hsv.v+"%";
    }
    saveState();
}

var dragging=false;

svArea.onmousedown=function(e){dragging=true;moveSV(e);};
document.onmouseup=function(){dragging=false;};
document.onmousemove=function(e){if(dragging) moveSV(e);};

function moveSVFromPoint(clientX, clientY){
    var rct = svArea.getBoundingClientRect();
    var x = clamp(clientX - rct.left, 0, rct.width);
    var y = clamp(clientY - rct.top, 0, rct.height);
    s = x / rct.width;
    v = 1 - (y / rct.height);
    var rgb = hsvToRgb(h, s * 100, v * 100);
    r = rgb.r; g = rgb.g; b = rgb.b;
    updateUI();
}

function moveSV(e){
    moveSVFromPoint(e.clientX, e.clientY);
}

svArea.addEventListener("touchstart", function(e){
    e.preventDefault();
    dragging = true;
    var t = e.touches[0];
    moveSVFromPoint(t.clientX, t.clientY);
});

document.addEventListener("touchmove", function(e){
    if(!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    moveSVFromPoint(t.clientX, t.clientY);
});

document.addEventListener("touchend", function(){
    dragging = false;
});

// --- Système multi-touches pour le carré SV ---
var keys = {};

// Enregistrer les touches pressées
document.addEventListener("keydown", function(e){
    keys[e.key] = true;
});

// Enregistrer les touches relâchées
document.addEventListener("keyup", function(e){
    keys[e.key] = false;
});

// Boucle d'animation
function svKeyboardLoop(){
    // Ne bouger que si le carré a le focus
    if (document.activeElement === svArea){

        var step = 0.001;
        var changed = false;

        // Gauche
        if(keys["ArrowLeft"]){
            s = clamp(s - step, 0, 1);
            changed = true;
        }

        // Droite
        if(keys["ArrowRight"]){
            s = clamp(s + step, 0, 1);
            changed = true;
        }

        // Haut
        if(keys["ArrowUp"]){
            v = clamp(v + step, 0, 1);
            changed = true;
        }

        // Bas
        if(keys["ArrowDown"]){
            v = clamp(v - step, 0, 1);
            changed = true;
        }

        if(changed){
            var rgb = hsvToRgb(h, s * 100, v * 100);
            r = rgb.r;
            g = rgb.g;
            b = rgb.b;
            updateUI();
        }
    }

    requestAnimationFrame(svKeyboardLoop);
}

// Démarrer la boucle
svKeyboardLoop();

var step = 0.005;
var holdIntervals = {};

// moteur unique
function moveSVBy(dx, dy){
    s = clamp(s + dx, 0, 1);
    v = clamp(v + dy, 0, 1);

    var rgb = hsvToRgb(h, s * 100, v * 100);
    r = rgb.r;
    g = rgb.g;
    b = rgb.b;

    updateUI();
}

function startHold(btnId, dx, dy){
    // si déjà en cours → ne pas doubler
    if (holdIntervals[btnId]) return;

    // premier mouvement
    moveSVBy(dx, dy);

    // interval propre à ce bouton
    holdIntervals[btnId] = setInterval(function(){
        moveSVBy(dx, dy);
    }, 100);
}

function stopHold(btnId){
    if (holdIntervals[btnId]) {
        clearInterval(holdIntervals[btnId]);
        holdIntervals[btnId] = null;
    }
}

function bindHoldButton(btn, dx, dy){
    var id = btn.id;

    btn.addEventListener("mousedown", function(){
        startHold(id, dx, dy);
    });

    btn.addEventListener("mouseup", function(){
        stopHold(id);
    });

    btn.addEventListener("mouseleave", function(){
        stopHold(id);
    });

    btn.addEventListener("touchstart", function(e){
        e.preventDefault();
        startHold(id, dx, dy);
    });

    btn.addEventListener("touchend", function(){
        stopHold(id);
    });
}

// --- liaison des 4 boutons ---
bindHoldButton(document.getElementById("sv-left"),  -step, 0);
bindHoldButton(document.getElementById("sv-right"),  step, 0);
bindHoldButton(document.getElementById("sv-up"),     0,    step);
bindHoldButton(document.getElementById("sv-down"),   0,   -step);

hRange.oninput=function(){
    h=parseInt(this.value,10);
    var rgb=hsvToRgb(h,s*100,v*100);
    r=rgb.r; g=rgb.g; b=rgb.b;
    updateUI();
};

aRange.oninput=function(){
    a=parseInt(this.value,10)/100;
    alphaInput.value=a;
    updateUI();
};

alphaToggle.onchange=function(){updateUI();};

alphaInput.onchange=function(){
    var val=parseFloat(this.value);
    if(!isNaN(val)){
        a=clamp(val,0,1);
        aRange.value=Math.round(a*100);
    }
    updateUI();
};

hexInput.onfocus=function(){lockHex=true;};
hexInput.onblur=function(){lockHex=false;updateUI();};
rgbInput.onfocus=function(){lockRgb=true;};
rgbInput.onblur=function(){lockRgb=false;updateUI();};
hslInput.onfocus=function(){lockHsl=true;};
hslInput.onblur=function(){lockHsl=false;updateUI();};
hsvInput.onfocus=function(){lockHsv=true;};
hsvInput.onblur=function(){lockHsv=false;updateUI();};

hexInput.onchange=function(){
    var p=parseHex(this.value);
    if(!p) return;

    r=p.r; g=p.g; b=p.b;
    if(p.a!==null) a=clamp(p.a/255,0,1);

    var hsv = rgbToHsv(r,g,b);
    h = hsv.h;
    s = hsv.s/100;
    v = hsv.v/100;

    updateUI();
};

rgbInput.onchange=function(){
    var p=parseRgb(this.value);
    if(!p) return;

    r=p.r; g=p.g; b=p.b;
    if(p.a!==null) a=clamp(p.a,0,1);

    var hsv = rgbToHsv(r,g,b);
    h = hsv.h;
    s = hsv.s/100;
    v = hsv.v/100;

    updateUI();
};

hslInput.onchange=function(){
    var p=parseHsl(this.value);
    if(!p) return;

    var h0=p.h, s0=p.s/100, l0=p.l/100;
    var c=(1-Math.abs(2*l0-1))*s0;
    var x=c*(1-Math.abs((h0/60)%2-1));
    var m=l0-c/2;
    var r1,g1,b1;

    if(h0<60){r1=c;g1=x;b1=0;}
    else if(h0<120){r1=x;g1=c;b1=0;}
    else if(h0<180){r1=0;g1=c;b1=x;}
    else if(h0<240){r1=0;g1=x;b1=c;}
    else if(h0<300){r1=x;g1=0;b1=c;}
    else{r1=c;g1=0;b1=x;}

    r=Math.round((r1+m)*255);
    g=Math.round((g1+m)*255);
    b=Math.round((b1+m)*255);

    if(p.a!==null) a=clamp(p.a,0,1);

    var hsv = rgbToHsv(r,g,b);
    h = hsv.h;
    s = hsv.s / 100;
    v = hsv.v / 100;

    updateUI();
};

hsvInput.onchange=function(){
    var p=parseHsv(this.value);
    if(!p) return;

    var rgb=hsvToRgb(p.h,p.s,p.v);
    r=rgb.r; g=rgb.g; b=rgb.b;

    if(p.a!==null) a=clamp(p.a,0,1);

    h = p.h;
    s = p.s / 100;
    v = p.v / 100;

    updateUI();
};

var buttons = document.getElementsByClassName("copy-btn");
for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () {
		var btn = event.target;
		var btn = this;
        var type = this.getAttribute("data-copy");
        var text = "";

        if (type === "hex") text = hexInput.value;
        if (type === "rgb") text = rgbInput.value;
        if (type === "hsl") text = hslInput.value;
        if (type === "hsv") text = hsvInput.value;

        var t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        btn.focus();
    };
}

var hBar = document.getElementById("h-bar");
var hCtx = hBar.getContext("2d");

function drawHueBar(){
    var w = hBar.width;
    var h = hBar.height;

    for (var x = 0; x < w; x++) {
        var hue = (x / w) * 360;
        var rgb = hsvToRgb(hue, 100, 100);
        hCtx.fillStyle = "rgb(" + rgb.r + "," + rgb.g + "," + rgb.b + ")";
        hCtx.fillRect(x, 0, 1, h);
    }
}
drawHueBar();

updateUI();
</script>

</body>
</html>
