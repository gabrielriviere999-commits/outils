<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document HTML</title>
<link rel="stylesheet" href="outils.css">
<style>
* { box-sizing:border-box; }
textarea, iframe {
  width:100%;
  height:500px;
  height:70vh;
}
iframe{background:#fff!important;}
</style>
</head>
<body>
<h2>Document HTML</h2>
<div class="container">
  <div class="card">
    <h3>Prévisualisation</h3>
    <button type="button" onclick="insertTemplate('page')">Page</button>
    <button type="button" onclick="insertTemplate('h1')">h1</button>
    <button type="button" onclick="insertTemplate('h2')">h2</button>
    <button type="button" onclick="insertTemplate('h3')">h3</button>
    <button type="button" onclick="insertTemplate('pagebreak')">Saut de page</button>
    |
    <button type="button" onclick="insertTemplate('code')">Code block</button>
    <button type="button" onclick="insertTemplate('blue-block')">Blue block</button>
    <button type="button" onclick="insertTemplate('note')">Note</button>
    |
    <button type="button" onclick="insertList('ul')">ul</button>
    <button type="button" onclick="insertList('ol')">ol</button>
    |
    <button type="button" onclick="insertTemplate('link')">Lien</button>
    |
    <button class="btn-toggle" onclick="formatText(this, 'bold')"><b>Gras</b></button>
    <button class="btn-toggle" onclick="formatText(this, 'italic')"><i>Italique</i></button>
    <button class="btn-toggle" onclick="formatText(this, 'underline')"><u>Souligné</u></button>
    <button class="btn-toggle" onclick="formatText(this, 'strikethrough')"><s>Barré</s></button>
    <button class="btn-toggle" onclick="formatText(this, 'hiliteColor', 'orange')"><span style="background:orange;">Surligné</span></button>
    <button class="btn-toggle" onclick="formatText(this, 'foreColor', '#ff0000')" style="color:#ff0000;">Rouge</button>
    <button class="btn-toggle" onclick="formatText(this, 'foreColor', '#00aa00')" style="color:#00aa00;">Vert</button>
    <button class="btn-toggle" onclick="formatText(this, 'foreColor', '#00aaff')" style="color:#00aaff;">Bleu</button>
    |
    <button class="align-btn" onclick="toggleAlign(this, 'left')">Gauche</button>
    <button class="align-btn" onclick="toggleAlign(this, 'center')">Centre</button>
    <button class="align-btn" onclick="toggleAlign(this, 'right')">Droite</button>
    <iframe id="preview" class="border-interne"></iframe>
  </div>
  <div class="card">
    <h3>Code HTML</h3>
    <textarea wrap="off" id="output"></textarea><br>
    <button type="button" onclick="updatePreview()" class="btn-color" style="background:#ff8800;">Mettre à jour</button>
    <button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier le code</button>
    <button id="importTextareaFileoutput">Importer fichier...</button>
    <input type="file" id="textareaFileoutput" style="display:none;">
    <div id="status">Prêt.</div>
  </div>
</div>
<script src="outils.js"></script>
<script>
  // Modèle de page
  var baseTemplate =
'<!DOCTYPE html>\n' +
'<html lang="fr">\n' +
'<head>\n' +
'  <meta charset="utf-8">\n' +
'  <meta name="viewport" content="width=device-width, initial-scale=1">\n' +
'  <title>Titre du document</title>\n' +
'  <style>\n' +
'    * { box-sizing:border-box; }\n' +
'    body { background:black; color:#ccc; font-family:sans-serif; font-size:12px; }\n' +
'    .page { max-width:900px; margin:0 auto 30px; padding:10px 10px; border:2px solid #808080; }\n' +
'    .page-break { margin:20px auto; border:none; border-top:2px dashed #808080; max-width:200px; }\n' +
'    h1, h2, h3, h4 { margin-top:1.2em; margin-bottom:0.4em; }\n' +
'    h1 { text-align:center; margin-top:0; }\n' +
'    h2 { border-bottom:1px solid #808080; padding-bottom:4px; }\n' +
'    p { margin:0; white-space:pre-wrap; overflow-wrap:break-word; }\n' +
'    a { color:#4af; text-decoration:none; } a:hover { text-decoration:underline; }\n' +
'    pre { margin:0; }\n' +
'    .code-block { margin-top:0.4em; margin-bottom:0.4em; padding:10px 12px; background:black; color:#ccc; border:1px solid #808080; font-family:monospace; overflow-x:auto; }\n' +
'    .blue-block { margin-top:0.4em; margin-bottom:0.4em; padding:10px 12px; background:#f4f7f8; color:black; border-left:4px solid #558abb; font-family:monospace; white-space:pre; overflow-x:auto; }\n' +
'    .note { margin-top:0.4em; margin-bottom:0.4em; padding:8px 10px; background:#fff8e5; color:black; border-left:4px solid #f0ad4e; }\n' +
'    table { border-collapse:collapse; width:100%; }\n' +
'    td { border:1px solid #808080; }\n' +
'    @media (hover:none) and (pointer:coarse) {::-webkit-scrollbar { width:24px; height:24px; background:#000; } ::-webkit-scrollbar-track { background:#000; border-top:2px solid #888; border-left:2px solid #888; border-bottom:2px solid #111; border-right:2px solid #111; } ::-webkit-scrollbar-thumb { background:#202020; border-top:2px solid #888; border-left:2px solid #888; border-bottom:2px solid #111; border-right:2px solid #111; } ::-webkit-scrollbar-corner { background:#000; border-top:2px solid #888; border-left:2px solid #888; border-bottom:2px solid #111; border-right:2px solid #111; }}\n' +
'  </style>\n' +
'</head>\n' +
'<body>\n\n' +
'<div class="page">\n' +
'  <h1>Titre principal</h1>\n' +
'  <h2>Section 1</h2>\n' +
'  <p>Texte d\'introduction...</p>\n' +
'</div>\n\n' +
'</body>\n' +
'</html>\n';
  var output = document.getElementById('output');
  var preview = document.getElementById('preview');
  var statusEl = document.getElementById('status');
  // Initialisation
  output.value = baseTemplate;
  updatePreview();
  function setStatus(msg) {
    statusEl.innerHTML = msg;
  }
  function insertAtCursor(text) {
    var start, end, before, after;
    output.focus();
    start = output.selectionStart;
    end = output.selectionEnd;
    before = output.value.substring(0, start);
    after = output.value.substring(end, output.value.length);
    output.value = before + text + after;
    output.selectionStart = output.selectionEnd = start + text.length;
  }
function insertTemplate(type) {
  var snippet = "";
  if (type === 'page') {
    snippet =
'<div class="page">\n' +
'  <h1>Titre de la page</h1>\n' +
'  <h2>Sous-titre</h2>\n' +
'  <p>Contenu...</p>\n' +
'</div>\n';
  } else if (type === 'h1') {
    snippet = '<h1>Nouveau titre</h1>\n';
  } else if (type === 'h2') {
    snippet = '<h2>Titre de section</h2>\n';
  } else if (type === 'h3') {
    snippet = '<h3>Sous-section</h3>\n';
  } else if (type === 'pagebreak') {
    snippet = '<hr class="page-break">\n';
  } else if (type === 'code') {
    snippet =
'<div class="code-block"><pre>commande --option\n</pre></div>\n';
  } else if (type === 'blue-block') {
    snippet =
'<div class="blue-block">Texte monospaced\n</div>\n';
  } else if (type === 'note') {
    snippet =
'<div class="note"><b>Note :</b> texte de la note.</div>\n';
  } else if (type === 'link') {
    snippet =
'<a href="lien.html">lien</a>';
  }
  // Vérifier si le curseur est dans l'aperçu
  var doc = preview.contentDocument || preview.contentWindow.document;
  doc.body.focus();
  var sel = doc.getSelection();
  if (sel && sel.rangeCount > 0 && sel.anchorNode) {
    insertInPreview(snippet);
  } else {
    insertAtCursor(snippet);
  }
}
function updatePreview() {
  var doc = preview.contentDocument || preview.contentWindow.document;
  doc.open();
  doc.write(output.value);
  doc.close();
  enableWysiwyg();
  setStatus('Prévisualisation mise à jour.');
}
function cleanExport(html) {
  return html.replace(/contenteditable="true"/gi, "");
}
var codeBox = output;
function enableWysiwyg() {
  var doc = preview.contentDocument || preview.contentWindow.document;
  // Rendre l'aperçu éditable
  doc.body.contentEditable = "true";
  // Quand on tape dans l'aperçu → mise à jour du textarea
  doc.body.onkeyup = function () {
    output.value = prettyHTML(cleanExport(doc.documentElement.outerHTML));
    setStatus("Modifié depuis l'aperçu.");
  };
}
function insertInPreview(html) {
  var doc = preview.contentDocument || preview.contentWindow.document;
  var sel = doc.getSelection();
  var range = sel.getRangeAt(0);
  range.deleteContents();
  // Créer un fragment HTML compatible vieux navigateurs
  var div = doc.createElement("div");
  div.innerHTML = html;
  var frag = doc.createDocumentFragment();
  while (div.firstChild) frag.appendChild(div.firstChild);
  range.insertNode(frag);
  // Replacer le curseur après l'insertion
  sel.collapseToEnd();
  // Mettre à jour le textarea
  output.value = prettyHTML(cleanExport(doc.documentElement.outerHTML));
  setStatus("Élément inséré dans l'aperçu.");
}
function insertList(type) {
  var doc = preview.contentDocument || preview.contentWindow.document;
  doc.body.focus();
  var sel = doc.getSelection();
  // Si curseur dans l'aperçu → insertion WYSIWYG
  if (sel && sel.rangeCount > 0 && sel.anchorNode) {
    insertListPreview(type);
    return;
  }
  // Sinon → insertion dans le textarea
  insertListTextarea(type);
}
function insertListPreview(type) {
  var doc = preview.contentDocument || preview.contentWindow.document;
  var sel = doc.getSelection();
  var range = sel.getRangeAt(0);
  var list = doc.createElement(type);
  var li = doc.createElement("li");
  li.appendChild(doc.createTextNode("Élément"));
  list.appendChild(li);
  range.insertNode(list);
  sel.collapse(li, 1);
  output.value = prettyHTML(cleanExport(doc.documentElement.outerHTML));
  setStatus("Liste " + " insérée dans l'aperçu.");
}
function insertListTextarea(type) {
  var start = output.selectionStart;
  var end = output.selectionEnd;
  var list =
"<" + type + ">\n" +
"  <li>Élément</li>\n" +
"</" + type + ">\n";
  output.value =
    output.value.substring(0, start) +
    list +
    output.value.substring(end);
  output.selectionStart = start;
  output.selectionEnd = start + list.length;
  setStatus("Liste " + " insérée dans le code.");
  updatePreview();
}
function prettyHTML(html) {
  return html.replace(/></g, ">\n<");
}
function formatText(btn, cmd, value) {
  var doc = preview.contentDocument || preview.contentWindow.document;
  doc.body.focus();
  // Si bouton déjà actif → désactiver
  if (btn.className.indexOf("active") !== -1) {
    btn.className = btn.className.replace(" active", "");
    // Désactivation du style
    if (cmd === "hiliteColor") {
      doc.execCommand("hiliteColor", false, "transparent");
    }
    if (cmd === "foreColor") {
      doc.execCommand("foreColor", false, "#ccc");
    }
    if (cmd === "bold" || cmd === "italic" || cmd === "underline" || cmd === "strikethrough") {
      doc.execCommand(cmd, false, null);
    }
  } else {
    // Activer
    btn.className += " active";
    doc.execCommand(cmd, false, value);
  }
  // Mise à jour du textarea
  output.value = prettyHTML(cleanExport(doc.documentElement.outerHTML));
  setStatus("Format appliqué : " + cmd);
}
function toggleAlign(btn, align) {
  var doc = preview.contentDocument || preview.contentWindow.document;
  // Garder le focus dans l'aperçu
  doc.body.focus();
  // Désactiver tous les boutons d'alignement
  var buttons = document.querySelectorAll(".align-btn");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = buttons[i].className.replace(" active", "");
  }
  // Si bouton déjà actif → retour à gauche SANS STYLE
  if (btn.className.indexOf("active") !== -1) {
    btn.className = btn.className.replace(" active", "");
    // execCommand remet à gauche mais peut ajouter un style
    doc.execCommand("justifyLeft", false, null);
    // On nettoie tout
    removeAlignmentStyles(doc);
  } else {
    // Activer bouton
    btn.className += " active";
    if (align === "center") doc.execCommand("justifyCenter", false, null);
    if (align === "right") doc.execCommand("justifyRight", false, null);
    if (align === "left") {
      doc.execCommand("justifyLeft", false, null);
      removeAlignmentStyles(doc); // IMPORTANT
    }
  }
  // Mise à jour du textarea
  output.value = prettyHTML(cleanExport(doc.documentElement.outerHTML));
  setStatus("Alignement : " + align);
}
function removeAlignmentStyles(doc) {
  var all = doc.body.getElementsByTagName("*");
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    // Supprimer style="text-align: left|center|right|justify"
    if (el.style && el.style.textAlign) {
      el.style.textAlign = "";
    }
    // Supprimer align="left|center|right|justify"
    if (el.getAttribute("align")) {
      el.removeAttribute("align");
    }
  }
}
</script>
</body>
</html>
