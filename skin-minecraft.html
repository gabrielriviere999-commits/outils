<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Skin Minecraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
<link rel="stylesheet" href="color-palette.css">
<style>
#board{
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
  background:
    linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%),
    linear-gradient(45deg,#3a3a3a 25%,#2f2f2f 25%,#2f2f2f 75%,#3a3a3a 75%);
  background-size:16px 16px;
  background-position:0 0,8px 8px;
  border:1px solid #000;
  touch-action:none;
  display:block;
  cursor:crosshair;
}
#preview{border:2px solid #000;background:#222;cursor:crosshair;touch-action:none;display:block;}
#skinLoupe {
  position:fixed;
  width:120px;
  height:120px;
  display:none;
  z-index:999;
  pointer-events:none;
  background:#222;
  border:3px solid #000;
  box-sizing:border-box;
  border-radius:50%;
  overflow:hidden;
}
#skinLoupe canvas {
  width:120px;
  height:120px;
  display:block;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}
.toolbar {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:998;
}
body{margin-top:45px}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="openFichierPopup()">Fichier</button>
  <div id="popupFichierContent" style="display:none">
    <b class="titleb">Fichier</b><hr class="titlehr">
    <div class="popupgrid">
      <div style="display:table-row;">
        <div style="display:table-cell;">
          <input type="file" id="fileinput">
        </div>
        <div style="display:table-cell;">
          <input id="pastefileinput" placeholder="Ou cliquer et Ctrl+V" maxlength="0">
        </div>
      </div>
    </div>
    <button id="btnDownload">Télécharger PNG</button>
    <button onclick="sharePNG()">Partager PNG</button>
    <button id="btnClear">Effacer tout</button>
    <hr><button onclick="closePopup()">Fermer</button>
  </div>
  <button onclick="openPinceauPopup()">Pinceau</button>
  <div id="popupPinceauContent" style="display:none">
    <b class="titleb">Pinceau</b><hr class="titlehr">
    <b>Couleur</b><br>
    <input type="text" id="colorInput" value="#ff00ff" size="8"><button class="previewColorPicker"></button><button id="btnPipette" style="width:60px;">Pipette</button><br>
    <label><input type="radio" name="brushMode" id="normalMode" checked>Couleur</label>
    <label><input type="radio" name="brushMode" id="eraserCheck">Gomme</label>
    <label><input type="radio" name="brushMode" id="rainbowCheck">Arc-en-ciel</label>
    <button id="btnPencil" class="active">Crayon</button>
    <button id="btnLine">Ligne</button>
    <button id="btnFill">Remplir</button>
    <hr><button onclick="closePopup()">Fermer</button>
  </div>
  <button onclick="openSelectionPopup()">Sélection</button>
  <div id="popupSelectionContent" style="display:none">
    <b class="titleb">Sélection</b><hr class="titlehr">
    <label><input type="checkbox" id="copyCheck">Copier / miroir</label>
    <label><input type="checkbox" id="flipOtherSide">Gauche / haut</label>
    <button id="btnMove">Déplacer</button>
    <button id="btnRotate">Pivoter 90°</button>
    <div class="popupgrid">
      <div style="display:table-row;">
        <div style="display:table-cell;">
          <button id="btnFlipH">Inverser H</button>
        </div>
        <div style="display:table-cell;">
          <button id="btnFlipV">Inverser V</button>
        </div>
      </div>
    </div>
    <hr><button onclick="closePopup()">Fermer</button>
  </div>
  <button id="btnUndo">Annuler</button>
  <button id="btnRedo">Rétablir</button>
  <button onclick="openOptionsPopup()">Options</button>
  <div id="popupOptionsContent" style="display:none">
    <b class="titleb">Options</b><hr class="titlehr">
    <label><input type="checkbox" id="gridCheck" checked>Grille</label> <input type="text" id="gridColorInput" value="#cccccc" size="8"><button class="previewColorPicker"></button><br>
    <label>Fond : <input type="text" id="bgColorInput" value="#222222" size="8"><button class="previewColorPicker"></button></label><br>
    <label><input type="checkbox" id="loupeEnabled" checked>Loupe</label><br>
    <label>Zoom modèle 3D : <input type="range" id="modelZoom" min="30" max="300" value="100"></label><br>
    <hr><button onclick="closePopup()">Fermer</button>
  </div>
  <span id="activeTool">Crayon</span> |
  <span id="status">x : -, y : -</span>
</div>
<button id="toggleToolbarBtn">▲</button>
<h2>Skin Minecraft (canvas 2D, sans WebGL)</h2>
<div class="overlayColorPicker">
  <div class="overlayColorPicker-cell">
    <div class="mini-picker" id="miniPicker">
      <div class="sv-box" id="svBox">
        <div class="sv-cursor" id="svCursor"></div>
      </div>
      <div class="hue-slider" id="hueSlider">
        <div class="hue-cursor" id="hueCursor"></div>
      </div>
      <div class="alpha-slider" id="alphaSlider">
        <div class="alpha-cursor" id="alphaCursor"></div>
      </div>
      <div class="quick-colors">
        <button class="qc" data-col="#000000" style="background:#000000"></button>
        <button class="qc" data-col="#ffffff" style="background:#ffffff"></button>
        <button class="qc" data-col="#ff0000" style="background:#ff0000"></button>
        <button class="qc" data-col="#ff9900" style="background:#ff9900"></button>
        <button class="qc" data-col="#ffff00" style="background:#ffff00"></button>
        <button class="qc" data-col="#00ff00" style="background:#00ff00"></button>
        <button class="qc" data-col="#00ffff" style="background:#00ffff"></button>
        <button class="qc" data-col="#0000ff" style="background:#0000ff"></button>
        <button class="qc" data-col="#ff00ff" style="background:#ff00ff"></button>
      </div>
      <button id="closePickerBtn" onclick="closePicker()">Fermer</button>
    </div>
  </div>
</div>
<div class="container">
  <div class="card">
    <canvas id="preview" width="400" height="520" tabindex="0"></canvas>
    <label><input type="checkbox" id="autoRotate">Rotation auto</label>
    <button id="btnHand">Tourner</button> 
    <button id="btnPan">Glisser</button>
    <button id="btnResetView">Recentrer</button>
    <label><input type="checkbox" id="spreadCheck" checked>Membres écartés</label>
  </div>
  <div class="card" style="position:relative;border:none;padding:0;">
    <canvas id="board" width="64" height="64"></canvas>
    <div id="boardGrid" style="position:absolute;top:0;left:0;display:none;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,0.45) 1px, transparent 1px),linear-gradient(90deg, rgba(0,0,0,0.45) 1px, transparent 1px);"></div>
    <div id="selRect" style="position:absolute;display:none;border:1px solid #ffffff;pointer-events:none;box-sizing:border-box;"></div>
  </div>
</div>
<div id="skinLoupe"><canvas id="skinLoupeCanvas" width="120" height="120"></canvas></div>
<script src="outils.js"></script>
<script src="popup.js"></script>
<script src="color-palette.js"></script>
<script>
/* Popup */
function openFichierPopup() {
  var container = document.getElementById("popupFichierContent");
  openPopupMenu(container);
}
function openPinceauPopup() {
  var container = document.getElementById("popupPinceauContent");
  openPopupMenu(container);
}
function openSelectionPopup() {
  var container = document.getElementById("popupSelectionContent");
  openPopupMenu(container);
}
function openOptionsPopup() {
  var container = document.getElementById("popupOptionsContent");
  openPopupMenu(container);
}
/* --- VARIABLES PRINCIPALES --- */
var canvas = document.getElementById("board");
var ctx = canvas.getContext("2d");
var colorInput = document.getElementById("colorInput");
var zoom = 10;
var currentTool = "pencil";
var toolBeforePipette = "pencil"; /* outil à restituer apres la pipette */
var drawing = false;
var lastX = 0, lastY = 0;
var selStart = null;
var downOnBoard = false; /* le geste en cours a demarre sur la texture 2D */
var selection = null; /* {x,y,w,h} */
var moving = false;
var moveTemp = null;   /* contenu de la selection (bloc flottant) */
var moveBase = null;   /* copie intacte du canvas pendant le drag */
var moveOffset = null; /* decalage curseur <-> coin de la selection */
var btnMove = document.getElementById("btnMove");
var moveMode = false;      /* le bouton Deplacer est arme */
var moveReturnTool = "pencil";
var pendingAction = null;        /* action en attente d'une selection : "move","rotate","fliph","flipv" */
var actionReturnTool = "pencil"; /* outil a restituer apres l'action */
var actionButtons = {
  move:   document.getElementById("btnMove"),
  rotate: document.getElementById("btnRotate"),
  fliph:  document.getElementById("btnFlipH"),
  flipv:  document.getElementById("btnFlipV")
};
var lineStart = null;  /* point de depart de la ligne */
var lineBase = null;   /* copie du canvas pendant l'aperçu */
var line3D = false;  /* ligne en cours sur le modele 3D */
/* Undo / Redo */
var undoStack = [];
var redoStack = [];
var MAX_UNDO = 100;
/* --- STATUT (sans reflow inutile) --- */
var statusEl = document.getElementById("status");
var lastStatus = "";
function setStatus(txt){
  if(txt !== lastStatus){
    lastStatus = txt;
    statusEl.textContent = txt;
  }
}
/* --- AFFICHAGE --- */
function availableBoardWidth(){
  var left = canvas.parentElement.getBoundingClientRect().left;
  var avail = window.innerWidth - left - 12;
  return Math.max(64, Math.min(availableFullWidth(), avail));
}
function availableFullWidth(){
  return Math.max(64, window.innerWidth - 20);
}
function applyZoom(){
  zoom = Math.max(1, Math.floor(availableBoardWidth() / canvas.width));
  canvas.style.width = (canvas.width * zoom) + "px";
  canvas.style.height = (canvas.height * zoom) + "px";
  updateBoardGrid();
  updateSelRect();
}
window.addEventListener("resize", applyZoom);
/* Grille et contour de selection sur la texture 2D */
function updateBoardGrid(){
  var g = document.getElementById("boardGrid");
  if(!g){ return; }
  if(gridCheck.checked){
    var gc = gridColorInput.value;
    g.style.display = "block";
    g.style.width = canvas.style.width;
    g.style.height = canvas.style.height;
    g.style.backgroundSize = zoom + "px " + zoom + "px";
    g.style.backgroundImage =
      "linear-gradient(" + gc + " 1px, transparent 1px)," +
      "linear-gradient(90deg," + gc + " 1px, transparent 1px)";
  } else {
    g.style.display = "none";
  }
}
function updateSelRect(){
  var r = document.getElementById("selRect");
  if(!r){ return; }
  if(selection){
    r.style.display = "block";
    r.style.left = (selection.x * zoom) + "px";
    r.style.top = (selection.y * zoom) + "px";
    r.style.width = (selection.w * zoom) + "px";
    r.style.height = (selection.h * zoom) + "px";
    r.style.borderColor = colorInput.value;
  } else {
    r.style.display = "none";
  }
}
/* --- COULEUR --- */
var gridColorInput = document.getElementById("gridColorInput");
var bgColorInput = document.getElementById("bgColorInput");
var preview = document.getElementById("preview");
function applyInputColor(input){
  if(input.id === "colorInput"){
    updateSelRect();
  } else if(input.id === "gridColorInput"){
    previewDirty = true;
    updateBoardGrid();
  } else if(input.id === "bgColorInput"){
    preview.style.background = input.value;
  }
}
function setColor(hex){
  colorInput.value = hex;
  updatePickerFromInput(colorInput, colorInput.nextElementSibling);
  applyInputColor(colorInput);
}
[colorInput, gridColorInput, bgColorInput].forEach(function(inp){
  attachColorPickerTo(inp); /* branche bouton + picker + couleurs rapides */
  inp.addEventListener("input", function(){
    applyInputColor(this);
  });
  try{
    if(inp.nextElementSibling){
      inp.nextElementSibling.style.background = inp.value;
    }
    applyInputColor(inp);
  }catch(err){ /* on ne casse jamais le chargement pour un apercu */ }
});
/* --- OUTILS --- */
var toolButtons = {
  pencil: document.getElementById("btnPencil"),
  line: document.getElementById("btnLine"),
  fill: document.getElementById("btnFill"),
  pipette: document.getElementById("btnPipette"),
  hand: document.getElementById("btnHand"),
  pan: document.getElementById("btnPan")
};
var eraserCheck = document.getElementById("eraserCheck");
var rainbowCheck = document.getElementById("rainbowCheck");
function setTool(t){
  if(t === "pipette" && currentTool !== "pipette"){
    toolBeforePipette = currentTool;
  }
  if(t !== "move" && moveMode){ moveMode = false; btnMove.className = ""; }
  if(pendingAction){
    pendingAction = null;
    for(var a in actionButtons){ actionButtons[a].className = ""; }
  }
  currentTool = t;
  for(var k in toolButtons){
    toolButtons[k].className = (k === t) ? "active" : "";
  }
  if(t !== "select"){
    selection = null;
    selStart = null;
  }
  canvas.style.cursor = "crosshair";
  preview.style.cursor = (t === "hand") ? "grab" : ((t === "pan") ? "move" : "crosshair");
  updateSelRect();
  updateToolLabel();
}
var toolNames = {
  pencil: "Crayon",
  line: "Ligne",
  fill: "Remplir",
  pipette: "Pipette",
  hand: "Tourner",
  pan: "Glisser",
  select: "Sélection",
  move: "Déplacer"
};
var actionNames = {
  move: "Déplacer",
  rotate: "Pivoter 90°",
  fliph: "Inverser H",
  flipv: "Inverser V"
};
function updateToolLabel(){
  var txt = toolNames[currentTool] || currentTool;
  if(pendingAction){
    txt = "Sélection (" + actionNames[pendingAction] + ")";
  }
  document.getElementById("activeTool").innerHTML = txt;
}
for(var key in toolButtons){
  (function(k){
    toolButtons[k].onclick = function(){ setTool(k); };
  })(key);
}
function requestAction(a){
  if(pendingAction === a){
    pendingAction = null;
    for(var kc in actionButtons){ actionButtons[kc].className = ""; }
    setTool(actionReturnTool);
    return;
  }
  pendingAction = a;
  if(currentTool !== "select" && currentTool !== "move"){
    actionReturnTool = currentTool;
  }
  if(moveMode){ moveMode = false; }
  selection = null;
  selStart = null;
  updateSelRect();
  currentTool = "select";
  for(var k in toolButtons){ toolButtons[k].className = ""; }
  for(var ab in actionButtons){ actionButtons[ab].className = ""; }
  actionButtons[a].className = "active";
  setStatus("Tracez une sélection sur la texture 2D : l'action s'appliquera au relâchement.");
  updateToolLabel();
}
function rearmAction(a){
  pendingAction = a;
  currentTool = "select";
  selection = null;
  selStart = null;
  updateSelRect();
  for(var k in toolButtons){ toolButtons[k].className = ""; }
  for(var ab in actionButtons){ actionButtons[ab].className = ""; }
  actionButtons[a].className = "active";
  setStatus(actionNames[a] + " : tracez une nouvelle sélection pour recommencer.");
  updateToolLabel();
}
function startAction(a){
  pendingAction = null;
  if(a === "move"){
    moveReturnTool = actionReturnTool;
    currentTool = "move";
    moveMode = true;
    for(var k in toolButtons){ toolButtons[k].className = ""; }
    actionButtons.move.className = "active";
    setStatus("Déplacer : glissez le bloc, relâchez pour valider.");
    return;
  }
  if(a === "rotate"){ rotateSelection(); }
  else if(a === "fliph"){ flipSelection("h"); }
  else if(a === "flipv"){ flipSelection("v"); }
  rearmAction(a);
}
actionButtons.move.onclick   = function(){ requestAction("move"); };
actionButtons.rotate.onclick = function(){ requestAction("rotate"); };
actionButtons.fliph.onclick  = function(){ requestAction("fliph"); };
actionButtons.flipv.onclick  = function(){ requestAction("flipv"); };
/* --- UNDO / REDO --- */
function saveState(){
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if(undoStack.length > MAX_UNDO){ undoStack.shift(); }
  redoStack = [];
  skinDataDirty = true; /* la texture a change : cache ImageData invalide */
}
function undo(){
  if(undoStack.length){
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
    skinDataDirty = true;
    renderPreview();
  }
}
function redo(){
  if(redoStack.length){
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
    skinDataDirty = true;
    renderPreview();
  }
}
document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;
/* --- POSITION --- */
function getPos(e){
  var rect = canvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - rect.left) * canvas.width / rect.width),
    y: Math.floor((e.clientY - rect.top) * canvas.height / rect.height)
  };
}
/* --- DESSIN PIXEL --- */
var rainbowHue = 0;
var RAINBOW_STEP = 12;
function rainbowColor(h){
  var i = Math.floor(h / 60);
  var f = h - i * 60;
  var q = 255 - Math.round(255 * f / 60);
  var t = 255 - q;
  var r,g,b;
  if(i === 0){
    r = 255; g = t; b = 0;
  } else if(i === 1){
    r = q; g = 255; b = 0;
  } else if(i === 2){
    r = 0; g = 255; b = t;
  } else if(i === 3){
    r = 0; g = q; b = 255;
  } else if(i === 4){
    r = t; g = 0; b = 255;
  } else {
    r = 255; g = 0; b = q;
  }
  return "#" +
    ("0" + r.toString(16)).slice(-2) +
    ("0" + g.toString(16)).slice(-2) +
    ("0" + b.toString(16)).slice(-2);
}
function paintPixelWithColor(x, y, col){
  if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height){ return; }
  ctx.fillStyle = col;
  ctx.fillRect(x, y, 1, 1);
}
function paintPixel(x, y){
  if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height){ return; }
  if(currentTool !== "pencil" && currentTool !== "line"){
    return;
  } else if(eraserCheck.checked){
    ctx.clearRect(x, y, 1, 1);
  } else if(rainbowCheck.checked){
    ctx.fillStyle = rainbowColor(rainbowHue);
    rainbowHue += RAINBOW_STEP;
    if(rainbowHue >= 360){
      rainbowHue %= 360;
    }
    ctx.fillRect(x, y, 1, 1);
  } else {
    ctx.fillStyle = colorInput.value;
    ctx.fillRect(x, y, 1, 1);
  }
}
function drawPixelLineRainbow(x1, y1, x2, y2){
  var dx = x2 - x1;
  var dy = y2 - y1;
  var distance = Math.sqrt(dx * dx + dy * dy);
  var steps = Math.max(1, Math.floor(distance));
  var i;
  for(i = 0; i <= steps; i++){
    var t = i / steps;
    var hue = t * 300;
    paintPixelWithColor(Math.round(x1 + dx * t), Math.round(y1 + dy * t), rainbowColor(hue));
  }
}
function drawPixelRainbowLine(x1, y1, x2, y2){
  var dx = x2 - x1;
  var dy = y2 - y1;
  var distance = Math.sqrt(dx * dx + dy * dy);
  if(distance < 0.1){ return; }
  var steps = Math.max(1, Math.floor(distance));
  var i;
  for(i = 0; i <= steps; i++){
    var t = i / steps;
    paintPixelWithColor(Math.round(x1 + dx * t), Math.round(y1 + dy * t), rainbowColor(rainbowHue));
    rainbowHue += RAINBOW_STEP;
    if(rainbowHue >= 360){
      rainbowHue %= 360;
    }
  }
}
function drawPixelLine(x1, y1, x2, y2){
  if(eraserCheck.checked){
    /* gomme : Bresenham normal, paintPixel effacera */
  } else if(rainbowCheck.checked){
    drawPixelLineRainbow(x1, y1, x2, y2);
    return;
  }
  var dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
  var sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  var err = dx - dy;
  while(true){
    paintPixel(x1, y1);
    if(x1 === x2 && y1 === y2){ break; }
    var e2 = 2 * err;
    if(e2 > -dy){ err -= dy; x1 += sx; }
    if(e2 < dx){ err += dx; y1 += sy; }
  }
}
/* --- REMPLISSAGE --- */
function hexToRgb(hex){
  return {
    r: parseInt(hex.substring(1, 3), 16),
    g: parseInt(hex.substring(3, 5), 16),
    b: parseInt(hex.substring(5, 7), 16),
    a: 255
  };
}
function sameColor(a, b){
  return a.r === b.r && a.g === b.g && a.b === b.b && a.a === b.a;
}
function floodFill(sx, sy){
    if(sx < 0 || sy < 0 || sx >= canvas.width || sy >= canvas.height){
        return;
    }
    var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var d = img.data;
    var W = canvas.width;
    var H = canvas.height;
    function idx(x, y){
        return (y * W + x) * 4;
    }
    var i0 = idx(sx, sy);
    var tr = d[i0];
    var tg = d[i0 + 1];
    var tb = d[i0 + 2];
    var ta = d[i0 + 3];
    var fr, fg, fb, fa;
    if(eraserCheck.checked){
        fr = 0;
        fg = 0;
        fb = 0;
        fa = 0;
    } else {
        var fill = hexToRgb(colorInput.value);
        fr = fill.r;
        fg = fill.g;
        fb = fill.b;
        fa = fill.a;
    }
    if(tr === fr && tg === fg && tb === fb && ta === fa){
        return;
    }
    if(ta === 0 && fa === 0){
        return;
    }
    function isTarget(i){
        if(ta === 0){
            return d[i + 3] === 0;
        }
        return d[i] === tr &&
               d[i + 1] === tg &&
               d[i + 2] === tb &&
               d[i + 3] === ta;
    }
    function paint(i){
        d[i] = fr;
        d[i + 1] = fg;
        d[i + 2] = fb;
        d[i + 3] = fa;
    }
    var stack = [];
    var start = i0;
    paint(start);
    stack.push(start);
    while(stack.length){
        var p = stack.pop();
        var x = (p / 4) % W;
        var y = Math.floor(p / 4 / W);
        var n;
        if(x > 0){
            n = p - 4;
            if(isTarget(n)){
                paint(n);
                stack.push(n);
            }
        }
        if(x < W - 1){
            n = p + 4;
            if(isTarget(n)){
                paint(n);
                stack.push(n);
            }
        }
        if(y > 0){
            n = p - W * 4;
            if(isTarget(n)){
                paint(n);
                stack.push(n);
            }
        }
        if(y < H - 1){

  var x = Math.min(x1, x2), y = Math.min(y1, y2);

  if(x < 0){ w += x; x = 0; }

    return {
      sx: pA.sx * (1 - s) * (1 - t) + pB.sx * s * (1 - t) + pC.sx * s * t + pD.sx * (1 - s) * t,
      sy: pA.sy * (1 - s) * (1 - t) + pB.sy * s * (1 - t) + pC.sy * s * t + pD.sy * (1 - s) * t
    };
  }
  for(i = 1; i <= N; i++){
    var s0 = (i - 1) / N, s1 = i / N;

      var curTL = interp(p0, p1, p2, p3, s0, t0);

      var sBRx = rx0 + s1 * (rx1 - rx0), sBRy = ry0 + t1 * (ry1 - ry0);
      var sBLx = rx0 + s0 * (rx1 - rx0), sBLy = ry0 + t1 * (ry1 - ry0);

  }

    pctx.save();

    pctx.moveTo(p0.sx, p0.sy);

}

  if(typeof pctx.setTransform === "function"){
    pctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  pctx.imageSmoothingEnabled = false;
  pctx.clearRect(0, 0, preview.width, preview.height);
  var skinData = getSkinData();
  var faces = [];
  var ci, fn;
  for(ci = 0; ci < CUBOIDS.length; ci++){
    var cub = CUBOIDS[ci];
    for(fn in FACE_CORNERS){
      var rect = cub.uv[fn];
      var hx = cub.h[0], hy = cub.h[1], hz = cub.h[2];
      var corners = FACE_CORNERS[fn](hx, hy, hz);
      var pts = [], vis = true, k;
      var nrm = FACE_NORMALS[fn];
      var nYawZ = -nrm[0] * sinY + nrm[2] * cosY;
      var nZ = nrm[1] * sinP + nYawZ * cosP;
      if(nZ <= 0){ vis = false; }
      for(k = 0; k < 4; k++){
        var pt = project([cub.c[0] + corners[k][0], cub.c[1] + corners[k][1], cub.c[2] + corners[k][2]]);
        pts.push(pt);
      }
      var centerZ = 0;
      for(k = 0; k < 4; k++){ centerZ += pts[k].z; }
      centerZ /= 4;
      if(vis){
        faces.push({ depth: CAM_D - centerZ, pts: pts, rect: rect, shade: FACE_SHADE[fn], cub: cub.name, fn: fn });
      }
      if(cub.ouv && rectHasPixels(skinData, cub.ouv[fn])){
        var o = cub.inf;
        var oc = FACE_CORNERS[fn](hx + o, hy + o, hz + o);
        var opts = [];
        for(k = 0; k < 4; k++){
          opts.push(project([cub.c[0] + oc[k][0], cub.c[1] + oc[k][1], cub.c[2] + oc[k][2]]));
        }
        var ocenterZ = 0;
        for(k = 0; k < 4; k++){ ocenterZ += opts[k].z; }
        ocenterZ /= 4;
        var oNz = nrm[1] * sinP + nYawZ * cosP;
        if(oNz > 0){
          faces.push({ depth: CAM_D - ocenterZ, pts: opts, rect: cub.ouv[fn], shade: FACE_SHADE[fn], cub: cub.name, fn: fn, overlay: true });
        }
      }
    }
  }
  function drawFaceGrid(f){
    var p0 = f.pts[0], p1 = f.pts[1], p2 = f.pts[2], p3 = f.pts[3];
    var rx0 = f.rect[0], ry0 = f.rect[1], rx1 = f.rect[2], ry1 = f.rect[3];
    var w = Math.round(rx1 - rx0), h = Math.round(ry1 - ry0);
    if(w < 1 || h < 1){ return; }
    function interp(s, t){
      return {
        sx: p0.sx * (1 - s) * (1 - t) + p1.sx * s * (1 - t) + p2.sx * s * t + p3.sx * (1 - s) * t,
        sy: p0.sy * (1 - s) * (1 - t) + p1.sy * s * (1 - t) + p2.sy * s * t + p3.sy * (1 - s) * t
      };
    }
    pctx.strokeStyle = hexToRgbaString(gridColorInput.value, 0.55);
    pctx.lineWidth = 1;
    pctx.beginPath();
    var i;
    for(i = 0; i <= w; i++){
      var A = interp(i / w, 0), B = interp(i / w, 1);
      pctx.moveTo(A.sx, A.sy);
      pctx.lineTo(B.sx, B.sy);
    }
    for(i = 0; i <= h; i++){
      var C = interp(0, i / h), D = interp(1, i / h);
      pctx.moveTo(C.sx, C.sy);
      pctx.lineTo(D.sx, D.sy);
    }
    pctx.stroke();
  }
  faces.sort(function(a, b){ return b.depth - a.depth; });
  RENDERED_FACES = faces;
  var showGrid = gridCheck.checked;
  var fi;
  for(fi = 0; fi < faces.length; fi++){
    var f = faces[fi];
    if(typeof pctx.setTransform === "function"){
      f.N = drawTexturedQuad(canvas, f.rect, f.pts[0], f.pts[1], f.pts[2], f.pts[3], f.shade);
    } else {
      var tx = Math.floor((f.rect[0] + f.rect[2]) / 2);
      var ty = Math.floor((f.rect[1] + f.rect[3]) / 2);
      var td = skinData;
      var ti = (ty * 64 + tx) * 4;
      pctx.beginPath();
      pctx.moveTo(f.pts[0].sx, f.pts[0].sy);
      pctx.lineTo(f.pts[1].sx, f.pts[1].sy);
      pctx.lineTo(f.pts[2].sx, f.pts[2].sy);
      pctx.lineTo(f.pts[3].sx, f.pts[3].sy);
      pctx.closePath();
      pctx.fillStyle = "rgb(" + td[ti] + "," + td[ti+1] + "," + td[ti+2] + ")";
      pctx.fill();
      f.N = 1;
    }
    if(showGrid){ drawFaceGrid(f); }
  }
}
/* === INTERACTION 3D : PEINDRE ET TOURNER LE MODELE === */
var RENDERED_FACES = [];
var autoRotate = document.getElementById("autoRotate");
if(LEGACY_3DS){ autoRotate.checked = false; }
var previewDirty = false;
var painting3D = false;
var lastPaint = null;
var rotating = false;
var lastRX = 0, lastRY = 0;
function getPreviewPos(e){
  var rect = preview.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * preview.width / rect.width,
    y: (e.clientY - rect.top) * preview.height / rect.height
  };
}
function uvAt(f, px, py){
  var p0 = f.pts[0], p1 = f.pts[1], p2 = f.pts[2], p3 = f.pts[3];
  /* Rejet rapide par rectangle englobant : evite les calculs
     barycentriques quand le curseur est loin de la face */
  var minX = Math.min(p0.sx, p1.sx, p2.sx, p3.sx) - 2;
  var maxX = Math.max(p0.sx, p1.sx, p2.sx, p3.sx) + 2;
  var minY = Math.min(p0.sy, p1.sy, p2.sy, p3.sy) - 2;
  var maxY = Math.max(p0.sy, p1.sy, p2.sy, p3.sy) + 2;
  if(px < minX || px > maxX || py < minY || py > maxY){ return null; }
  var rx0 = f.rect[0], ry0 = f.rect[1], rx1 = f.rect[2], ry1 = f.rect[3];
  var N = f.N || 6;
  function interp(s, t){
    return {
      sx: p0.sx * (1 - s) * (1 - t) + p1.sx * s * (1 - t) + p2.sx * s * t + p3.sx * (1 - s) * t,
      sy: p0.sy * (1 - s) * (1 - t) + p1.sy * s * (1 - t) + p2.sy * s * t + p3.sy * (1 - s) * t
    };
  }
  var EPS = -0.02;
  var i, j;
  for(i = 0; i < N; i++){
    var s0 = i / N, s1 = (i + 1) / N;
    for(j = 0; j < N; j++){
      var t0 = j / N, t1 = (j + 1) / N;
      var TL = interp(s0, t0), TR = interp(s1, t0), BR = interp(s1, t1), BL = interp(s0, t1);
      var r = uvInTri(TL, TR, BR, px, py,
        [rx0 + s0 * (rx1 - rx0), ry0 + t0 * (ry1 - ry0)],
        [rx0 + s1 * (rx1 - rx0), ry0 + t0 * (ry1 - ry0)],
        [rx0 + s1 * (rx1 - rx0), ry0 + t1 * (ry1 - ry0)], EPS);
      if(r){ return r; }
      r = uvInTri(TL, BR, BL, px, py,
        [rx0 + s0 * (rx1 - rx0), ry0 + t0 * (ry1 - ry0)],
        [rx0 + s1 * (rx1 - rx0), ry0 + t1 * (ry1 - ry0)],
        [rx0 + s0 * (rx1 - rx0), ry0 + t1 * (ry1 - ry0)], EPS);
      if(r){ return r; }
    }
  }
  return null;
}
function uvInTri(d0, d1, d2, px, py, s0, s1, s2, EPS){
  var d10x = d1.sx - d0.sx, d10y = d1.sy - d0.sy;
  var d20x = d2.sx - d0.sx, d20y = d2.sy - d0.sy;
  var den = d10x * d20y - d20x * d10y;
  if(den === 0){ return null; }
  var ax = px - d0.sx, ay = py - d0.sy;
  var alpha = (ax * d20y - d20x * ay) / den;
  var beta = (d10x * ay - ax * d10y) / den;
  if(alpha < EPS || beta < EPS || alpha + beta > 1 - EPS){ return null; }
  return [
    s0[0] + alpha * (s1[0] - s0[0]) + beta * (s2[0] - s0[0]),
    s0[1] + alpha * (s1[1] - s0[1]) + beta * (s2[1] - s0[1])
  ];
}
function hitFace(px, py){
  var i;
  for(i = RENDERED_FACES.length - 1; i >= 0; i--){
    var uv = uvAt(RENDERED_FACES[i], px, py);
    if(uv){
      return { face: RENDERED_FACES[i], u: uv[0], v: uv[1] };
    }
  }
  return null;
}
function paintHit(hit){
  var u = Math.floor(hit.u), v = Math.floor(hit.v);
  if(u < 0 || v < 0 || u >= 64 || v >= 64){ return; }
  if(currentTool === "pipette"){
    pipette(u, v);
    return;
  }
  if(currentTool === "fill"){
    saveState();
    floodFill(u, v);
    previewDirty = true;
    return;
  }
  if(lastPaint && lastPaint.rect === hit.face.rect){
    if(rainbowCheck.checked && !eraserCheck.checked){
      drawPixelRainbowLine(lastPaint.u, lastPaint.v, u, v);
    } else {
      drawPixelLine(lastPaint.u, lastPaint.v, u, v);
    }
  } else {
    paintPixel(u, v);
  }
  lastPaint = { u: u, v: v, rect: hit.face.rect };
  previewDirty = true;
}
function previewDown(e){
  var p = getPreviewPos(e);
  if(currentTool === "pan" || e.button === 2){
    panning = true;
    lastPanX = e.clientX; lastPanY = e.clientY;
    if(e.preventDefault){ e.preventDefault(); }
    return;
  }
  var hit = hitFace(p.x, p.y);
  if(currentTool === "pipette"){
    if(hit){
      pipette(Math.floor(hit.u), Math.floor(hit.v));
    }
    if(e.preventDefault){ e.preventDefault(); }
    return;
  }
  if(currentTool === "line"){
    var hit0 = hit;
    if(hit0){
      saveState();
      lineStart = { px: p.x, py: p.y };
      lineBase = document.createElement("canvas");
      lineBase.width = canvas.width; lineBase.height = canvas.height;
      lineBase.getContext("2d").drawImage(canvas, 0, 0);
      line3D = true;
      if(e.preventDefault){ e.preventDefault(); }
      return;
    }
  }
  if(currentTool === "hand" || currentTool === "pipette" || !hit){
    rotating = true;
    lastRX = e.clientX; lastRY = e.clientY;
  } else {
    if(currentTool === "pencil" || currentTool === "line" || (currentTool === "fill") || eraserCheck.checked){ saveState(); }
    painting3D = true;
    lastPaint = null;
    paintHit(hit);
  }
  if(e.preventDefault){ e.preventDefault(); }
}
eraserCheck.onchange = function(){ previewDirty = true; };
rainbowCheck.onchange = function(){ previewDirty = true; };
function previewMove(e){
  /* Ignore tout mouvement hors de l'apercu 3D (aucun hit-test inutile) */
  var r = preview.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){ return; }
  var p = getPreviewPos(e);
  showLoupe(e, preview);
  if(panning){
    panX += e.clientX - lastPanX;
    panY += e.clientY - lastPanY;
    lastPanX = e.clientX; lastPanY = e.clientY;
    previewDirty = true;
    if(e.preventDefault){ e.preventDefault(); }
    return;
  }
  var hit = hitFace(p.x, p.y);
  if(hit){
    setStatus("texture : " + Math.floor(hit.u) + ", " + Math.floor(hit.v) +
      " (" + hit.face.cub + " " + hit.face.fn + (hit.face.overlay ? " overlay" : "") + ")");
  }
  if(line3D){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(lineBase, 0, 0);
    var dxs = p.x - lineStart.px, dys = p.y - lineStart.py;
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dxs), Math.abs(dys))));
    var i3, lastU = -1, lastV = -1;
    for(i3 = 0; i3 <= steps; i3++){
      var sx = lineStart.px + dxs * (i3 / steps);
      var sy = lineStart.py + dys * (i3 / steps);
      var h = hitFace(sx, sy);
      if(h){
        var uu = Math.floor(h.u), vv = Math.floor(h.v);
        if(uu !== lastU || vv !== lastV){
          if(rainbowCheck.checked){
            paintPixelWithColor(uu, vv, rainbowColor((i3 / steps) * 300));
          } else {
            paintPixel(uu, vv);
          }
          lastU = uu; lastV = vv;
        }
      }
    }
    previewDirty = true;
    if(e.preventDefault){ e.preventDefault(); }
    return;
  }
  if(rotating){
    yaw += (e.clientX - lastRX) * 0.012;
    pitch += (e.clientY - lastRY) * 0.01;
    if(pitch > 1.2){ pitch = 1.2; }
    if(pitch < -0.9){ pitch = -0.9; }
    lastRX = e.clientX; lastRY = e.clientY;
    previewDirty = true;
  } else if(painting3D && hit){
    paintHit(hit);
  }
  if(e.preventDefault){ e.preventDefault(); }
}
function previewUp(){
  var wasLine = line3D;
  line3D = false;
  lineStart = null;
  lineBase = null;
  rotating = false;
  panning = false;
  painting3D = false;
  lastPaint = null;
  rainbowHue = 0;
  if(wasLine){ renderPreview(); }
  hideLoupe();
}
preview.addEventListener("mousedown", previewDown);
preview.addEventListener("contextmenu", function(e){ e.preventDefault(); });
function isUiEvent(e){
  var t = e.target;
  return t && (t.tagName === "INPUT" || t.tagName === "BUTTON" ||
              t.tagName === "LABEL" || t.tagName === "SELECT");
}
document.addEventListener("mousemove", function(e){
  if(isUiEvent(e)){ return; }
  previewMove(e);
});
document.addEventListener("mouseup", previewUp);
/* Pincer pour zoomer */
var pinchStartDist = 0;
var pinchStartZoom = 1;
var pinchStartMid = null;
function touchDist(t){
  var dx = t[0].clientX - t[1].clientX;
  var dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
preview.addEventListener("touchstart", function(e){
  if(e.touches.length >= 2){
    rotating = false;
    painting3D = false;
    lastPaint = null;
    pinchStartDist = touchDist(e.touches);
    pinchStartZoom = viewZoom;
    pinchStartMid = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  } else {
    previewDown(e.touches[0]);
  }
  e.preventDefault();
});
preview.addEventListener("touchmove", function(e){
  if(e.touches.length >= 2 && pinchStartDist > 0){
    var d = touchDist(e.touches);
    if(d > 0){ setViewZoom(pinchStartZoom * d / pinchStartDist); }
    var mid = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
    if(pinchStartMid){
      panX += mid.x - pinchStartMid.x;
      panY += mid.y - pinchStartMid.y;
    }
    pinchStartMid = mid;
    previewDirty = true;
  } else {
    previewMove(e.touches[0]);
  }
  e.preventDefault();
});
preview.addEventListener("touchend", function(e){
  if(e.touches.length < 2){ pinchStartDist = 0; pinchStartMid = null; }
  if(e.touches.length === 0){ previewUp(); }
});
preview.addEventListener("wheel", function(e){
  e.preventDefault();
  var factor = (e.deltaY < 0) ? 1.1 : (1 / 1.1);
  setViewZoom(viewZoom * factor);
}, false);
/* Fleches du clavier */
var arrowKeys = {};
var ARROW_STEP = 0.06;
preview.addEventListener("mousedown", function(){
  preview.focus();
});
preview.addEventListener("keydown", function(e){
  if(e.key === "ArrowLeft" || e.key === "ArrowRight" ||
     e.key === "ArrowUp" || e.key === "ArrowDown"){
    arrowKeys[e.key] = true;
    e.preventDefault();
  }
});
preview.addEventListener("keyup", function(e){
  delete arrowKeys[e.key];
});
preview.addEventListener("blur", function(){
  arrowKeys = {};
});
/* Boucle de rendu en requestAnimationFrame : ne redessine que quand
   previewDirty est vrai, au rythme de l'ecran (au lieu d'un setInterval
   permanent a 33 fps qui consomme du CPU meme au repos) */
function renderLoop(){
  var kb = false;
  if(arrowKeys.ArrowLeft){  yaw += ARROW_STEP; kb = true; }
  if(arrowKeys.ArrowRight){ yaw -= ARROW_STEP; kb = true; }
  if(arrowKeys.ArrowUp){    pitch = Math.min(1.2, pitch + ARROW_STEP); kb = true; }
  if(arrowKeys.ArrowDown){  pitch = Math.max(-0.9, pitch - ARROW_STEP); kb = true; }
  if(kb){ previewDirty = true; }
  if(autoRotate.checked && !rotating && !painting3D){
    yaw += 0.035;
    previewDirty = true;
  }
  if(previewDirty){
    previewDirty = false;
    renderPreview();
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);
/* Bouton Partager PNG */
function partagerImage(mime, extension){
    if (!navigator.share) {
        alert("Le partage n'est pas disponible sur ce navigateur.");
        return;
    }
    var sourceCanvas = canvas;
    sourceCanvas.toBlob(function (blob) {
        if (!blob) {
            alert("Impossible de créer l'image.");
            return;
        }
        var file;
        try {
            file = new File([blob], "dessin." + extension, { type: mime });
        } catch (e) {
            file = null;
        }
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                title: "",
                text: "",
                files: [file]
            });
        } else {
            navigator.share({
                title: "",
                text: ""
            });
        }
    }, mime);
}
function sharePNG(){
    partagerImage("image/png", "png");
}
/* === LOUPE (modele 2D et 3D) === */
var IS_TOUCH_DEVICE = (window.matchMedia && window.matchMedia("(pointer:coarse)").matches) || ("ontouchstart" in window);
var loupeBox = document.getElementById("skinLoupe");
var loupeCvs = document.getElementById("skinLoupeCanvas");
var loupeCtx = loupeCvs.getContext("2d");
var loupeEnabled = document.getElementById("loupeEnabled");
var LOUPE_SIZE = 120;
function loupeZoomFor(srcCanvas){
  return srcCanvas === canvas ? 8 : 4;
}
function showLoupe(e, srcCanvas){
  if(!loupeEnabled.checked || !IS_TOUCH_DEVICE || e.clientX === undefined || !srcCanvas){ return; }
  loupeBox.style.display = "block";
  var lx = e.clientX + 20, ly = e.clientY + 20;
  if(lx + LOUPE_SIZE > window.innerWidth){  lx = e.clientX - LOUPE_SIZE - 20; }
  if(ly + LOUPE_SIZE > window.innerHeight){ ly = e.clientY - LOUPE_SIZE - 20; }
  loupeBox.style.left = lx + "px";
  loupeBox.style.top  = ly + "px";
  var r = srcCanvas.getBoundingClientRect();
  var px = (e.clientX - r.left) * srcCanvas.width / r.width;
  var py = (e.clientY - r.top) * srcCanvas.height / r.height;
  var z = loupeZoomFor(srcCanvas);
  var half = LOUPE_SIZE / (2 * z);
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, LOUPE_SIZE, LOUPE_SIZE);
  loupeCtx.drawImage(srcCanvas,
    px - half, py - half, half * 2, half * 2,
    0, 0, LOUPE_SIZE, LOUPE_SIZE);
  if(srcCanvas === canvas && gridCheck.checked){
    loupeCtx.strokeStyle = gridColorInput.value;
    loupeCtx.lineWidth = 1;
    loupeCtx.beginPath();
    var x0 = Math.floor(px - half) - 1;
    var x1 = Math.ceil(px + half) + 1;
    var y0 = Math.floor(py - half) - 1;
    var y1 = Math.ceil(py + half) + 1;
    var i;
    for(i = x0; i <= x1; i++){
      var lxg = (i - (px - half)) * z;
      loupeCtx.moveTo(lxg, 0);
      loupeCtx.lineTo(lxg, LOUPE_SIZE);
    }
    for(i = y0; i <= y1; i++){
      var lyg = (i - (py - half)) * z;
      loupeCtx.moveTo(0, lyg);
      loupeCtx.lineTo(LOUPE_SIZE, lyg);
    }
    loupeCtx.stroke();
  }
  loupeCtx.strokeStyle = "#000000";
  loupeCtx.lineWidth = 1;
  loupeCtx.strokeRect(
    LOUPE_SIZE / 2 - z / 2, LOUPE_SIZE / 2 - z / 2, z, z
  );
}
function hideLoupe(){ loupeBox.style.display = "none"; }
loupeEnabled.onchange = function(){ if(!this.checked){ hideLoupe(); } };
canvas.addEventListener("mouseleave", hideLoupe);
preview.addEventListener("mouseleave", hideLoupe);
/* --- INIT --- */
applyZoom();
try{
  renderPreview();
}catch(renderError){
  pctx.clearRect(0, 0, preview.width, preview.height);
  pctx.fillStyle = "#ffffff";
  pctx.font = "14px sans-serif";
  pctx.fillText("Rendu 3D simplifie indisponible", 10, 24);
}
