<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramme en bâtons ASCII</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
</head>
<body>
<h2>Diagramme en bâtons ASCII</h2>
<div class="container">
<div class="card">
  <h3>Données : libellé;valeur</h3>
  <textarea wrap="off" id="input">A;3
B;7
C;5
D;10</textarea><br>
  <button onclick="updateChart()">Mettre à jour texte</button>
  <button id="copyinput">Copier</button>
  <input type="file" id="textareaFileinput">
  <fieldset>
  <legend>Options</legend>
  <label>Largeur max des barres :
    <input type="number" id="maxWidth" value="25" min="1">
  </label><br>
  <label>Caractère de remplissage :
    <input type="text" id="barChar" value="." maxlength="1">
  </label><br>
  <label>Caractère de fond :
    <input type="text" id="bgChar" value=" " maxlength="1">
  </label><br>
  <label>Séparateur libellé :
    <input type="text" id="sep" value=" ">
  </label><br>
  <label>
    <input type="checkbox" id="normalize" checked="checked">
    Normaliser
  </label>
  <hr>
  <button onclick="exportOptions()">Exporter</button>
  <button onclick="showImportBox()">Importer</button>
  <button onclick="resetOptions()">Valeurs par défaut</button>
  <div id="importBox" style="display:none;">
    <textarea wrap="off" id="json"></textarea><br>
    <button onclick="applyImport()">Valider l'import</button>
    <button id="copyjson">Copier</button>
  </div>
  </fieldset>
</div>
<div class="card">
  <h3>Aperçu / texte</h3>
  <textarea wrap="off" id="output"></textarea><br>
  <button onclick="importFromOutput()">Mettre à jour données</button>
  <button id="copyoutput">Copier</button>
  <input type="file" id="textareaFileoutput">
</div>
</div>
<script src="outils.js"></script>
<script>
/* OPTIONS */
var barsConfig = {
    maxWidth: {
        id: "maxWidth",
        defaultValue: "25",
        type: "value"
    },
    barChar: {
        id: "barChar",
        defaultValue: ".",
        type: "value"
    },
    bgChar: {
        id: "bgChar",
        defaultValue: " ",
        type: "value"
    },
    sep: {
        id: "sep",
        defaultValue: " ",
        type: "value"
    },
    normalize: {
        id: "normalize",
        defaultValue: true,
        type: "checked"
    }
};
/* OUTILS */
function trimStr(s) {
    return s.replace(/^\s+/, '').replace(/\s+$/, '');
}
function repeatChar(ch, n) {
    var o = '', i;
    for (i = 0; i < n; i++) {
        o += ch;
    }
    return o;
}
function parseIntSafe(v, d) {
    var n = parseInt(v, 10);
    return isNaN(n) ? d : n;
}
function getOption(key) {
    var cfg = barsConfig[key];
    var el = document.getElementById(cfg.id);
    if (cfg.type === "checked") {
        return el.checked;
    }
    return el.value;
}
/* DIAGRAMME */
function updateChart() {
    var inputEl = document.getElementById("input");
    var outEl = document.getElementById("output");
    var maxWidth = parseIntSafe(getOption("maxWidth"), 25);
    if (maxWidth < 1) {
        maxWidth = 1;
    }
    var barChar = getOption("barChar").charAt(0) || ".";
    var bgChar = getOption("bgChar").charAt(0) || " ";
    var sep = getOption("sep");
    var normalize = getOption("normalize");
    var lines = inputEl.value.split(/\r?\n/);
    var items = [];
    var maxVal = 0;
    var i;
    for (i = 0; i < lines.length; i++) {
        var line = trimStr(lines[i]);
        if (!line) {
            continue;
        }
        var p = line.split(';');
        var label = trimStr(p[0]);
        var v = parseFloat(trimStr(p[1] || '0'));
        if (isNaN(v)) {
            v = 0;
        }
        if (v > maxVal) {
            maxVal = v;
        }
        items.push({
            label: label,
            value: v
        });
    }
    if (!items.length) {
        outEl.value = '';
        return;
    }
    if (!normalize && maxVal === 0) {
        maxVal = 1;
    }
    // Largeur automatique des labels
    var labelWidth = 0;
    for (i = 0; i < items.length; i++) {
        if (items[i].label.length > labelWidth) {
            labelWidth = items[i].label.length;
        }
    }
    var out = [];
    var width;
    var labelText;
    var bar;
    for (i = 0; i < items.length; i++) {
        var it = items[i];
        var v = it.value;
        if (normalize) {
            width = maxVal > 0
                ? Math.round((v / maxVal) * maxWidth)
                : 0;
        } else {
            width = Math.round(v);
            if (width > maxWidth) {
                width = maxWidth;
            }
        }
        if (width < 0) {
            width = 0;
        }
        labelText = it.label;
        labelText += repeatChar(' ', labelWidth - labelText.length);
        bar =
            repeatChar(barChar, width) +
            repeatChar(bgChar, maxWidth - width);
        var lineOut =
            (labelWidth > 0 ? labelText + sep : '') +
            bar +
            ' ' + v;
        out.push(lineOut);
    }
    outEl.value = out.join('\n');
}
/* MISE À JOUR DEPUIS LA SORTIE */
function importFromOutput() {
    var outText = document.getElementById('output').value;
    var sep = getOption("sep");
    var lines = outText.split(/\r?\n/);
    var inputLines = [];
    var i;
    for (i = 0; i < lines.length; i++) {
        var line = trimStr(lines[i]);
        if (!line) {
            continue;
        }
        var label = "";
        var value = "0";
        /* Trouver le label */
        var idx = sep ? line.indexOf(sep) : -1;
        if (idx >= 0) {
            label = trimStr(line.substring(0, idx));
        } else {
            /* Fallback : avant les barres */
            var guess = line.split(/[#\-\+\=\*]/)[0];
            label = trimStr(guess);
        }
        /* Retirer un éventuel : ou | final */
        if (label.charAt(label.length - 1) === ':' ||
            label.charAt(label.length - 1) === '|') {
            label = trimStr(
                label.substring(0, label.length - 1)
            );
        }
        /* Trouver la valeur à la fin */
        var j = line.length - 1;
        while (j >= 0 && line.charAt(j) === ' ') {
            j--;
        }
        var end = j + 1;
        while (j >= 0) {
            var c = line.charAt(j);
            if ((c >= '0' && c <= '9') ||
                c === '.' ||
                c === '-') {
                j--;
            } else {
                break;
            }
        }
        var start = j + 1;
        var valStr = trimStr(
            line.substring(start, end)
        );
        if (valStr !== "") {
            value = valStr;
        }
        inputLines.push(label + ";" + value);
    }
    document.getElementById('input').value =
        inputLines.join("\n");
    updateChart();
}
/* SAUVEGARDE AUTOMATIQUE */
function saveState() {
    var data = {};
    var key;
    var cfg;
    var el;
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (cfg.type === "checked") {
            data[key] = el.checked;
        } else {
            data[key] = el.value;
        }
    }
    localStorage.setItem("options", JSON.stringify(data));
}
/* RESTAURATION AUTOMATIQUE */
function loadState() {
    var raw = localStorage.getItem("options");
    var data;
    var key;
    var cfg;
    var el;
    if (!raw) {
        return;
    }
    try {
        data = JSON.parse(raw);
    } catch (e) {
        return;
    }
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (data[key] === undefined) {
            continue;
        }
        if (cfg.type === "checked") {
            el.checked = data[key];
        } else {
            el.value = data[key];
        }
    }
}
/* VALEURS PAR DÉFAUT */
function resetOptions() {
    var key;
    var cfg;
    var el;
    localStorage.removeItem("options");
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (cfg.type === "checked") {
            el.checked = cfg.defaultValue;
        } else {
            el.value = cfg.defaultValue;
        }
    }
    updateChart();
}
/* LIAISON DES OPTIONS */
function bindOptions() {
    var key;
    var cfg;
    var el;
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (cfg.type === "checked") {
            el.onchange = saveState;
        } else {
            el.oninput = saveState;
        }
    }
}
/* EXPORT MANUEL */
function exportOptions() {
    var data = {};
    var key;
    var cfg;
    var el;
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (cfg.type === "checked") {
            data[key] = el.checked ? 1 : 0;
        } else {
            data[key] = el.value;
        }
    }
    document.getElementById("json").value =
        JSON.stringify(data, null, 2);
    document.getElementById("importBox").style.display =
        "block";
}
/* IMPORT MANUEL */
function showImportBox() {
    document.getElementById("importBox").style.display =
        "block";
}
function applyImport() {
    var txt = document.getElementById("json").value;
    if (!txt) {
        return;
    }
    var data;
    try {
        data = JSON.parse(txt);
    } catch (e) {
        alert("JSON invalide.");
        return;
    }
    var key;
    var cfg;
    var el;
    for (key in barsConfig) {
        cfg = barsConfig[key];
        el = document.getElementById(cfg.id);
        if (data[key] === undefined) {
            continue;
        }
        if (cfg.type === "checked") {
            el.checked =
                data[key] == 1 ||
                data[key] === true;
        } else {
            el.value = data[key];
        }
    }
    saveState();
    updateChart();
    document.getElementById("importBox").style.display =
        "none";
}
/* PARAMETRES URL */
function getURLParams() {
    var params = {};
    var search = window.location.search;
    var parts;
    var pair;
    var key;
    var value;
    var i;
    if (!search || search.length < 2) {
        return params;
    }
    parts = search.substring(1).split("&");
    for (i = 0; i < parts.length; i++) {
        if (!parts[i]) {
            continue;
        }
        pair = parts[i].split("=");
        try {
            key = decodeURIComponent(
                pair[0].replace(/\+/g, " ")
            );
            value = decodeURIComponent(
                pair.slice(1).join("=").replace(/\+/g, " ")
            );
        } catch (e) {
            continue;
        }
        params[key] = value;
    }
    return params;
}
/* APPLICATION DES PARAMETRES URL */
function applyURLParams() {
    var params = getURLParams();
    var el;
    var value;
    var action = "";
    var key;
    var i;
    // Largeur maximale des barres
    if (params.maxWidth !== undefined) {
        value = params.maxWidth;
        if (/^\d+$/.test(value) &&
            parseInt(value, 10) >= 1) {
            document.getElementById("maxWidth").value = value;
        }
    }
    // Caractère de remplissage
    if (params.barChar !== undefined &&
        params.barChar.length > 0) {
        document.getElementById("barChar").value =
            params.barChar.charAt(0);
    }
    // Caractère de fond
    if (params.bgChar !== undefined &&
        params.bgChar.length > 0) {
        document.getElementById("bgChar").value =
            params.bgChar.charAt(0);
    }
    // Séparateur du libellé
    if (params.sep !== undefined) {
        document.getElementById("sep").value = params.sep;
    }
    // Normalisation
    if (params.normalize !== undefined) {
        value = params.normalize.toLowerCase();
        if (value === "1" ||
            value === "true" ||
            value === "on") {
            document.getElementById("normalize").checked = true;
        } else if (value === "0" ||
                   value === "false" ||
                   value === "off") {
            document.getElementById("normalize").checked = false;
        }
    }
    // Action à exécuter selon textareafile
    if (params.textareafile !== undefined) {
        value = params.textareafile.split("|");
        action = value[0].toLowerCase();
    }
    return action;
}
/* INITIALISATION */
function init() {
    var action;
    // Charger d'abord les options sauvegardées
    loadState();
    // Les paramètres URL sont prioritaires
    action = applyURLParams();
    // Activer la sauvegarde automatique
    bindOptions();
    // Exécuter l'action demandée
    setTimeout(function () {
        if (action === "input") {
            updateChart();
        } else if (action === "output") {
            importFromOutput();
        } else {
            updateChart();
        }
    }, 50);
}
if (window.attachEvent) {
    window.attachEvent('onload', init);
} else if (window.addEventListener) {
    window.addEventListener('load', init, false);
} else {
    window.onload = init;
}
/* MISE À JOUR AU BLUR */
function setupBlurinput(id) {
    var el = document.getElementById(id);
    if (el.addEventListener) {
        el.addEventListener('blur', updateChart, false);
        el.addEventListener('change', updateChart, false);
    } else if (el.attachEvent) {
        el.attachEvent('onblur', updateChart);
        el.attachEvent('onchange', updateChart);
    }
}
function setupBluroutput(id) {
    var el = document.getElementById(id);
    if (el.addEventListener) {
        el.addEventListener('blur', importFromOutput, false);
        el.addEventListener('change', importFromOutput, false);
    } else if (el.attachEvent) {
        el.attachEvent('onblur', importFromOutput);
        el.attachEvent('onchange', importFromOutput);
    }
}
setupBlurinput('maxWidth');
setupBlurinput('barChar');
setupBlurinput('bgChar');
setupBlurinput('sep');
setupBlurinput('normalize');
setupBlurinput('input');
setupBluroutput('output');
</script>
</body>
</html>
